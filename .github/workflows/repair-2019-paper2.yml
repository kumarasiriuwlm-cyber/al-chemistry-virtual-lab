name: Replace 2019 Paper II Sinhala question crops

on:
  push:
    paths:
      - 'scripts/repair_2019_paper2.py'
      - '.github/workflows/repair-2019-paper2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chemistry-repair-2019-paper2
  cancel-in-progress: false

jobs:
  rebuild-2019-paper2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF image tools
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Crop only ten original Sinhala Paper II questions
        run: python scripts/repair_2019_paper2.py
      - name: Validate all 60 records and ten Paper II images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          rows=json.loads(Path('past-papers/2019/questions.json').read_text(encoding='utf-8'))
          assert len(rows)==60
          assert sum(x['part']=='I' for x in rows)==50
          assert sum(x['type']=='structured_essay' for x in rows)==4
          assert sum(x['type']=='essay' for x in rows)==6
          for n in range(1,11):
              row=next(x for x in rows if x['part']=='II' and x['number']==n)
              assert row['language']=='si'
              assert row['source_type']=='original_sinhala_exam_question'
              assert row['contains_answers'] is False
              p=Path(row['image'])
              with Image.open(p) as im:
                  assert im.width>=850 and im.height>=120
              assert p.stat().st_size>5000
          print('PASS: 10 real Sinhala 2019 Paper II questions; all 50 original MCQs preserved')
          PY
      - name: Publish replacement Paper II images and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add past-papers/2019/II past-papers/2019/questions.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace all 2019 Paper II answers with ten complete original Sinhala exam questions"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "2019 Paper II already updated"
          fi
