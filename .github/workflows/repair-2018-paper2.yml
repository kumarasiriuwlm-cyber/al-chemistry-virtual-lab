name: Correct 2018 Chemistry Paper II Sinhala questions

on:
  push:
    paths:
      - 'scripts/repair_2018_paper2.py'
      - '.github/workflows/repair-2018-paper2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chemistry-p2-recut-2018
  cancel-in-progress: false

jobs:
  update-2018-paper-two:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image extraction libraries
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Generate 2018 Paper II images only
        run: python scripts/repair_2018_paper2.py
      - name: Verify all 10 updated images and preserve MCQ count
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('past-papers/2018')
          rows=json.loads((root/'questions.json').read_text(encoding='utf-8'))
          assert len(rows)==60
          assert sum(x['part']=='I' for x in rows)==50
          assert sum(x['part']=='II' and x['type']=='structured_essay' for x in rows)==4
          assert sum(x['part']=='II' and x['type']=='essay' for x in rows)==6
          for n in range(1,11):
            path=root/'II'/f'q{n:02d}.webp'
            with Image.open(path) as pic:
              assert pic.width>=850 and pic.height>=100,(n,pic.size)
            assert path.stat().st_size>3000
          print('PASS: all 10 Sinhala Paper II questions validated')
          PY
      - name: Commit Paper II images without changing existing MCQs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add past-papers/2018/II/ past-papers/2018/questions.json
          if ! git diff --cached --quiet; then
            git commit -m "Replace 2018 Paper II with 10 complete Sinhala question crops"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "2018 Paper II crops already current"
          fi
