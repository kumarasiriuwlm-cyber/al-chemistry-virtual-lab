name: Prepare 2015 Chemistry question images

on:
  push:
    paths:
      - 'scripts/build_2015_questions.py'
      - '.github/workflows/build-2015-questions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chemistry-crops-2015
  cancel-in-progress: false

jobs:
  prepare-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF renderer
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Crop 2015 Part I and Part II
        run: python scripts/build_2015_questions.py
      - name: Validate all 60 crops
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('past-papers/2015')
          rows=json.loads((root/'questions.json').read_text(encoding='utf-8'))
          assert len(rows)==60
          assert sum(x['part']=='I' for x in rows)==50
          assert sum(x['part']=='II' for x in rows)==10
          for entry in rows:
              path=Path(entry['image'])
              assert path.exists(), str(path)
              with Image.open(path) as im:
                  assert im.width>=700 and im.height>=35, str(path)
          print('PASS: 50 MCQ crops, 10 Part II crops, 60 valid images')
          PY
      - name: Upload generated questions into website repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add past-papers/2015/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 60 cropped 2015 Chemistry questions"
            git push origin HEAD:main
          else
            echo "Question images already up to date."
          fi
