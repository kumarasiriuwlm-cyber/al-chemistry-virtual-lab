name: Publish 2024 Chemistry question images
on:
  push:
    paths:
      - 'scripts/build_2024_questions.py'
      - '.github/workflows/build-2024-questions.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chemistry-crops-2024
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF support
        run: python -m pip install --disable-pip-version-check pymupdf pillow
      - name: Generate cropped images
        run: python scripts/build_2024_questions.py
      - name: Check completeness and image files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          folder=Path("past-papers/2024")
          rows=json.loads((folder/"questions.json").read_text(encoding="utf-8"))
          assert len(rows)==60, len(rows)
          assert sum(item["part"]=="I" for item in rows)==50
          assert sum(item["part"]=="II" for item in rows)==10
          assert sum(item["type"]=="structured_essay" for item in rows)==4
          for item in rows:
              file=Path(item["image"])
              assert file.is_file(),str(file)
              with Image.open(file) as image:
                  assert image.width>700 and image.height>30, (str(file),image.size)
          print("PASS 2024: 60 individual questions")
          PY
      - name: Commit question images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add past-papers/2024/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 60 cropped 2024 Chemistry questions"
            for attempt in 1 2 3 4 5 6 7; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Published 2024 images"
                exit 0
              fi
              sleep 3
            done
            echo "Failed publication after retries"
            exit 1
          fi
