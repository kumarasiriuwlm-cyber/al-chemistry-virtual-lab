en:[
{t:"Atomic models and subatomic particles",b:["Cathode-ray experiments established the existence of negatively charged electrons.","Positive-ray observations showed that positive ions can be produced in discharge tubes.","Rutherford scattering led to the nuclear model: most of the atom is empty space and positive charge is concentrated in a very small nucleus.","Protons and neutrons occupy the nucleus; electrons occupy regions outside the nucleus."],f:"electron: e⁻   proton: p⁺   neutron: n⁰",v:"rutherford"},
{t:"Atomic number, mass number and isotopes",b:["Atomic number Z = number of protons.","Mass number A = protons + neutrons, therefore N = A − Z.","Isotopes have the same Z but different neutron numbers.","Relative atomic mass is a weighted mean of isotopic masses and their natural abundances."],f:"⁽ᴬ⁾₍Z₎X   •   N = A − Z   •   Aᵣ = Σ(isotopic mass × fractional abundance)"},
{t:"Electromagnetic radiation",b:["Electromagnetic radiation can be described by wavelength λ and frequency ν.","All electromagnetic radiation travels at c in vacuum.","Photon energy increases with frequency and decreases with wavelength."],f:"c = νλ   •   E = hν = hc/λ"},
{t:"Atomic spectra and energy levels",b:["Electrons in atoms occupy quantized energy levels.","Absorption occurs when an electron gains exactly the energy required for a higher level.","Emission occurs when an electron falls to a lower level and releases a photon.","The hydrogen line spectrum provides evidence for quantized energy levels."],f:"ΔE = hν",v:"spectrum"},
{t:"Orbitals and quantum numbers",b:["An orbital is a region described by a wavefunction where an electron has a high probability of being found.","s orbitals are spherical; p orbitals have two lobes.","Each orbital holds a maximum of two electrons with opposite spins.","Subshell capacities: s = 2, p = 6, d = 10, f = 14."],f:"n, l, mₗ, mₛ"},
{t:"Electron configuration",b:["Electrons fill lower-energy orbitals first (Aufbau principle).","No two electrons in an atom have the same set of four quantum numbers (Pauli principle).","Degenerate orbitals are singly occupied before pairing (Hund rule).","Configurations such as Cr and Cu show familiar stability-related exceptions to the simplest filling order."],f:"1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p",v:"config"},
{t:"Periodic trends",b:["Across a period, effective nuclear attraction generally increases.","Atomic radius generally decreases across a period and increases down a group.","First ionization energy generally increases across a period, with known exceptions.","Electronegativity generally increases across a period and decreases down a group."],f:"trend reasoning = nuclear charge + shielding + distance + electron configuration"}
],

"පදාර්ථයේ අති සුළු මූලික ඒකක පිළිබඳ අදහස ඩිමොක්‍රිටස් වැනි පුරාණ දාර්ශනිකයන්ගෙන් ආරම්භ වූ අතර 1808 දී ජෝන් ඩෝල්ටන් (Dalton) එය විද්‍යාත්මක පරමාණුක වාදයක් ලෙස සංවිධානය කළේය. ඩෝල්ටන් (Dalton)ගේ ප්‍රධාන අදහස් වූයේ මූලද්‍රව්‍ය පරමාණු වලින් සමන්විත වීම, එකම මූලද්‍රව්‍යයේ පරමාණු අතර සමානත්වය, රසායනික ප්‍රතික්‍රියාවලදී පරමාණු නිර්මාණය/විනාශ නොවීම සහ සංයෝග සරල පූර්ණ සංඛ්‍යා අනුපාතවලින් සෑදීමයි.",
"අඩු පීඩන වායුවක් සහිත විද්‍යුත් විසර්ජන නළයකට ඉහළ විභව අන්තරයක් යෙදූ විට කැතෝඩයෙන් ඇනෝඩය දෙසට ගමන් කරන ඍණ ආරෝපිත කදම්බය කැතෝඩ කිරණ ලෙස හැඳින්වේ. ඒවා සෘජු රේඛාවක ගමන් කරයි, ස්කන්ධය හා චාලක ශක්තිය ඇති අංශු කදම්බයක් ලෙස හැසිරෙයි, ප්‍රතිදීප්තතාව ඇති කළ හැකි අතර විද්‍යුත් හා චුම්බක ක්ෂේත්‍රවලදී අපගමනය වේ.",
"කැතෝඩ කිරණවල ස්වභාවය නළයේ වායුව හෝ කැතෝඩය සෑදූ ද්‍රව්‍යය වෙනස් කළත් වෙනස් නොවන බව ජේ. ජේ. තොම්සන් (J. J. Thomson) පෙන්වා දුන්නේය. ඔහු e/m ≈ 1.76 × 10⁸ C g⁻¹ ලෙස ආරෝපණය/ස්කන්ධ අනුපාතය නිරණය කළ අතර කැතෝඩ කිරණ ඍණ ආරෝපිත අංශු කදම්බයක් ලෙස විස්තර කළේය.",
"තොම්සන් (Thomson) විසින් ධන ආරෝපිත ගෝලයක් තුළ ඉලෙක්ට්‍රෝන පැතිරී ඇති ‘plum-pudding’ ආකෘතිය යෝජනා කළේය. පසුව මිලිකන් (Millikan)ගේ oil-drop පරීක්ෂණයෙන් ඉලෙක්ට්‍රෝනයේ ආරෝපණයේ විශාලත්වය |e| = 1.602 × 10⁻¹⁹ C ලෙස ලැබුණු අතර තොම්සන් (Thomson)ගේ e/m අගය සමඟ එය භාවිත කර ඉලෙක්ට්‍රෝන ස්කන්ධය ≈ 9.10 × 10⁻²⁸ g ලෙස ගණනය කළ හැකි විය.",
"ගෝල්ඩ්ස්ටයින් (Goldstein)ගේ සිදුරු සහිත කැතෝඩ නළ පරීක්ෂණවලින් ධන කිරණ (canal rays) හඳුනා ගන්නා ලදී. ඒවා ධන ආරෝපිත අයනවලින් සමන්විත වන අතර ස්වභාවය නළයේ වායුව මත රඳා පවතී. හයිඩ්‍රජන් වායුවෙන් ලැබෙන සැහැල්ලුම ධන අංශුව ප්‍රෝටෝනයයි; එහි ආරෝපණය +1.602 × 10⁻¹⁹ C සහ සාපේක්ෂ ස්කන්ධය ආසන්න වශයෙන් 1 වේ.",
"විකිරණශීලී ද්‍රව්‍යවලින් α, β සහ γ විකිරණ නිකුත් වේ. α අංශු ධන ආරෝපිත, β අංශු ඉලෙක්ට්‍රෝන ස්වභාවයෙන් ඍණ ආරෝපිත වන අතර γ විකිරණයට ආරෝපණයක් නැත. එබැවින් විද්‍යුත් ක්ෂේත්‍රයකදී α හා β විරුද්ධ දිශාවලට අපගමනය වන අතර γ අපගමනය නොවේ.",
"රදර්ෆර්ඩ්ගේ රන් පත්‍ර පරීක්ෂණයේදී බොහෝ α අංශු සෘජුව ගමන් කළ අතර, සුළු ප්‍රමාණයක් විශාල කෝණවලින් අපගමනය වී ඉතා සුළු සංඛ්‍යාවක් ආපසු වික්ෂේප විය. එයින් පරමාණුවේ වැඩි කොටස හිස් අවකාශයක් බවත් ධන ආරෝපණය සහ වැඩි ස්කන්ධය ඉතා කුඩා, ඝන න්‍යෂ්ටියක සංකේන්ද්‍රණය වී ඇති බවත් නිගමනය කෙරිණි. බෝර් (Bohr) විසින් න්‍යෂ්ටිය වටා ඉලෙක්ට්‍රෝන නිශ්චිත කක්ෂවල පවතින බව යෝජනා කර රදර්ෆර්ඩ් (Rutherford) ආකෘතිය සංවර්ධනය කළේය."
],f:"e/m ≈ 1.76 × 10⁸ C g⁻¹   •   |e| = 1.602 × 10⁻¹⁹ C   •   mₑ ≈ 9.10 × 10⁻²⁸ g",v:"atomic_si",exam:["ඩෝල්ටන් (Dalton)ගේ ප්‍රධාන උපකල්පන","කැතෝඩ කිරණ හා ධන කිරණවල පරීක්ෂණාත්මක ගුණ සසඳා හඳුනා ගැනීම","තොම්සන් (Thomson)ගේ e/m අගය හා මිලිකන් (Millikan)ගේ |e| අගය සම්බන්ධ කිරීම","α, β, γ විකිරණ විද්‍යුත් ක්ෂේත්‍රයකදී හැසිරීම","රදර්ෆර්ඩ් පරීක්ෂණයේ නිරීක්ෂණ සහ නිගමන සම්බන්ධ කිරීම"]},
{t:"පරමාණුක ක්‍රමාංකය, නියුක්ලයිඩ, සමස්ථානික, අයන සහ සාපේක්ෂ පරමාණුක ස්කන්ධය",b:[
"පරමාණුක ක්‍රමාංකය Z යනු න්‍යෂ්ටියේ ප්‍රෝටෝන ගණනයි. ස්කන්ධ ක්‍රමාංකය A = ප්‍රෝටෝන + නියුට්‍රෝන. එබැවින් නියුට්‍රෝන ගණන N = A − Z වේ. විද්‍යුත්-නිර්පේක්ෂ පරමාණුවක ඉලෙක්ට්‍රෝන ගණන ද Z ට සමාන වේ.",
"මෝස්ලි (Moseley)ගේ කාර්යය පරමාණුක ක්‍රමාංකය මූලද්‍රව්‍යයක අනන්‍ය ලක්ෂණයක් බව තහවුරු කිරීමට වැදගත් විය. න්‍යෂ්ටියේ ඇති ප්‍රෝටෝන සහ නියුට්‍රෝන එකට නියුක්ලියෝන ලෙස හැඳින්වෙන අතර නියුක්ලයිඩයක් ᴬZX ලෙස නිරූපණය කරයි.",

"ආවර්තයක් හරහා Z_eff වැඩි වන නිසා පරමාණුක අරය සාමාන්‍යයෙන් අඩු වේ. කාණ්ඩයක් පහළට නව ඉලෙක්ට්‍රෝන කවච එකතු වන නිසා පරමාණුක අරය වැඩි වේ.",
"ධන අයනය එහි මව් පරමාණුවට වඩා කුඩාය; ඍණ අයනය මව් පරමාණුවට වඩා විශාලය. සම-ඉලෙක්ට්‍රෝනික අංශු O²⁻, F⁻, Ne, Na⁺, Mg²⁺ වැනි ශ්‍රේණියකදී ඉලෙක්ට්‍රෝන ගණන එකම බැවින් න්‍යෂ්ටික ආරෝපණය වැඩි වන විට අරය අඩු වේ.",
"පළමු අයනීකරණ ශක්තිය යනු භූමි තත්ත්වයේ ඒකක වායුමය පරමාණුවකින් වඩාත් ලිහිල්ව බැඳුණු ඉලෙක්ට්‍රෝනය ඉවත් කිරීමට අවශ්‍ය අවම ශක්තියයි. එය සාමාන්‍යයෙන් ආවර්තයක් හරහා වැඩි වන අතර කාණ්ඩයක් පහළට අඩු වේ. පිරුණු හෝ අර්ධ-පිරුණු උපකවචවල අමතර ස්ථායීතාව නිසා Be→B සහ N→O වැනි අපවාද පවතී.",
"ඉලෙක්ට්‍රෝන ලබා ගැනීමේ ශක්ති වෙනස ΔE_EG යනු වායුමය පරමාණුවකට ඉලෙක්ට්‍රෝනයක් එක් කළ විට සිදුවන ශක්ති වෙනසයි. බොහෝ පරමාණු සඳහා එය ඍණ අගයක් වන අතර ශක්තිය නිදහස් වේ; උදාහරණ ලෙස Cl(g)+e⁻→Cl⁻(g), ΔE_EG ≈ −349 kJ mol⁻¹. Be හා N වැනි ස්ථායී උපකවච වින්‍යාස සඳහා එය ධන විය හැක.",
"ඉලෙක්ට්‍රෝන බන්ධුතාව (electron affinity, EA) සහ ΔE_EG ලකුණෙන් විරුද්ධ නමුත් විශාලත්වයෙන් සම්බන්ධ වේ: ΔE_EG = −EA. ආවර්තයක් හරහා electron affinity සාමාන්‍යයෙන් වඩාත් ධන වන අතර කාණ්ඩයක් පහළට එහි ප්‍රවණතාව අඩු වේ.",
"විද්‍යුත් ඍණතාව යනු අණුවක බන්ධනයකට සහභාගී වන ඉලෙක්ට්‍රෝන තමන් වෙත ආකර්ෂණය කර ගැනීමේ පරමාණුවක හැකියාවයි. පෝලින් (Pauling) පරිමාණයේදී එය ආවර්තයක් හරහා සාමාන්‍යයෙන් වැඩි වන අතර කාණ්ඩයක් පහළට අඩු වේ. බන්ධනයක පරමාණු දෙක අතර විද්‍යුත් ඍණතා වෙනස වැඩි වන විට බන්ධනයේ අයනික ස්වභාවය වැඩි වේ."
],f:"Z_eff < Z   •   cation radius < atom < anion radius   •   ΔE_EG = −EA",exam:["වෑන් ඩර් වාල්ස්/සහසංයුජ/ලෝහීය අරයන් අර්ථ දැක්වීම","ඵලදායී න්‍යෂ්ටික ආරෝපණය හා ආවරණ බලපෑමෙන් ප්‍රවණතා පැහැදිලි කිරීම","පරමාණුක/අයනික අරයන් අනුපිළිවෙළට තැබීම","සම-ඉලෙක්ට්‍රෝනික අංශු අනුපිළිවෙළට තැබීම","අයනීකරණ ශක්ති ප්‍රවණතාව හා Be/B, N/O වැනි අපවාද","ඉලෙක්ට්‍රෝන ලබා ගැනීමේ ශක්ති වෙනස හා electron affinity සම්බන්ධතාව","විද්‍යුත් ඍණතා ප්‍රවණතාව සහ බන්ධන ස්වභාවය"]}

{t:"அணு மாதிரிகள் மற்றும் துணைஅணுத் துகள்கள்",b:["Cathode-ray பரிசோதனைகள் எதிர்மின்னூட்டம் கொண்ட electron இருப்பை உறுதிப்படுத்தின.","Positive-ray அவதானிப்புகள் discharge tube இல் positive ions உருவாகலாம் என்பதை காட்டின.","Rutherford scattering மூலம் அணுவின் பெரும்பகுதி வெற்றிடம் என்றும் positive charge மிகச் சிறிய nucleus இல் திரண்டுள்ளது என்றும் அறியப்பட்டது.","Proton மற்றும் neutron nucleus இல்; electron nucleus க்கு வெளியே உள்ள பகுதிகளில் காணப்படுகின்றன."],f:"electron: e⁻   proton: p⁺   neutron: n⁰",v:"rutherford"},
{t:"அணு எண், நிறை எண் மற்றும் isotopes",b:["அணு எண் Z = proton எண்ணிக்கை.","நிறை எண் A = proton + neutron; ஆகவே N = A − Z.","Isotope களில் Z ஒரேதாகவும் neutron எண்ணிக்கை வேறுபட்டதாகவும் இருக்கும்.","Relative atomic mass என்பது isotopic mass மற்றும் natural abundance அடிப்படையிலான weighted mean."],f:"⁽ᴬ⁾₍Z₎X   •   N = A − Z   •   Aᵣ = Σ(isotopic mass × fractional abundance)"},
{t:"மின்காந்தக் கதிர்வீச்சு",b:["மின்காந்தக் கதிர்வீச்சை wavelength λ மற்றும் frequency ν மூலம் விவரிக்கலாம்.","Vacuum இல் அனைத்தும் c வேகத்தில் பயணிக்கின்றன.","Photon energy frequency உடன் அதிகரித்து wavelength உடன் குறைகிறது."],f:"c = νλ   •   E = hν = hc/λ"},
{t:"அணு நிறமாலை மற்றும் ஆற்றல் மட்டங்கள்",b:["Electron கள் quantized energy levels இல் உள்ளன.","மேலான level க்கு செல்ல துல்லியமான energy உறிஞ்சப்படுகிறது.","கீழ் level க்கு வரும் போது photon வெளியிடப்படுகிறது.","Hydrogen line spectrum quantized energy levels க்கு ஆதாரம்."],f:"ΔE = hν",v:"spectrum"},
{t:"Orbital மற்றும் quantum numbers",b:["Orbital என்பது electron இருப்பதற்கான அதிக probability உள்ள பகுதியை குறிக்கிறது.","s orbital கோள வடிவம்; p orbital இரு-lobe வடிவம்.","ஒரு orbital இல் அதிகபட்சம் இரண்டு electron கள் எதிர் spin உடன் இருக்கலாம்.","Subshell capacities: s = 2, p = 6, d = 10, f = 14."],f:"n, l, mₗ, mₛ"},
{t:"Electron configuration",b:["Electron கள் குறைந்த energy orbital களை முதலில் நிரப்புகின்றன (Aufbau principle).","ஒரே அணுவில் இரண்டு electron களுக்கு ஒரே நான்கு quantum numbers இருக்க முடியாது (Pauli principle).","Degenerate orbital கள் pairing க்கு முன் singly occupied ஆகும் (Hund rule).","Cr மற்றும் Cu இல் எளிய filling order க்கு exceptions உள்ளன."],f:"1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p",v:"config"},
{t:"தனிம வரிசைப் போக்குகள்",b:["ஒரு period முழுவதும் effective nuclear attraction பொதுவாக அதிகரிக்கிறது.","Atomic radius period முழுவதும் பொதுவாக குறைந்து group கீழே அதிகரிக்கிறது.","First ionization energy period முழுவதும் பொதுவாக அதிகரிக்கிறது; சில exceptions உள்ளன.","Electronegativity period முழுவதும் பொதுவாக அதிகரித்து group கீழே குறைகிறது."],f:"trend reasoning = nuclear charge + shielding + distance + electron configuration"}

ta:{q:"ஆரம்ப atomic models இலிருந்து நவீன nuclear picture வரை வழிநடத்திய experimental evidence ஐ விவாதித்து, அதை subatomic particles இன் இருப்பும் அமைப்பும் உடன் தொடர்புபடுத்துக.",plan:["Cathode rays மற்றும் electron","Positive rays / positive ions","Rutherford scattering observations","Nuclear model conclusions","Proton, neutron மற்றும் electron","Z, A மற்றும் isotope தொடர்பு"],model:"வலுவான பதில் model பட்டியலாக மட்டும் இல்லாமல் evidence → observation → inference என்ற ஓட்டத்தில் இருக்க வேண்டும். மிகச் சிறிய positive nucleus இல் mass பெரும்பகுதி திரண்டுள்ளது; electron கள் வெளியே உள்ளன என்ற முடிவை evidence உடன் இணைக்கவும். பின்னர் proton number → Z, proton + neutron → A, isotope வேறுபாடு → neutron number என தொடர்புபடுத்தவும்."}};

function journeyPointX(j,count){
 if(j===0)return 50;

}
function journeyCurvePath(count){
 count=Math.max(2,count||2);
 var d="M50 0",px=50,py=0;
 for(var j=1;j<count;j++){
  var x=journeyPointX(j,count),y=(j/(count-1))*100,dy=y-py;
  d+=" C "+px+" "+(py+dy*.44)+" "+x+" "+(y-dy*.44)+" "+x+" "+y;

}

}

 "5-2-2":"දහන තාපය මැනීමට භාවිත කරන බෝම්බ කැලරිමීටරයකි. ප්‍රතික්‍රියා කුටියෙන් නිකුත් වන තාපය දන්නා තාප ධාරිතාවක් ඇති වටපිටාවට මාරු වීමෙන් උෂ්ණත්ව වෙනස මනිනු ලැබේ.",

 "5-5-0":"හෙස් නීතියේ මූලික අදහස: ආරම්භක හා අවසාන අවස්ථා එකම නම් සෘජු මාර්ගයේ ΔH සහ පියවර කිහිපයක මාර්ගයේ ΣΔH එකම වේ.",
 "5-6-2":"LiF සඳහා බෝර්න්–හේබර් චක්‍රය. උර්ධවපාතනය/පරමාණුකරණය, අයනීකරණය, ඉලෙක්ට්‍රෝන ලබාගැනීම හා දැලිස් සෑදීම හෙස් නීතියෙන් එකම ශක්ති චක්‍රයකට සම්බන්ධ කරයි.",

{t:"සහසංයුජ බන්ධන, අෂ්ටක නියමය සහ ලුවිස් ව්‍යුහ",b:["සහසංයුජ බන්ධනයක් සෑදෙන්නේ පරමාණු දෙකක් අතර ඉලෙක්ට්‍රෝන යුගලයක් හවුලේ තබා ගැනීමෙනි. සාමාන්‍යයෙන් එක් එක් පරමාණුව බැඳුම් ඉලෙක්ට්‍රෝනයක් බැගින් සපයන අතර බන්ධනය මගින් සංයුජතා කවචයේ වඩා ස්ථායී ඉලෙක්ට්‍රෝන වින්‍යාසයක් ලබාගැනීමට හැකි වේ.","දෙවන ආවර්තයේ C, N, O සහ F වැනි මූලද්‍රව්‍ය අෂ්ටකය සම්පූර්ණ කිරීමට ප්‍රබල ප්‍රවණතාවක් දක්වයි. තුන්වන සහ පසුව ආවර්තවල සමහර මධ්‍ය පරමාණු සඳහා අෂ්ටකයට වඩා වැඩි ඉලෙක්ට්‍රෝන පැවතිය හැකි අතර Be, B, Al වැනි පරමාණු අෂ්ටකය සම්පූර්ණ නොකර ඉලෙක්ට්‍රෝන හිඟ සංයෝග සෑදිය හැක.","NO සහ NO₂ වැනි ඔත්තේ සංයුජතා ඉලෙක්ට්‍රෝන සංඛ්‍යාවක් ඇති ප්‍රභේදවල සියලු පරමාණු සඳහා සම්පූර්ණ අෂ්ටකයක් ලබාදිය නොහැක. එබැවින් අෂ්ටක නියමය වැදගත් මාර්ගෝපදේශයක් වුවත් එය සෑම ව්‍යුහයකටම අනිවාර්ය නොවේ.","ලුවිස් තිත් සටහනක් සඳහා මුළු සංයුජතා ඉලෙක්ට්‍රෝන ගණන ගණනය කරයි; ඍණ ආරෝපණයක් සඳහා ඉලෙක්ට්‍රෝන එකතු කර ධන ආරෝපණයක් සඳහා අඩු කරයි. සාමාන්‍යයෙන් H සහ F මධ්‍ය පරමාණු නොවන අතර, මධ්‍ය පරමාණුව ලෙස අඩු විද්‍යුත් ඍණතාවක් ඇති සහ බන්ධන කිහිපයක් සෑදිය හැකි පරමාණුව තෝරයි.","පළමුව මධ්‍ය හා පර්යන්ත පරමාණු අතර තනි බන්ධන සලකුණු කර පර්යන්ත පරමාණුවල අෂ්ටක සම්පූර්ණ කරයි. ඉතිරි ඉලෙක්ට්‍රෝන මධ්‍ය පරමාණුව මත තබා අවශ්‍ය නම් lone pair බන්ධන යුගල බවට පරිවර්තනය කර ද්විත්ව හෝ ත්‍රිත්ව බන්ධන සෑදීමෙන් වඩා සුදුසු ලුවිස් ව්‍යුහය ලබාගනී."],f:"මුළු valence e⁻ = Σ(valence e⁻) ± charge   •   single = 1 shared pair   •   double = 2 shared pairs   •   triple = 3 shared pairs",exam:["මුළු සංයුජතා ඉලෙක්ට්‍රෝන ගණන සොයා Lewis structure ඇඳීම","අෂ්ටකයට වඩා අඩු/වැඩි සහ odd-electron ප්‍රභේද හඳුනාගැනීම","මධ්‍ය පරමාණුව නිවැරදිව තෝරා ගැනීම","single/double/triple bond හඳුනාගැනීම"]},
{t:"දායක සහසංයුජ බන්ධන සහ VSEPR මූලධර්ම",b:["දායක සහසංයුජ බන්ධනයකදී හවුලේ තබාගන්නා ඉලෙක්ට්‍රෝන යුගලය සම්පූර්ණයෙන්ම එක් පරමාණුවක lone pair එකකින් සපයයි. ඉලෙක්ට්‍රෝන යුගල දායකයාගෙන් ඉලෙක්ට්‍රෝන හිඟ acceptor එක දෙසට ඊතලයකින් එය නිරූපණය කළ හැක.","NH₃ හි N මත lone pair එක BF₃ හි B මත ඇති හිස් කාක්ෂිකයට දායක වී H₃N→BF₃ වැනි adduct එකක් සෑදිය හැක. ලෝහ අයන සමඟ NH₃, H₂O, CO හෝ CN⁻ වැනි lone-pair donor ප්‍රභේද complex ions සෑදීමේදීද දායක බන්ධන වැදගත් වේ.","VSEPR ආකෘතිය අනුව මධ්‍ය පරමාණුව වටා ඇති ඉලෙක්ට්‍රෝන යුගල/ඉලෙක්ට්‍රෝන ඝනත්ව ප්‍රදේශ එකිනෙකෙන් හැකි තරම් ඈත්වී විකර්ෂණය අවම වන ආකාරයට අවකාශයේ සැකසේ.","lone pair එකක් එක් න්‍යෂ්ටියක ආකර්ෂණයට පමණක් යටත් නිසා බන්ධන යුගලයකට වඩා වැඩි අවකාශ පරිමාවක් ගනී. එබැවින් සාමාන්‍යයෙන් lone pair–lone pair විකර්ෂණය > lone pair–bond pair > bond pair–bond pair වේ.","ද්විත්ව හෝ ත්‍රිත්ව බන්ධනයක ඉලෙක්ට්‍රෝන යුගල කිහිපයක් තිබුණද VSEPR සඳහා එම බහු බන්ධනය එක් විකර්ෂණ ඒකකයක් හෙවත් එක් electron domain එකක් ලෙස සලකයි."],f:"LP–LP > LP–BP > BP–BP   •   multiple bond = 1 VSEPR domain",exam:["දායක බන්ධනයේ donor හා acceptor හඳුනාගැනීම","NH₃→BF₃ සහ metal–ligand bonding","VSEPR domain ගණනය","lone pair නිසා bond angle වෙනස් වීම"]},
{t:"VSEPR අනුව ඉලෙක්ට්‍රෝන යුගල ජ්‍යාමිතිය සහ අණුක හැඩ",b:["මධ්‍ය පරමාණුව වටා VSEPR ඒකක 2ක් ඇති විට electron-pair geometry රේඛීය වන අතර කෝණය 180° වේ. CO₂, HCN සහ NO₂⁺ වැනි ප්‍රභේද මෙයට උදාහරණ වේ.","VSEPR ඒකක 3ක් ඇති විට තලීය ත්‍රිකෝණාකාර electron-pair geometry ලැබේ; කෝණය 120° වේ. BF₃, SO₃ සහ H₂CO වැනිවල lone pair නොමැතිනම් shape එකද trigonal planar වන අතර SO₂ වැනි එක් lone pair එකක් ඇති විට shape එක bent වේ.","VSEPR ඒකක 4ක් ඇති විට tetrahedral electron-pair geometry (≈109.5°) ලැබේ. CH₄ tetrahedral, NH₃ එක් lone pair එකක් නිසා trigonal pyramidal, H₂O lone pair දෙකක් නිසා bent වේ.","VSEPR ඒකක 5ක් trigonal bipyramidal geometry ලබාදේ. PCl₅ trigonal bipyramidal, SCl₄ seesaw, ICl₃ T-shaped සහ XeF₂ linear වේ; lone pairs සඳහා equatorial ස්ථාන සාමාන්‍යයෙන් අඩු විකර්ෂණයක් ලබාදේ.","VSEPR ඒකක 6ක් ඇති විට octahedral electron-pair geometry ලැබේ. SF₆ octahedral, XeOF₄ එක lone pair එකක් සමඟ square pyramidal සහ XeF₄ lone pairs දෙකක් සමඟ square planar වේ.","electron-pair geometry කියන්නේ සියලු electron domains වල සැකැස්මයි; molecular shape කියන්නේ bonded atoms වල සැකැස්මයි. එබැවින් lone pair පවතින විට මෙම දෙක එකම නොවිය හැක."],f:"2 → linear 180°   •   3 → trigonal planar 120°   •   4 → tetrahedral 109.5°   •   5 → trigonal bipyramidal   •   6 → octahedral",exam:["Lewis structure → electron domains → electron geometry → molecular shape ක්‍රමය","CH₄/NH₃/H₂O shapes","PCl₅/SCl₄/ICl₃/XeF₂ shapes","SF₆/XeOF₄/XeF₄ shapes","lone-pair positions සහ distortion"]},
{t:"කාක්ෂික මුහුම්කරණය සහ σ / π බන්ධන",b:["කාක්ෂික මුහුම්කරණය යනු බන්ධන විස්තර කිරීමට භාවිත කරන ආකෘතියකි. එකම පරමාණුවේ s සහ p කාක්ෂික මිශ්‍ර වී ශක්තියෙන් හා හැඩයෙන් සමාන hybrid orbitals සෑදෙන බව සලකයි.","sp³ මුහුම්කරණයේ s එකක් සහ p තුනක් එක්ව hybrid orbitals 4ක් සෑදේ; ඒවා tetrahedral ලෙස ≈109.5° කෝණවල දිශාගත වේ. s-character 25% සහ p-character 75% වේ.","sp² මුහුම්කරණයේ s එකක් සහ p දෙකක් එක්ව hybrid orbitals 3ක් සෑදී එකම තලයක 120° කෝණවල පවතී. එක් unhybridized p orbital එක තලයට ලම්බව පවතින අතර sp මුහුම්කරණයේ hybrid orbitals 2ක් 180° රේඛීයව පවතී; unhybridized p orbitals 2ක් ඉතිරි වේ.","σ බන්ධනයක් කාක්ෂික දෙකක් internuclear axis එක දිගේ face-to-face overlap වීමෙන් සෑදේ. π බන්ධනයක් parallel p orbitals දෙකක් side-on overlap වීමෙන් සෑදී electron density internuclear axis එකේ ඉහළ හා පහළ ප්‍රදේශවල පැතිරේ.","ද්විත්ව බන්ධනය = 1σ + 1π වන අතර ත්‍රිත්ව බන්ධනය = 1σ + 2π වේ. C₂H₄ හි C පරමාණු sp² සහ C₂H₂ හි C පරමාණු sp මුහුම්කරණයෙන් විස්තර කළ හැක."],f:"sp³ = 25% s, 109.5°   •   sp² = 33.3% s, 120°   •   sp = 50% s, 180°   •   double = σ+π   •   triple = σ+2π",exam:["sp³/sp²/sp හඳුනාගැනීම","hybrid orbital number සහ geometry","σ හා π overlap වෙනස","double/triple bond සංයුතිය","C₂H₄ හා C₂H₂ orbital picture"]},
{t:"සම්ප්‍රයුක්ත ව්‍යුහ, සම්ප්‍රයුක්ත මුහුම සහ විධිමත් ආරෝපණය",b:["එකම atom skeleton එක තබාගෙන π ඉලෙක්ට්‍රෝන හෝ lone-pair ඉලෙක්ට්‍රෝන ස්ථාන වෙනස් කර Lewis structures කිහිපයක් ලියන්න හැකි විට ඒවා resonance structures හෙවත් සම්ප්‍රයුක්ත ව්‍යුහ ලෙස සැලකේ. ඒ තනි තනි ව්‍යුහ සත්‍ය ලෙස වෙන වෙනම පවතින්නේ නැත.","සත්‍ය ප්‍රභේදය resonance hybrid එකකි. සමාන resonance structures තිබේ නම් ඒවා hybrid එකට සමාන දායකත්වයක් ලබාදෙන අතර delocalization නිසා සමාන බන්ධන දිග සහ අඩු ශක්තිය/වැඩි ස්ථායීතාව ලැබිය හැක.","NO₂⁻, NO₃⁻, CO₃²⁻ සහ O₃ වැනි ප්‍රභේදවල π electron density බන්ධන කිහිපයක් පුරා විස්ථාපනය වේ. resonance arrows මගින් nuclei ස්ථාන නොව electron pairs පමණක් මාරු කරන බව මතක තබාගත යුතුය.","විධිමත් ආරෝපණය (formal charge) යනු Lewis structure එකක atom එකකට පැවරෙන ගණිතමය ආරෝපණයකි. FC = valence electrons − [nonbonding electrons + bond count] යන NIE ආකාරයෙන් ගණනය කළ හැකි අතර සියලු formal charges එකතුව molecule/ion එකේ මුළු charge එකට සමාන වේ.","වඩා ස්ථායී Lewis/resonance දායක ව්‍යුහ සාමාන්‍යයෙන් formal charge separation අවම කරයි, octet සහ බන්ධන ගණන වැඩි කරයි, ඍණ formal charge වඩා විද්‍යුත් ඍණ atom මත තබයි සහ O/F වැනි ඉතා electronegative atoms මත ධන formal charge තැබීම අඩු කරයි."],f:"FC = valence e⁻ − (nonbonding e⁻ + bond count)   •   ΣFC = overall charge",exam:["resonance structures vs resonance hybrid","NO₂⁻/NO₃⁻/CO₃²⁻/O₃ resonance","formal charge ගණනය","දායක resonance structures වල relative stability තීරණය"]},
{t:"බන්ධන ධ්‍රැවීයතාව, අණුක ධ්‍රැවීයතාව, ද්විධ්‍රැව ඝූර්ණය සහ විද්‍යුත් ඍණතාව",b:["බන්ධනය සෑදූ පරමාණු දෙක අතර විද්‍යුත් ඍණතා වෙනස ඇති විට shared electron density වැඩි electronegativity ඇති පරමාණුව දෙසට වැඩි වශයෙන් යොමු වී δ⁺ සහ δ⁻ අර්ධ ආරෝපණ ඇති polar covalent bond එකක් ලැබේ.","සමස්ත molecule එක polar ද nonpolar ද යන්න bond polarity පමණක් නොව molecular geometry එකත් තීරණය කරයි. CO₂ හි C=O bonds polar වුවත් linear symmetry නිසා dipoles cancel වේ; CCl₄ හි tetrahedral symmetry ද සමස්ත dipole එක cancel කරයි.","ද්විධ්‍රැව ඝූර්ණය μ යනු charge separation එකේ විශාලත්වය සහ දුර යන දෙකම සලකන vector quantity එකකි: μ = δr. සාමාන්‍යයෙන් Debye (D) ඒකකයෙන් ප්‍රකාශ කරන අතර 1 D ≈ 3.34 × 10⁻³⁰ C m වේ.","පරමාණුවක electronegativity එහි පරිසරය සමඟ වෙනස් විය හැක. s-character වැඩි වන විට C(sp³) < C(sp²) < C(sp); positive charge වැඩි වීම electronegativity වැඩි කරයි, negative charge එය අඩු කරයි.","hybridization සහ charge සමාන නම් oxidation state හා බැඳී ඇති අනෙකුත් atoms වල electronegativity වැනි සාධකද බලපායි. NIE උදාහරණවල H₂S < SO₃²⁻ < SO₄²⁻ සඳහා S හි electronegativity oxidation state අනුව වැඩි වන ආකාරය හා CF₄/CCl₄ වැනි අවස්ථාවල අසල්වැසි atoms බලපෑම පෙන්වයි."],f:"μ = δr   •   1 D ≈ 3.34 × 10⁻³⁰ C m   •   C(sp³) < C(sp²) < C(sp)",exam:["bond polarity vs molecular polarity","CO₂/CCl₄ dipole cancellation","dipole moment calculation/concept","electronegativity factors: hybridization, charge, oxidation state, neighbouring atoms"]},
{t:"අයනික බන්ධන, අයනික දැලිස සහ ධ්‍රැවීකරණය",b:["අයනික බන්ධනය සෑදෙන්නේ ධන සහ ඍණ අයන අතර ස්ථිති විද්‍යුත් ආකර්ෂණයෙනි. ඝන අයනික සංයෝගවල අයන නියමිත රටාවකට දැලිසක සැකසී බොහෝ අසල්වැසි විරුද්ධ ආරෝපිත අයන සමඟ ආකර්ෂණයට ලක්වේ.","NaCl දැලිස තුළ සෑම Na⁺ අයනයක් වටා Cl⁻ අයන 6ක්ද සෑම Cl⁻ අයනයක් වටා Na⁺ අයන 6ක්ද පවතින 6:6 coordination එකක් ඇත.","cation එකක් anion electron cloud එක විකෘති කිරීමට ඇති හැකියාව polarizing power ලෙස සැලකිය හැක. cation එක කුඩා වීම හා charge වැඩි වීම polarizing power වැඩි කරයි.","anion electron cloud එක විකෘති වීමට ඇති පහසුව polarizability ලෙස සලකයි. සාමාන්‍යයෙන් anion එක විශාල වීම සහ charge magnitude වැඩි වීම polarizability වැඩි කරයි.","cation polarizing power සහ anion polarizability වැඩි වන විට අයනික බන්ධනයේ pure ionic character අඩුවී covalent character වැඩි විය හැක."],f:"polarizing power ↑ : cation radius ↓, charge ↑   •   polarizability ↑ : anion radius ↑, charge magnitude ↑",exam:["NaCl lattice coordination","cation polarizing power trend","anion polarizability trend","ionic vs covalent character reasoning"]},
{t:"ලෝහක බන්ධන සහ ද්විතීය/අන්තර්අණුක අන්තර්ක්‍රියා",b:["ලෝහක බන්ධන ආකෘතියේ ලෝහ පරමාණු සංයුජතා ඉලෙක්ට්‍රෝන delocalized electron sea එකකට දායක කරන අතර ධන metal ion cores දැලිසක පවතී. ion cores සහ mobile electron cloud අතර electrostatic attraction ලෝහක බන්ධනයට හේතු වේ.","ලෝහක බන්ධන ප්‍රබලතාවට delocalization සඳහා දායක කරන electron ගණන, metal ion radius සහ valence electrons නිදහස් කිරීමට ඇති ප්‍රවණතාව වැනි සාධක බලපායි. මෙය ලෝහවල විදුලි හා තාප සන්නායකතාවය පැහැදිලි කිරීමට උපකාරී වේ.","ද්විතීය අන්තර්ක්‍රියා අතර ion–dipole, dipole–dipole, ion-induced dipole, dipole-induced dipole සහ London dispersion interactions අඩංගු වේ. polar solvent එකක ionic solute දියවීමේදී ion–dipole interactions වැදගත් වේ.","hydrogen bonding ප්‍රබල dipole–dipole interaction වර්ගයකි. විශාල δ⁺ H එකක් N, O හෝ F වැනි electronegative atom එකකට සම්බන්ධ වී ඇති විට වෙනත් electronegative atom එකක් සමඟ attraction සෑදිය හැක; intermolecular සහ intramolecular hydrogen bonds දෙකම හැකි වේ.","London dispersion forces සියලු atoms/molecules අතර පවතින instantaneous dipole–induced dipole interactions වේ. electron cloud polarizability සහ contact surface area වැඩි වන විට ඒවා ශක්තිමත් වන අතර molecular shape හා intermolecular forces boiling point වැනි භෞතික ගුණ තීරණය කිරීමට වැදගත් වේ."],f:"ion–dipole   •   dipole–dipole   •   H-bond   •   ion–induced dipole   •   dipole–induced dipole   •   London dispersion",exam:["metallic electron-sea model","intermolecular force වර්ග හඳුනාගැනීම","hydrogen-bond donor/acceptor reasoning","water/ice hydrogen-bond network","London force සහ molecular size/shape/boiling-point trends"]}
],
en:[
{t:"Covalent bonding, the octet rule and Lewis structures",b:["A covalent bond forms when two atoms share an electron pair. In a conventional two-electron bond, each atom usually contributes one electron to the shared pair.","Second-period C, N, O and F strongly tend toward an octet, while later-period central atoms may exceed the octet and Be/B/Al compounds may be electron deficient; odd-electron species such as NO and NO₂ are also exceptions.","To draw a Lewis structure, count total valence electrons and adjust for charge, choose a suitable central atom, connect atoms by single bonds, complete peripheral octets, place remaining electrons on the central atom and form multiple bonds when needed.","H and F are generally not central atoms; the less electronegative atom that can form several bonds is usually central.","The preferred Lewis structure should satisfy appropriate valence requirements while avoiding unnecessary charge separation."],f:"total valence e⁻ = Σ(valence e⁻) ± charge • single / double / triple bonds = 1 / 2 / 3 shared pairs"},
{t:"Coordinate covalent bonding and VSEPR fundamentals",b:["In a coordinate covalent bond, both electrons of the shared pair are supplied by one donor atom.","NH₃ can donate its lone pair to electron-deficient BF₃; lone-pair donors such as NH₃, H₂O, CO and CN⁻ also form coordinate bonds to metal ions.","VSEPR treats electron-density regions around a central atom as repelling domains that arrange to maximize separation.","Lone-pair repulsion is stronger than bond-pair repulsion, so the usual order is LP–LP > LP–BP > BP–BP.","A double or triple bond is treated as one electron domain for VSEPR shape prediction."],f:"LP–LP > LP–BP > BP–BP • multiple bond = one VSEPR domain"},
{t:"Electron-pair geometry and molecular shape",b:["Two electron domains give linear geometry, 180°.","Three domains give trigonal-planar geometry, 120°; one lone pair changes the molecular shape to bent.","Four domains give tetrahedral electron geometry; CH₄ is tetrahedral, NH₃ trigonal pyramidal and H₂O bent.","Five domains give trigonal-bipyramidal geometry: PCl₅, SCl₄, ICl₃ and XeF₂ illustrate the derived shapes.","Six domains give octahedral geometry: SF₆, XeOF₄ and XeF₄ illustrate octahedral, square-pyramidal and square-planar shapes.","Electron-pair geometry includes all domains; molecular shape considers bonded atoms."],f:"2: linear • 3: trigonal planar • 4: tetrahedral • 5: trigonal bipyramidal • 6: octahedral"},
{t:"Hybridization and σ/π bonds",b:["Hybridization is a bonding model in which atomic orbitals on one atom are mixed to form equivalent, directed hybrid orbitals.","sp³ gives four tetrahedral hybrids; sp² gives three trigonal-planar hybrids and one unhybridized p orbital; sp gives two linear hybrids and two unhybridized p orbitals.","The s-character increases sp³ < sp² < sp.","A σ bond results from head-on overlap along the internuclear axis; a π bond results from side-on overlap of parallel p orbitals.","A double bond contains one σ and one π bond; a triple bond contains one σ and two π bonds."],f:"sp³ 109.5° • sp² 120° • sp 180° • double=σ+π • triple=σ+2π"},
{t:"Resonance and formal charge",b:["Resonance structures have the same atomic skeleton but differ in the positions of π electrons or lone pairs.","The real species is a resonance hybrid; equivalent contributors make equal contributions and delocalization can equalize bond lengths.","NO₂⁻, NO₃⁻, CO₃²⁻ and O₃ are representative resonance systems.","Formal charge is calculated from valence electrons, nonbonding electrons and bond count; the sum of formal charges equals the overall charge.","More important resonance contributors generally minimize charge separation and place negative charge on the more electronegative atom."],f:"FC = valence e⁻ − (nonbonding e⁻ + bond count) • ΣFC = overall charge"},
{t:"Polarity, dipole moment and electronegativity",b:["Electronegativity differences polarize covalent bonds.","Molecular polarity depends on both bond dipoles and geometry; CO₂ and CCl₄ are nonpolar because their bond dipoles cancel by symmetry.","Dipole moment is a vector quantity described by μ = δr and commonly expressed in Debye.","Electronegativity can vary with hybridization: C(sp³) < C(sp²) < C(sp).","Charge, oxidation state and the nature of attached atoms also affect electronegativity."],f:"μ=δr • 1 D≈3.34×10⁻³⁰ C m • C(sp³)<C(sp²)<C(sp)"},
{t:"Ionic bonding and polarization",b:["Ionic bonding is electrostatic attraction between oppositely charged ions arranged in a lattice.","In the NaCl lattice each Na⁺ has six Cl⁻ neighbours and each Cl⁻ has six Na⁺ neighbours.","Small, highly charged cations have greater polarizing power.","Large and/or more highly charged anions are more polarizable.","Greater polarization increases covalent character in an otherwise ionic interaction."],f:"polarizing power ↑ as cation radius ↓ and charge ↑ • polarizability ↑ as anion radius ↑"},
{t:"Metallic bonding and secondary interactions",b:["The metallic model consists of positive metal-ion cores stabilized by a delocalized mobile electron cloud.","Metallic bond strength depends on factors including the number of donated electrons, ionic size and the tendency to release valence electrons.","Secondary interactions include ion–dipole, dipole–dipole, ion-induced dipole, dipole-induced dipole and London dispersion interactions.","Hydrogen bonding is a particularly strong dipolar interaction involving strongly polarized H and electronegative atoms such as N, O or F.","London forces act between all atoms and molecules and grow with polarizability and effective contact surface area, helping explain boiling-point and phase trends."],f:"ion–dipole • dipole–dipole • H-bond • induced dipoles • London dispersion"}
],

{t:"சகபிணைப்பு, octet விதி மற்றும் Lewis அமைப்புகள்",b:["இரு அணுக்கள் electron pair ஒன்றை பகிரும்போது covalent bond உருவாகிறது.","C, N, O, F போன்ற இரண்டாம் period அணுக்கள் octet பெற முயலும்; சில later-period central atoms expanded octet காட்டலாம்; Be/B/Al electron-deficient species மற்றும் NO/NO₂ odd-electron species விதிவிலக்குகள்.","Lewis structure வரைய total valence electrons எண்ணி charge ஐ சரிசெய்து central atom தேர்வு செய்து single bonds அமைத்து peripheral octets பூர்த்தி செய்ய வேண்டும்.","H மற்றும் F பொதுவாக central atom ஆகாது; பல bonds அமைக்கக்கூடிய குறைந்த electronegativity atom பொதுவாக central atom ஆகும்.","தேவையான போது lone pair ஐ bonding pair ஆக மாற்றி multiple bonds அமைத்து பொருத்தமான Lewis structure பெறலாம்."],f:"total valence e⁻ = Σ(valence e⁻) ± charge"},
{t:"Coordinate covalent bond மற்றும் VSEPR அடிப்படை",b:["Coordinate covalent bond இல் shared pair இன் இரண்டு electrons உம் ஒரே donor atom இலிருந்து வருகிறது.","NH₃ lone pair ஐ BF₃ இன் electron-deficient B க்கு donate செய்யும்; NH₃/H₂O/CO/CN⁻ metal ions உடன் complexes உருவாக்கலாம்.","VSEPR இல் central atom ஐச் சுற்றிய electron-density domains ஒருவரை ஒருவர் தள்ளி அதிக separation பெறும்.","Lone pair repulsion bond-pair repulsion ஐ விட அதிகம்: LP–LP > LP–BP > BP–BP.","Double/triple bond VSEPR இல் ஒரு domain ஆக எண்ணப்படுகிறது."],f:"LP–LP > LP–BP > BP–BP"},
{t:"Electron-pair geometry மற்றும் molecular shape",b:["2 domains → linear, 180°.","3 domains → trigonal planar, 120°; ஒரு lone pair இருந்தால் bent shape.","4 domains → tetrahedral; CH₄ tetrahedral, NH₃ trigonal pyramidal, H₂O bent.","5 domains → trigonal bipyramidal; PCl₅, SCl₄, ICl₃, XeF₂ derived shapes.","6 domains → octahedral; SF₆, XeOF₄, XeF₄ எடுத்துக்காட்டுகள்.","Electron-pair geometry எல்லா domains ஐக் கொண்டது; molecular shape bonded atoms ஐக் கொண்டது."],f:"2 linear • 3 trigonal planar • 4 tetrahedral • 5 TBP • 6 octahedral"},
{t:"Hybridization மற்றும் σ/π bonds",b:["Hybridization என்பது ஒரே atom இன் atomic orbitals கலந்து equivalent hybrid orbitals உருவாகும் bonding model.","sp³ = 4 tetrahedral hybrids; sp² = 3 trigonal planar hybrids + one p; sp = 2 linear hybrids + two p orbitals.","s-character: sp³ < sp² < sp.","σ bond internuclear axis வழி head-on overlap; π bond parallel p orbitals இன் side-on overlap.","Double bond = 1σ+1π; triple bond = 1σ+2π."],f:"sp³ 109.5° • sp² 120° • sp 180°"},
{t:"Resonance மற்றும் formal charge",b:["Resonance structures இல் atom skeleton ஒரேதாக இருக்கும்; π electrons/lone pairs இடம் மாறும்.","உண்மையான species resonance hybrid ஆகும்; equivalent contributors சமமாக பங்களிக்கின்றன.","NO₂⁻, NO₃⁻, CO₃²⁻, O₃ எடுத்துக்காட்டுகள்.","Formal charge valence electrons, nonbonding electrons மற்றும் bond count மூலம் கணக்கிடப்படுகிறது.","சிறந்த contributors charge separation ஐ குறைத்து negative charge ஐ அதிக electronegative atom மீது வைக்கும்."],f:"FC = valence e⁻ − (nonbonding e⁻ + bond count)"},
{t:"Polarity, dipole moment மற்றும் electronegativity",b:["Electronegativity difference covalent bond ஐ polar ஆக்கும்.","Molecular polarity bond dipoles மற்றும் geometry இரண்டிலும் சார்ந்தது; CO₂ மற்றும் CCl₄ symmetry காரணமாக nonpolar.","Dipole moment μ = δr; Debye unit பொதுவாக பயன்படும்.","Hybridization electronegativity ஐ பாதிக்கும்: C(sp³)<C(sp²)<C(sp).","Charge, oxidation state மற்றும் attached atoms இன் nature உம் electronegativity ஐ பாதிக்கும்."],f:"μ=δr • 1 D≈3.34×10⁻³⁰ C m"},
{t:"Ionic bonding மற்றும் polarization",b:["Oppositely charged ions இடையிலான electrostatic attraction ionic bond ஆகும்.","NaCl lattice இல் ஒவ்வொரு Na⁺ க்கும் 6 Cl⁻ neighbours; ஒவ்வொரு Cl⁻ க்கும் 6 Na⁺ neighbours.","Small/high-charge cation க்கு polarizing power அதிகம்.","Large/high-charge anion க்கு polarizability அதிகம்.","Polarization அதிகரிக்க ionic interaction இல் covalent character அதிகரிக்கலாம்."],f:"cation radius ↓ & charge ↑ → polarizing power ↑"},
{t:"Metallic bonding மற்றும் intermolecular interactions",b:["Metallic model இல் positive ion cores delocalized mobile electron cloud மூலம் நிலைபெறுகின்றன.","Bond strength donated electrons, ion size மற்றும் valence electrons release tendency போன்ற காரணிகளில் சார்ந்தது.","Ion–dipole, dipole–dipole, ion-induced dipole, dipole-induced dipole மற்றும் London interactions முக்கியம்.","Hydrogen bonding என்பது strongly polarized H மற்றும் N/O/F போன்ற electronegative atoms உடன் தொடர்புடைய வலுவான dipolar interaction.","London forces எல்லா atoms/molecules இடையிலும் உண்டு; polarizability மற்றும் contact surface area அதிகரிக்க அவை வலுவாகும்."],f:"ion–dipole • dipole–dipole • H-bond • London"}
]};

  ["Successive ionization energies","IE₁<IE₂<IE₃... සාමාන්‍ය trend එක electron ඉවත් වූ පසු remaining electrons වැඩි effective attraction එකකට ලක් වීමයි. ඉතා විශාල jump එකක් valence shell අවසන් වී inner shell electron එකක් ඉවත් කිරීමට යන බව පෙන්වයි."],
  ["Hydrogen spectrum","Electron energy levels continuous නොව quantized. Transition එකක |ΔE|=hν. Emission වල electron lower level එකකට යන අතර photon එකක් emit වේ; absorption වල exact matching energy photon එකක් absorb කර higher level එකකට යයි."],
  ["Series මතකය","Lyman transitions n=1 වෙත (UV), Balmer n=2 වෙත, Paschen n=3 වෙත. Balmer visible lines ≈410, 434, 486, 656 nm. Line spectrum එක quantized energy differences වල direct signature එකකි."]
 ],
 [
  ["Quantum numbers","n shell/energy level; l subshell shape (0→s,1→p,2→d,3→f); mₗ orientation −l…+l; mₛ=±½. Allowed values එකිනෙකට dependent නිසා arbitrary combination එකක් valid නොවේ."],
  ["Orbital count","Shell n එකේ orbitals = n²; maximum electrons = 2n². Subshell capacities s=2, p=6, d=10, f=14. Each orbital max electrons 2, opposite spins."],
  ["Shape vs probability","Orbital එක electron path එකක් නොවේ; wavefunction අනුව electron finding probability distribution එකකි. s spherical; p orbitals two-lobed. 'orbit' සහ 'orbital' එකම දෙයක් ලෙස ලියන්න එපා."]
 ],
 [
  ["Rules තුන","Aufbau: lower-energy orbitals first. Pauli: same atom එකේ electrons දෙකකට identical four quantum numbers නැහැ. Hund: degenerate orbitals පළමුව singly, parallel spin, පසුව pairing."],
  ["Transition-ion trap","Neutral transition atoms ලියන විට 4s generally before 3d fill වුවත් cation සෑදීමේදී 4s electrons මුලින් ඉවත් වේ. Electron configuration question එක atom ද ion ද කියා මුලින් හඳුනාගන්න."],
  ["Cr සහ Cu","Simple filling prediction වෙනුවට Cr ≈ [Ar]3d⁵4s¹ සහ Cu ≈ [Ar]3d¹⁰4s¹ ලෙස familiar exceptions ලැබේ. Half-filled/full-filled d subshell stability reason එක exam explanation එකට සම්බන්ධ කරන්න."]
 ],
 [
  ["Periodic table architecture","Long periodic table electron filling pattern එක reflect කරයි. s,p,d,f blocks differentiating electron යන subshell එක අනුව නම් වේ. Block widths: s=2, p=6, d=10, f=14."],
  ["Period සහ group","Highest occupied principal shell n period එක තීරණය කිරීමට උපකාරී වේ. Main-group elements සඳහා outer ns/np electron count group behaviour සමඟ සම්බන්ධ වේ."],
  ["Shell capacity link","n shell එකේ n² orbitals සහ 2n² electrons rule එක නිසා shell capacities 2,8,18,32 ලැබේ; periodic table row lengths හා orbital filling අතර සම්බන්ධතාවය මෙයින් තේරේ."]
 ],
 [
  ["Shielding + Z_eff","Inner electrons nuclear attraction shield කරන නිසා valence electron එකට දැනෙන effective nuclear charge Z_eff, actual Z ට වඩා අඩුය. Across a period Z වැඩි වන අතර shielding relatively අඩු වෙනස් වීම radius decrease එකේ ප්‍රධාන හේතුවකි."],
  ["Radii reasoning","Cation parent atom ට වඩා සාමාන්‍යයෙන් කුඩා; anion විශාල. Isoelectronic series එකක electrons එකම නම් nuclear charge වැඩි species එකේ radius අඩුයි."],
  ["IE / electron gain / EN","First ionization energy across period generally වැඩි, down group generally අඩු; electron configuration exceptions තිබේ. Electronegativity bond electrons attract කිරීමේ relative tendency එකයි; trend explain කරන විට charge, shielding, distance සහ configuration එකට සලකන්න."]
 ]
],
2:[
 [
  ["Lewis workflow","1) total valence electrons ගණනය කරන්න; negative charge සඳහා add, positive charge සඳහා subtract. 2) sensible skeleton තෝරන්න. 3) terminal octets fill කරන්න. 4) remaining electrons central atom මත තබන්න. 5) අවශ්‍ය නම් multiple bonds සාදන්න."],
  ["Octet rule එක absolute නීතියක් නොවේ","Be/B/Al electron-deficient species, third-period expanded-valence examples, සහ NO/NO₂ වැනි odd-electron species octet exceptions වේ. Octet rule useful guideline එකක් මිස universal law එකක් නොවේ."],
  ["Structure quality check","Correct electron total, overall charge, octets where applicable සහ reasonable formal charges එකවර check කරන්න. Lewis structure එක atom arrangement + electron bookkeeping model එකක් බව මතක තබාගන්න."]
 ],
 [
  ["Dative bond","Coordinate/dative covalent bond එකේ shared pair electrons දෙකම donor atom එකේ lone pair එකෙන් එයි. Arrow donor→acceptor ලෙස ලියයි; bond formed වූ පසු ordinary covalent bond එකක් මෙන් electron pair share වේ."],
  ["VSEPR core idea","Electron domains central atom වටා repulsion අවම වන ලෙස arrange වේ. Lone pair–lone pair > lone pair–bond pair > bond pair–bond pair repulsion. Multiple bond එක VSEPR counting සඳහා එක domain එකක්."],
  ["Shape method","Lewis structure → central atom domains count → electron-pair geometry → lone pairs ignore කර molecular shape කියන්න. Electron geometry සහ molecular shape lone pairs තිබුණොත් වෙනස් විය හැක."]
 ],
 [
  ["2,3,4 domains","2→linear 180°. 3→trigonal planar 120°. 4→tetrahedral ≈109.5°. CH₄ tetrahedral; NH₃ trigonal pyramidal; H₂O bent because lone-pair repulsions bond angles compress කරයි."],
  ["5 domains","Trigonal bipyramidal geometry හි axial–equatorial interactions වෙනස්. Lone pairs සාමාන්‍යයෙන් equatorial positions prefer කර 90° interactions අඩු කරයි: SCl₄ seesaw, ICl₃ T-shaped, XeF₂ linear."],
  ["6 domains","Octahedral domains: SF₆ octahedral; one lone pair example XeOF₄ square pyramidal; two opposite lone pairs XeF₄ square planar. Shape name bonded atoms arrangement එකට පමණක් අදාළය."]
 ],
 [
  ["Hybridization map","sp³: 4 hybrid orbitals, 25% s, tetrahedral directions. sp²: 3 hybrids, 33.3% s, planar 120°, one unhybridized p. sp: 2 hybrids, 50% s, linear 180°, two unhybridized p orbitals."],
  ["σ සහ π","σ bond = internuclear axis දිගේ head-on overlap. π bond = parallel p orbitals side-on overlap. Double bond = 1σ+1π; triple bond = 1σ+2π."],
  ["Structure examples","Ethene C atoms sp²; remaining p orbitals overlap කර π bond එක සෑදේ. Ethyne C atoms sp; unhybridized p pairs දෙකෙන් π bonds දෙකක් ලැබේ. Geometry සහ bond composition එක එකට සම්බන්ධ කර බලන්න."]
 ],
 [
  ["Resonance ≠ switching","Resonance structures real molecules එක වේගයෙන් එකිනෙකට මාරුවෙන structures නොවේ. Actual species එක delocalized resonance hybrid එකකි."],
  ["Formal charge","FC = valence electrons − [nonbonding electrons + number of bonds]. Molecule එකක ΣFC=0; polyatomic ion එකක ΣFC=ion charge."],
  ["Best contributors","Formal-charge separation අවම වීම, complete octets where applicable, සහ negative FC වඩා electronegative atom මත තිබීම more important resonance contributors හඳුනාගැනීමට භාවිත වේ."]
 ],
 [
  ["Bond polarity vs molecule polarity","Electronegativity difference bond dipole ඇති කළ හැක. Molecular polarity ලබාගන්නේ සියලු bond-dipole vectors geometry අනුව එකතු කිරීමෙන්; CO₂/CCl₄ bonds polar වුවත් symmetry නිසා net dipole cancel විය හැක."],
  ["Dipole moment","μ=δr; vector quantity. 1 D ≈3.34×10⁻³⁰ C m. Larger charge separation හෝ larger separation distance dipole moment වැඩි කළ හැකි නමුත් whole-molecule vector sum එක අමතක නොකරන්න."],
  ["Electronegativity factors","Hybridization, formal/ionic charge, oxidation state සහ bonded-neighbour effects electronegativity magnitude එකට බලපායි. Carbon සඳහා s-character වැඩි වන විට C(sp³)<C(sp²)<C(sp)."]
 ],
 [
  ["Ionic lattice","Ionic solid එක discrete molecule collection එකක් ලෙස නොව extended lattice එකක් ලෙස සිතන්න. NaCl structure එකේ Na⁺ හා Cl⁻ coordination 6:6 ලෙස නිරූපණය කළ හැක."],
  ["Polarizing power","Small, highly charged cation එකට high charge density නිසා anion electron cloud distort කිරීමට වැඩි polarizing power ඇත. Isoelectronic cations වල positive charge වැඩි වන විට radius අඩු වී polarizing power වැඩි වේ."],
  ["Polarizability → covalent character","Large/high-charge anion electron cloud පහසුවෙන් distort වේ. Cation polarizing power සහ anion polarizability වැඩි වන විට pure ionic character අඩු වී covalent character වැඩි වේ."]
 ],
 [
  ["Metallic bond model","Positive metal ion cores lattice එකක අතර delocalized valence electrons පවතින model එක metallic conductivity සහ malleability explain කිරීමට උපකාරී වේ. Bond strength electron density සහ ion-core factors මත රඳා පවතී."],
  ["Secondary interactions","Ion–dipole, dipole–dipole, ion-induced dipole, dipole-induced dipole, hydrogen bonding සහ London dispersion වෙන වෙනම හඳුනාගන්න. සියලු atoms/molecules අතර London dispersion ඇත."],
  ["Physical properties connect කරන්න","Intermolecular attraction වැඩි වීම සාමාන්‍යයෙන් boiling point වැඩි කරයි. Polarizability සහ contact surface area London forces ශක්තිමත් කරයි; ඒ නිසා molecular shape/molar mass දෙකම boiling trends explain කිරීමේදී වැදගත් වේ."]
 ]
],
3:[
 [
  ["Oxidation-number rules","Free element=0; monatomic ion=charge. F සාමාන්‍යයෙන් −1. O සාමාන්‍යයෙන් −2 නමුත් peroxide වල −1 සහ OF₂ හි +2. H සාමාන්‍යයෙන් +1, metal hydride වල −1. Sum = overall species charge."],
  ["Redox logic","Oxidation number increase → oxidation/electron loss; decrease → reduction/electron gain. Oxidizing agent තමන් reduce වේ; reducing agent තමන් oxidize වේ."],
  ["Calculation discipline","Unknown oxidation state x ලෙස දමා algebra solve කරන්න. Exception එකක් තිබේද කියා මුලින් බලන්න; O/H values අන්ධව −2/+1 දාන්නේ common exam error එකකි."]
 ],
 [
  ["Ionic names","Cation first, anion second. Variable-charge metals සඳහා oxidation state Roman numeral එකෙන්: FeCl₂ iron(II) chloride, FeCl₃ iron(III) chloride."],
  ["Covalent / polyatomic","Simple molecular compounds mono-,di-,tri-,tetra-... prefixes භාවිත කරයි. NH₄⁺, OH⁻, NO₃⁻, SO₄²⁻, CO₃²⁻, MnO₄⁻, Cr₂O₇²⁻ වැනි polyatomic ion names වෙනම ඉගෙනගන්න."],
  ["Oxoacid pattern","HClO / HClO₂ / HClO₃ / HClO₄ = hypochlorous / chlorous / chloric / perchloric. Corresponding anions hypo...ite / ...ite / ...ate / per...ate. Ionic සහ covalent naming rules mix නොකරන්න."]
 ],
 [
  ["Mass scale → mole","1 u = ¹²C atom mass එකේ 1/12. Relative/average atomic mass isotopic abundances weighted mean. Mole එක microscopic particle count සහ macroscopic mass අතර bridge එකයි."],
  ["Avogadro constant","Nₐ≈6.022×10²³ mol⁻¹. N=nNₐ. '1 mol' කියන විට entities atomsද moleculesද ionsද formula unitsද කියා species එක අනුව පැහැදිලි කරන්න."],
  ["Mass–mole map","n=m/M. Example: 18.016 g H₂O ≈1 mol H₂O molecules. Molar mass g mol⁻¹; relative molecular/formula mass dimensionless — quantities දෙක mix නොකරන්න."]
 ],
 [
  ["Empirical formula algorithm","Mass/% → each element moles → divide by smallest → if needed multiply all ratios by same small integer → simplest whole-number formula."],
  ["NIE worked example","71.65% Cl, 24.27% C, 4.07% H දත්ත empirical ratio CH₂Cl ලබාදේ. Molecular mass 98 සහ empirical-formula mass 49 නිසා multiplier=2 → molecular formula C₂H₄Cl₂."],
  ["Check","All element mass percentages should total ~100%. Molecular formula = (empirical formula)ₙ, n integer. Ratio 1.5 වැනි value එක nearest 2 ලෙස round නොකර සියල්ල ×2 කරන්න."]
 ],
 [
  ["Fractions","Mass fraction=m(component)/m(total); volume fraction=V(component)/V(total); mole fraction xᵢ=nᵢ/Σn and Σx=1. Percent = fraction×100."],
  ["Trace concentration","Mass-based ppt/ppm/ppb = fraction×10³/10⁶/10⁹. Numerator/denominator same basis සහ unit conversions correct විය යුතුය."],
  ["Syllabus boundary","Molarity C=n/V(solution in dm³) syllabus-relevant. NIE book molality concept එක සඳහන් කළත් එය current G.C.E. A/L syllabus ට අදාළ නොවන බවම සටහන් කරයි. Therefore exam focus molarity/fractions/%/ppm/ppb මත තබන්න."]
 ],
 [
  ["Inspection","Chemical formula subscripts කිසිවිට balance කිරීමට වෙනස් නොකර coefficients පමණක් වෙනස් කරන්න. Atom conservation දෙපස verify කරන්න."],
  ["Redox method","Oxidation/reduction half-reactions වෙන් කර atoms සහ charge balance කරන්න; electrons lost = electrons gained. Acidic medium H⁺/H₂O; basic medium OH⁻/H₂O handling consistent විය යුතුය."],

var unit3Notes={"si":[{"t":"ඔක්සිකරණ අංකය සහ රෙඩොක්ස් ප්‍රතික්‍රියා","b":["ඔක්සිකරණ අංකය යනු සියලු බන්ධන සම්පූර්ණයෙන් අයනික ලෙස සලකා බැලූ විට පරමාණුවකට පවරන සම්මත ආරෝපණයයි. නිදහස් මූලද්‍රව්‍යයක ඔක්සිකරණ අංකය 0 වන අතර එක්පරමාණුක අයනයක එය අයන ආරෝපණයට සමාන වේ.","F සාමාන්‍යයෙන් −1 යි. O සාමාන්‍යයෙන් −2 යි; peroxide වල −1 වන අතර OF₂ හි O +2 වේ. H සාමාන්‍යයෙන් +1 වන නමුත් ලෝහ hydride වල −1 වේ. සංයෝගයක ඔක්සිකරණ අංක එකතුව 0 වන අතර බහුපරමාණුක අයනයක එය අයන ආරෝපණයට සමාන වේ.","PH₃, H₃PO₄, SO₄²⁻, CH₄ සහ chlorinated methane වැනි ප්‍රභේදවල නොදන්නා ඔක්සිකරණ අංකය algebra භාවිතයෙන් සොයයි. සහසංයුජ ව්‍යුහයකදී බන්ධන ඉලෙක්ට්‍රෝන වඩා විද්‍යුත් ඍණ පරමාණුවට පවරා මධ්‍ය පරමාණුවේ oxidation state තීරණය කළ හැක.","ඔක්සිකරණ අංකය වැඩි වීම ඔක්සිකරණයයි සහ ඉලෙක්ට්‍රෝන අහිමි වීම සමඟ සම්බන්ධ වේ. ඔක්සිකරණ අංකය අඩු වීම ඔක්සිහරණයයි. ඔක්සිකාරකය තමන් ඔක්සිහරණයට ලක් වන අතර ඔක්සිහාරකය තමන් ඔක්සිකරණයට ලක් වේ."],"f":"Σ(O.N.) = සමස්ත ආරෝපණය • Oxidation: O.N. ↑ • Reduction: O.N. ↓","exam":["O, H, F හි සාමාන්‍ය අගයන් සහ exceptions නිවැරදිව යොදන්න.","Oxidizing agent / reducing agent හඳුනාගන්නේ oxidation-state change මතයි.","සංයෝගයක හා polyatomic ion එකක oxidation-number sum වෙනස මතක තබාගන්න."]},{"t":"අකාබනික සංයෝග නාමකරණය","b":["සරල අයනික සංයෝගයක cation නාමය පළමුවද anion නාමය දෙවනුවද ලියයි. එකම ස්ථිර ආරෝපණයක් ඇති ලෝහ සඳහා NaCl = sodium chloride, MgO = magnesium oxide වැනි සරල නාම භාවිත වේ.","විචල්‍ය ඔක්සිකරණ අවස්ථා ඇති ලෝහ සඳහා IUPAC නාමයේ oxidation state එක Roman numeral මගින් දක්වයි: FeS = iron(II) sulfide, Fe₂S₃ = iron(III) sulfide, CuCl₂ = copper(II) chloride.","සරල සහසංයුජ සංයෝග සඳහා mono, di, tri, tetra, penta, hexa, hepta, octa වැනි prefixes භාවිත කරයි. පළමු මූලද්‍රව්‍යයට mono සාමාන්‍යයෙන් නොයෙදේ: CO carbon monoxide, N₂O₄ dinitrogen tetroxide.","NH₄⁺, OH⁻, NO₃⁻, SO₄²⁻, CO₃²⁻, MnO₄⁻, Cr₂O₇²⁻ වැනි බහුපරමාණුක අයන නාම මතක තබාගත යුතුය. Binary acids සඳහා hydro…ic acid රටාවත් oxoacids සඳහා -ate → -ic සහ -ite → -ous රටාවත් per-/hypo- prefixes සමඟ භාවිත වේ."],"f":"FeCl₂ → iron(II) chloride • N₂O₄ → dinitrogen tetroxide • SO₄²⁻ → sulfate","exam":["Roman numeral එක ලෝහයේ oxidation state එකයි; atom count එක නොවේ.","Covalent prefixes සහ ionic nomenclature එකිනෙකට මිශ්‍ර නොකරන්න.","Oxoacid නාමයේ -ate/-ite වෙනසෙන් -ic/-ous acid තීරණය කරන්න."]},{"t":"පරමාණුක ස්කන්ධය, මෝලය සහ Avogadro නියතය","b":["Atomic mass unit (u) යනු ¹²C පරමාණුවක ස්කන්ධයේ 1/12 කොටසයි. ස්වාභාවික මූලද්‍රව්‍යයක සාපේක්ෂ පරමාණුක ස්කන්ධය එහි isotopes වල ස්කන්ධ සහ ප්‍රතිශත abundance වල weighted average එකකි.","මෝලයක් යනු නිශ්චිත elementary entities 6.022 × 10²³ ක් අඩංගු ද්‍රව්‍ය ප්‍රමාණයයි. මේ අගය Avogadro නියතය Nₐ ලෙස හැඳින්වේ. Atom, molecule, ion හෝ formula unit සඳහා entity වර්ගය පැහැදිලිව සඳහන් කළ යුතුය.","Molar mass යනු ද්‍රව්‍යයේ මෝලයක ස්කන්ධයයි සහ සාමාන්‍යයෙන් g mol⁻¹ වලින් ප්‍රකාශ වේ. Formula එකේ සියලු atomic masses එකතු කර compound එකේ molar mass ගණනය කරයි.","Mass → moles → particles යන සම්බන්ධතාව chemical calculations වල මූලික පාලමයි. n = m/M මගින් moles ද, N = nNₐ මගින් particle count ද සොයයි; reverse calculations ද ඒම සම්බන්ධතා භාවිත කරයි."],"f":"Nₐ = 6.022×10²³ mol⁻¹ • n = m/M • N = nNₐ • 1 u ≈ 1.6605×10⁻²⁴ g","exam":["Isotopic abundance weighted average එක සාමාන්‍ය arithmetic mean එකක් නොවේ.","Molar mass හි ඒකකය g mol⁻¹ ලෙස ලියන්න.","Particles කියන විට atom/molecule/ion/formula unit කුමක්දැයි හඳුනාගන්න."]},{"t":"රසායනික සූත්‍ර සහ සංයුති ගණනය","b":["Empirical formula එක සංයෝගයක මූලද්‍රව්‍ය අතර සරලතම පූර්ණ සංඛ්‍යා mol අනුපාතය දක්වයි. Molecular formula එක එක් අණුවක සත්‍ය atom සංඛ්‍යාව දක්වන අතර එය empirical formula එකේ පූර්ණ සංඛ්‍යා ගුණිතයකි.","Formula එකෙන් mass percentage ගණනය කිරීමට අදාල මූලද්‍රව්‍යයේ මුළු relative mass contribution එක compound molar mass එකෙන් බෙදා 100 න් ගුණ කරයි. සියලු මූලද්‍රව්‍යවල mass percentages එකතුව 100% විය යුතුය.","Empirical formula සොයන විට දී ඇති masses හෝ percentages, atomic masses වලින් බෙදා moles ගනී. සියලු mole values කුඩාම mole value එකෙන් බෙදා සරල ratio ලබාගෙන අවශ්‍ය නම් මුළු සංඛ්‍යා ratio එකක් ලබාගැනීමට ගුණ කරයි.","Molecular formula සොයන විට empirical-formula mass ගණනය කර s සකස් කරයි.","Half-reaction method එකේ oxidation සහ reduction half equations වෙන් කර atoms/charge balance කරයි. Acidic medium තුළ H⁺, H₂O හා e⁻ භාවිත කරන අතර basic medium තුළ අවසානයේ OH⁻ භාවිතයෙන් H⁺ ඉවත් කරයි.","Simple nuclear equation එකක reactant සහ product පැතිවල mass numbers A එකතුව සහ atomic numbers Z එකතුව වෙන වෙනම සමාන විය යුතුය. α, β සහ γ symbols වල A සහ Z අගයන් නිවැරදිව භාවිත කරන්න."],"f":"atoms left = atoms right • e⁻ lost = e⁻ gained • ΣA(left)=ΣA(right) • ΣZ(left)=ΣZ(right)","exam":["Equation balance කිරීමේදී subscripts වෙනස් නොකර coefficients පමණක් වෙනස් කරන්න.","Half-reaction method එකේ charge balance කිරීම අමතක නොකරන්න.","Nuclear equation එකේ A හා Z දෙකම වෙන වෙනම conserve විය යුතුය."]},{"t":"නිශ්චිත සාන්ද්‍රණ ද්‍රාවණ සකස් කිරීම","b":["Known concentration සහිත standard solution එකක් quantitative analysis සඳහා භාවිත වේ. Primary standard ද්‍රව්‍යයක් ඉතා පිරිසිදු, ස්ථායී, non-hygroscopic, සාපේක්ෂව ඉහළ molar mass සහ හොඳ ජල ද්‍රාව්‍යතාව වැනි ගුණ තිබිය යුතුය.","Solid primary standard එකකින් solution සකස් කිරීමට අවශ්‍ය moles හා mass ගණනය කර නිවැරදිව weigh කර, සුළු distilled water ප්‍රමාණයක dissolve කර, volumetric flask එකට quantitatively transfer කර mark එක දක්වා dilute කර හොඳින් mix කරයි.","Concentrated liquid reagent එකකින් solution සකස් කරන විට density සහ mass percentage භාවිතයෙන් stock concentration සොයා අවශ්‍ය stock volume ගණනය කරයි. Concentrated acid dilute කිරීමේදී ආරක්ෂිත ක්‍රමයට acid ජලයට එකතු කළ යුතුය.","Stock solution dilution සඳහා C₁V₁ = C₂V₂ යෙදේ. Stock solutions දෙකක් mix කිරීමේදී final solute moles = n₁+n₂ ලෙස mass balance කර අවසාන concentration සොයයි."],"f":"n = CV • m = nM • C₁V₁ = C₂V₂ • n(final)=Σn(stock)","exam":["Volumetric flask mark එකට final volume සකස් කරයි; solvent volume එක mark value එකට සමාන නොවේ.","Quantitative transfer සහ final mixing steps විභාග පිළිතුරට ඇතුළත් කරන්න.","Concentrated reagent concentration සඳහා density + w/w% + molar mass එකට භාවිත කරන්න."]},{"t":"රසායනික ප්‍රතික්‍රියා මත පදනම් වූ ගණනය","b":["Balanced chemical equation එකේ coefficients reactants සහ products අතර mole ratio සපයයි. දී ඇති mass/volume/concentration පළමුව moles බවට පරිවර්තනය කර stoichiometric ratio යොදා අවශ්‍ය species එකේ moles සොයයි.","Reactants කිහිපයක් දී ඇති විට එක් එක් reactant එකෙන් ලැබිය හැකි product amount සසඳා අඩු product amount දෙන reactant එක limiting reagent ලෙස හඳුනාගනී. අනෙක් reactant excess වේ.","Acid–base සහ redox titration calculations වල known standard solution එකේ C සහ V මගින් moles සොයා balanced equation stoichiometry මගින් unknown solution concentration තීරණය කරයි.","Gravimetric calculation එකක precipitate moles = precipitate mass / molar mass ලෙස ගෙන reaction stoichiometry මගින් original analyte amount සොයයි. සෑම පියවරකම balanced equation සහ units පෙන්වීම වැදගත්ය."],"f":"n = CV • n = m/M • mole ratio = coefficients ratio • limiting reagent → theoretical product","exam":["Stoichiometry ආරම්භ කිරීමට පෙර equation එක නිවැරදිව balance කරන්න.","Titration volume dm³ වලට convert කරන්න.","Limiting reagent හඳුනා නොගෙන product amount ගණනය නොකරන්න."]}],"en":[{"t":"Oxidation Number and Redox Reactions","b":["Oxidation number is the formal charge assigned when bonding electrons are allocated by an ionic approximation. A free element has oxidation number 0; a monatomic ion has its ionic charge.","Use standard rules: F is normally −1; O is normally −2 with peroxide/OF₂ exceptions; H is normally +1 but −1 in metal hydrides. The sum equals the overall species charge.","Calculate unknown oxidation states algebraically in molecules and polyatomic ions. In covalent structures, assign shared electrons toward the more electronegative atom.","An increase in oxidation number is oxidation; a decrease is reduction. The oxidizing agent is reduced and the reducing agent is oxidized."],"f":"Σ(O.N.) = overall charge • oxidation: O.N. ↑ • reduction: O.N. ↓","exam":["Apply O/H/F exceptions carefully.","Identify oxidizing and reducing agents from oxidation-state changes.","Distinguish neutral-compound and ion charge sums."]},{"t":"Inorganic Nomenclature","b":["Name the cation first and the anion second for simple ionic compounds.","For variable-charge metals, show the metal oxidation state with a Roman numeral, e.g. iron(II) sulfide and copper(II) chloride.","For simple covalent compounds use mono-, di-, tri-, tetra-, penta-, hexa-, hepta- and octa- prefixes; omit mono- for the first element in normal usage.","Learn common polyatomic ions and the acid naming patterns: binary hydro…ic acids and oxoacid -ate→-ic, -ite→-ous, with per-/hypo- where required."],"f":"FeCl₂ → iron(II) chloride • N₂O₄ → dinitrogen tetroxide • SO₄²⁻ → sulfate","exam":["Roman numerals indicate oxidation state.","Do not mix ionic and covalent naming rules.","Link -ate/-ite anions to -ic/-ous acids."]},{"t":"Atomic Mass, Mole and Avogadro Constant","b":["The atomic mass unit is 1/12 of the mass of a carbon-12 atom. Relative atomic mass is an isotopic-abundance weighted average.","One mole contains 6.022×10²³ specified entities, the Avogadro constant.","Molar mass is the mass of one mole, commonly expressed in g mol⁻¹.","Use n=m/M and N=nNₐ to move between mass, moles and particles."],"f":"Nₐ = 6.022×10²³ mol⁻¹ • n=m/M • N=nNₐ","exam":["Use weighted isotopic averages.","State particle type clearly.","Keep molar-mass units correct."]},{"t":"Chemical Formulae and Composition","b":["An empirical formula gives the simplest whole-number mole ratio; a molecular formula gives the actual atom numbers.","Calculate element mass percentage from its total mass contribution divided by compound molar mass.","Obtain empirical formula by converting masses/percentages to moles and simplifying the ratio.","Use molecular molar mass divided by empirical-formula mass to obtain the integer multiplier."],"f":"mass % X=(X contribution/M)×100 • molecular formula=(empirical formula)ₙ","exam":["A 100 g basis simplifies percentage data.","Convert fractional ratios to whole numbers.","Empirical and molecular formulae need not be identical."]},{"t":"Mixture and Solution Composition","b":["Use mass, volume and mole fractions to express mixture composition; mole fractions sum to 1.","Use w/w, v/v and mole percentages with consistent numerator and denominator bases.","Trace composition can be expressed as ppm or ppb.","Molarity M=n/V(dm³). The resource book also mentions molality but flags it outside the current syllabus; prioritize molarity and the stated composition measures."],"f":"Xᵢ=nᵢ/Σn • M=n/V(dm³) • ppm=fraction×10⁶","exam":["Convert cm³ to dm³.","Keep concentration bases distinct.","Use consistent units in ppm/ppb."]},{"t":"Balancing Chemical Equations","b":["In inspection balancing, change coefficients only, never chemical subscripts.","For redox equations, oxidation-number changes can be used to equate electrons lost and gained.","In the half-reaction method, balance atoms and charge; use H⁺/H₂O in acidic medium and OH⁻ as needed for basic medium.","In nuclear equations, both total mass number A and atomic number Z are conserved."],"f":"e⁻ lost=e⁻ gained • ΣA left=ΣA right • ΣZ left=ΣZ right","exam":["Never alter subscripts.","Balance charge in half reactions.","Conserve both A and Z in nuclear reactions."]},{"t":"Preparation of Solutions","b":["A primary standard should be pure, stable, non-hygroscopic and suitable for accurate weighing.","To prepare from a solid, calculate and weigh, dissolve, quantitatively transfer to a volumetric flask, make to the mark and mix.","For concentrated liquid reagents use density and mass percentage to calculate stock concentration before dilution.","For dilution use C₁V₁=C₂V₂; for mixing stocks use conservation of total solute moles."],"f":"n=CV • m=nM • C₁V₁=C₂V₂","exam":["Final volume is set at the volumetric-flask mark.","Include quantitative transfer and mixing.","Use density and w/w% correctly."]},{"t":"Reaction-based Chemical Calculations","b":["Balanced coefficients provide stoichiometric mole ratios.","Identify the limiting reagent when multiple reactants are supplied.","Use known C and V in acid–base or redox titrations and the balanced-equation ratio to obtain the unknown concentration.","In gravimetry, convert precipitate mass to moles and use stoichiometry to obtain the original analyte amount."],"f":"n=CV • n=m/M • mole ratio=coefficient ratio","exam":["Balance first.","Convert volumes correctly.","Check the limiting reagent before product calculations."]}],"ta":[{"t":"ஒக்சிசனேற்ற எண் மற்றும் Redox வினைகள்","b":["Oxidation number என்பது bonding electrons ஐ ionic approximation மூலம் ஒதுக்கும்போது atom ஒன்றுக்கு வழங்கப்படும் formal charge ஆகும். Free element இற்கு 0; monatomic ion இற்கு அதன் charge.","F பொதுவாக −1, O பொதுவாக −2 (peroxide மற்றும் OF₂ exceptions), H பொதுவாக +1 ஆனால் metal hydride இல் −1. Oxidation numbers இன் sum species இன் total charge க்கு சமம்.","Molecule மற்றும் polyatomic ion களில் தெரியாத oxidation state ஐ algebra மூலம் கணக்கிடலாம்.","Oxidation number அதிகரித்தால் oxidation; குறைந்தால் reduction. Oxidizing agent தானே reduced ஆகும்; reducing agent தானே oxidized ஆகும்."],"f":"Σ(O.N.) = overall charge • oxidation: O.N. ↑ • reduction: O.N. ↓","exam":["O/H/F exceptions நினைவில் கொள்க.","Agents ஐ oxidation-state change மூலம் கண்டறிக.","Neutral மற்றும் ionic species charge sum வேறுபாட்டை கவனிக்கவும்."]},{"t":"அகர்பனிக் சேர்மங்களின் பெயரிடல்","b":["Ionic compound இல் cation பெயர் முதலில், anion பெயர் பின்னர் எழுதப்படும்.","Variable oxidation state metals க்கு Roman numeral மூலம் oxidation state காட்டப்படும்.","Simple covalent compounds க்கு mono, di, tri, tetra போன்ற prefixes பயன்படும்.","Common polyatomic ions மற்றும் binary/oxo acid naming patterns ஐ கற்றுக்கொள்ள வேண்டும்."],"f":"FeCl₂ → iron(II) chloride • N₂O₄ → dinitrogen tetroxide • SO₄²⁻ → sulfate","exam":["Roman numeral = oxidation state.","Ionic மற்றும் covalent rules ஐ கலக்க வேண்டாம்.","-ate/-ite → -ic/-ous acid pattern நினைவில் கொள்க."]},{"t":"Atomic mass, mole மற்றும் Avogadro constant","b":["1 u என்பது ¹²C atom mass இன் 1/12 ஆகும். Relative atomic mass isotopic abundance weighted average ஆகும்.","1 mol இல் 6.022×10²³ entities உள்ளன.","Molar mass என்பது ஒரு mole இன் mass; பொதுவாக g mol⁻¹.","n=m/M மற்றும் N=nNₐ மூலம் mass, moles, particles இடையே மாற்றலாம்."],"f":"Nₐ=6.022×10²³ mol⁻¹ • n=m/M • N=nNₐ","exam":["Weighted average பயன்படுத்தவும்.","Particle type ஐ குறிப்பிடவும்.","Units சரியாக இருக்க வேண்டும்."]},{"t":"Chemical formulae மற்றும் composition","b":["Empirical formula simplest whole-number mole ratio; molecular formula actual atom numbers.","Formula மூலம் element mass percentage கணக்கிடலாம்.","Mass/percentage → moles → simplest ratio மூலம் empirical formula பெறலாம்.","Molecular molar mass / empirical-formula mass மூலம் integer multiplier பெறலாம்."],"f":"mass % X=(X contribution/M)×100 • molecular formula=(empirical formula)ₙ","exam":["Percentage data க்கு 100 g basis உதவும்.","Fractional ratios ஐ whole numbers ஆக்கவும்.","Empirical மற்றும் molecular formula வேறுபடலாம்."]},{"t":"Mixture மற்றும் solution composition","b":["Mass, volume மற்றும் mole fractions மூலம் composition குறிப்பிடலாம்; mole fractions sum = 1.","w/w, v/v மற்றும் mole percentages பயன்படுத்தலாம்.","Trace amounts ppm அல்லது ppb ஆகக் குறிப்பிடலாம்.","Molarity M=n/V(dm³). Resource book molality யையும் குறிப்பிடுகிறது; ஆனால் தற்போதைய syllabus க்கு வெளியானதாகக் குறிக்கிறது."],"f":"Xᵢ=nᵢ/Σn • M=n/V(dm³) • ppm=fraction×10⁶","exam":["cm³ ஐ dm³ ஆக மாற்றவும்.","Concentration bases ஐ கலக்க வேண்டாம்.","ppm/ppb units சரிபார்க்கவும்."]},{"t":"Chemical equations balancing","b":["Inspection method இல் coefficients மட்டும் மாற்ற வேண்டும்; subscripts மாற்றக்கூடாது.","Redox balancing இல் oxidation-number changes மூலம் electrons lost/gained சமப்படுத்தலாம்.","Half-reaction method இல் atoms மற்றும் charge balance செய்யப்படுகிறது; acidic/basic medium க்கு H⁺, H₂O, OH⁻ பயன்படுத்தப்படும்.","Nuclear equation இல் total A மற்றும் Z இரண்டும் conserved."],"f":"e⁻ lost=e⁻ gained • ΣA left=ΣA right • ΣZ left=ΣZ right","exam":["Subscripts மாற்ற வேண்டாம்.","Half reactions இல் charge balance செய்யவும்.","A மற்றும் Z இரண்டையும் conserve செய்யவும்."]},{"t":"Solutions தயாரித்தல்","b":["Primary standard தூய்மையான, நிலையான மற்றும் accurate weighing க்கு ஏற்றதாக இருக்க வேண்டும்.","Solid இலிருந்து solution தயாரிக்க mass கணக்கிட்டு weigh, dissolve, volumetric flask க்கு quantitative transfer, mark வரை dilute, mix செய்யவும்.","Concentrated reagent க்கு density மற்றும் mass percentage மூலம் stock concentration கணக்கிடலாம்.","Dilution: C₁V₁=C₂V₂; stock mixtures க்கு total solute moles conserve செய்யப்படுகின்றன."],"f":"n=CV • m=nM • C₁V₁=C₂V₂","exam":["Volumetric mark final volume ஐ தருகிறது.","Quantitative transfer அவசியம்.","Density + w/w% சரியாக பயன்படுத்தவும்."]},{"t":"Reaction-based calculations","b":["Balanced equation coefficients stoichiometric mole ratio தருகின்றன.","பல reactants இருந்தால் limiting reagent கண்டறிய வேண்டும்.","Acid–base/redox titration இல் known C,V மற்றும் mole ratio மூலம் unknown concentration பெறலாம்.","Gravimetry இல் precipitate mass → moles → original analyte amount கணக்கிடப்படுகிறது."],"f":"n=CV • n=m/M • mole ratio=coefficient ratio","exam":["முதலில் equation balance செய்யவும்.","Volume units மாற்றவும்.","Limiting reagent சரிபார்க்கவும்."]}]};

var unit4Notes={"si":[{"t":"පදාර්ථයේ අවස්ථා සහ වායුමය හැසිරීම","b":["පදාර්ථය ඝන, ද්‍රව සහ වායු අවස්ථාවල පැවතිය හැකි අතර ඒවායේ හැඩය, පරිමාව, ඝනත්වය, සම්පීඩ්‍යතාව සහ අංශු චලිතය වෙනස් වේ. ඝනයක අංශු නියමිත සැකසුමක කම්පනය කරයි; ද්‍රවයක අංශු සමීපව සිටියත් ස්ථාන මාරු කළ හැක; වායුවක අංශු බොහෝ දුරින් සිට නිදහසේ චලනය වේ.","වායුවකට ස්ථිර හැඩයක් හෝ පරිමාවක් නොමැති අතර එය බඳුනේ මුළු පරිමාව පුරවයි. වායු ඉතා සම්පීඩ්‍ය, සාපේක්ෂව අඩු ඝනත්වයකින් යුත් අතර සෑම දිශාවකටම පීඩනය යොදයි සහ බාහිර යාන්ත්‍රික බලයක් නොමැතිව එකිනෙක සමව මිශ්‍ර වේ.","පදාර්ථයේ අවස්ථාව තීරණය වන්නේ අන්තර්අණුක ආකර්ෂණ බල සහ අංශුවල තාප චලිතය අතර සමතුලිතතාවයෙනි. උෂ්ණත්වය වැඩි කිරීමෙන් අංශුවල සාමාන්‍ය චාලක ශක්තිය වැඩි වන අතර අවස්ථා මාරු වීමට ප්‍රවණතාවය වැඩි වේ.","වායු පද්ධතියක් විස්තර කිරීමට පීඩනය P, පරිමාව V, නිරපේක්ෂ උෂ්ණත්වය T සහ ද්‍රව්‍ය ප්‍රමාණය n ප්‍රධාන අවස්ථා විචල්‍ය ලෙස භාවිත වේ. ගෑස් නීති වලදී උෂ්ණත්වය Kelvin වලින් භාවිත කිරීම අත්‍යවශ්‍යය."],"f":"T/K = t/°C + 273.15 • state variables: P, V, T, n","exam":["ඝන/ද්‍රව/වායු අතර අංශු දුර හා චලිතය සසඳන්න.","Gas-law calculations සඳහා °C සෘජුව භාවිත නොකර Kelvin බවට පරිවර්තනය කරන්න.","වායුවක සම්පීඩ්‍යතාව සහ අඩු ඝනත්වය අංශු අතර විශාල හිස් අවකාශය සමඟ සම්බන්ධ කරන්න."]},{"t":"පරිපූර්ණ වායුව සහ පරිපූර්ණ වායු සමීකරණය","b":["පරිපූර්ණ වායුවක් යනු අංශු අතර ආකර්ෂණ/විකර්ෂණ බල නොමැති සහ අංශුවල ස්වකීය පරිමාව බඳුනේ පරිමාවට සාපේක්ෂව නොසලකා හැරිය හැකි ලෙස සලකන සංකල්පීය වායුවකි.","පරිපූර්ණ වායුවේ පීඩනය, පරිමාව, මෝල ප්‍රමාණය සහ නිරපේක්ෂ උෂ්ණත්වය PV = nRT මගින් සම්බන්ධ වේ. R භාවිත කරන ඒකක පද්ධතියට ගැළපිය යුතුය.","PV = nRT භාවිතයෙන් P, V, T හෝ n යන එකක් අනෙක් තුනෙන් සොයාගත හැක. n = m/M යොදා වායුවේ ස්කන්ධය, මෝලික ස්කන්ධය හෝ ඝනත්වයද සම්බන්ධ කර ගණනය කළ හැක.","පීඩනය Pa, bar, atm, torr/mmHg වැනි ඒකක වලින් දැක්විය හැක. Resource book එක 1 atm = 101325 Pa = 760 torr ලෙස භාවිත කරන බැවින් ගණනයකට පෙර සියලු ඒකක එකම පද්ධතියකට ගෙන යා යුතුය."],"f":"PV = nRT • n = m/M • 1 atm = 101325 Pa = 760 torr","exam":["R අගයට ගැළපෙන P සහ V ඒකක භාවිත කරන්න.","PV=nRT මගින් density සම්බන්ධතාවයක් ලබාගත හැකි බව තේරුම්ගන්න.","Absolute temperature සහ pressure conversions වල unit errors වළක්වන්න."]},{"t":"Boyle, Charles, Avogadro සහ සංයුක්ත වායු නීති","b":["නියත උෂ්ණත්වයේ සහ නියත වායු ප්‍රමාණයක Boyle නීතිය අනුව P ∝ 1/V වේ; එබැවින් P₁V₁ = P₂V₂. පරිමාව දෙගුණ කළහොත් පීඩනය අඩක් වේ.","නියත පීඩනයේ සහ නියත වායු ප්‍රමාණයක Charles නීතිය අනුව V ∝ T(K) වේ; එබැවින් V₁/T₁ = V₂/T₂. 0 K යනු −273.15 °C ලෙස නිර්වචනය කරන නිරපේක්ෂ ශූන්‍යයට සම්බන්ධ වේ.","නියත T සහ P යටතේ Avogadro නීතිය අනුව V ∝ n වේ. එකම T සහ P යටතේ සමාන වායු පරිමා එකම අංශු ගණනක්/මෝල ප්‍රමාණයක් සම්බන්ධ කරයි. මෝලික පරිමාව Vₘ = V/n ලෙස සලකයි.","එකම වායු ප්‍රමාණයක P, V සහ T එකවර වෙනස් වන විට P₁V₁/T₁ = P₂V₂/T₂ යන සංයුක්ත වායු නීතිය භාවිත කළ හැක."],"f":"P₁V₁=P₂V₂ • V₁/T₁=V₂/T₂ • V∝n • Vₘ=V/n • P₁V₁/T₁=P₂V₂/T₂","exam":["Boyle: T,n constant; Charles: P,n constant; Avogadro: P,T constant.","Charles law සඳහා Kelvin අනිවාර්යය.","Combined gas law නියත වායු ප්‍රමාණයකට පමණක් යොදන්න."]},{"t":"Dalton අර්ධ පීඩන නීතිය සහ ජලය මත වායු එකතු කිරීම","b":["ප්‍රතික්‍රියා නොකරන වායු මිශ්‍රණයක මුළු පීඩනය එක් එක් සංඝටක වායුවේ අර්ධ පීඩනවල එකතුව වේ: Pᵀ = P₁ + P₂ + … . අර්ධ පීඩනය යනු එම වායුව තනිවම එම T සහ V යටතේ යොදන පීඩනයයි.","වායුවක mole fraction xᵢ = nᵢ/nᵀ වන අතර එහි අර්ධ පීඩනය Pᵢ = xᵢPᵀ වේ. එබැවින් mixture composition සහ pressure එකිනෙක සෘජුව සම්බන්ධ කළ හැක.","ජලය මත එකතු කරන වායුවකට ජල වාෂ්පද අඩංගු වේ. එබැවින් dry gas pressure = total pressure − saturated water-vapour pressure යන correction එක යොදා පසුව PV=nRT භාවිත කළ යුතුය.","Dalton නීතිය අදාළ වන්නේ එකිනෙක සමඟ සැලකිය යුතු ලෙස ප්‍රතික්‍රියා නොකරන වායු සඳහාය. Reaction හෝ condensation සිදුවේ නම් composition වෙනස් වන නිසා mole fractions සහ partial pressures නැවත සලකා බැලිය යුතුය."],"f":"Pᵀ=ΣPᵢ • xᵢ=nᵢ/nᵀ • Pᵢ=xᵢPᵀ • P(dry gas)=P(total)−P(H₂O)","exam":["Gas collected over water → water-vapour pressure අඩු කරන්න.","Mole fractions එකතුව 1 වේ.","Partial pressure සහ total pressure එකම pressure units වල තබන්න."]},{"t":"වායු පිළිබඳ චාලක අණුක වාදය","b":["චාලක අණුක වාදය අනුව වායුව ඉතා කුඩා අංශු විශාල සංඛ්‍යාවකින් සමන්විත වන අතර ඒවා අතර හිස් අවකාශය අංශු ප්‍රමාණයට වඩා විශාලය. පරිපූර්ණ වායුවක අංශු අතර ආකර්ෂණ/විකර්ෂණ බල නොසලකයි.","අංශු එකිනෙක හෝ බඳුනේ බිත්ති සමඟ ගැටෙන තුරු අහඹු දිශාවල සෘජු රේඛීයව චලනය කරයි. ගැටීම් පූර්ණ ප්‍රත්‍යාස්ථ වන බැවින් මුළු චාලක ශක්තිය සංරක්ෂණය වේ.","බඳුනේ බිත්ති සමඟ ගැටීම් මගින් වායු පීඩනය ඇති වේ. අංශු ගණන වැඩි කිරීම හෝ ඒවායේ වේගය වැඩි කිරීම එකම පරිමාවකදී collision frequency/momentum transfer වැඩි කර පීඩනය වැඩි කරයි.","පරිපූර්ණ වායුවක සාමාන්‍ය චාලක ශක්තිය නිරපේක්ෂ උෂ්ණත්වය මත පමණක් රඳා පවතී. වාදයෙන් PV = (1/3)Nm c²ᵣₘₛ වැනි molecular-level සම්බන්ධතාවයක් ලබාගත හැක."],"f":"PV = (1/3)Nm c²ᵣₘₛ • average KE depends on T only","exam":["පීඩනයේ molecular explanation = wall collisions.","Elastic collision යන අර්ථය මුළු kinetic energy conserve වීමයි.","Same T හි විවිධ ideal gases සඳහා average molecular KE එක සමාන වේ."]},{"t":"RMS වේගය, චාලක ශක්තිය සහ Maxwell–Boltzmann ව්‍යාප්තිය","b":["Root-mean-square speed cᵣₘₛ = √(3RT/M) වේ; මෙහි M kg mol⁻¹ වලින් භාවිත කළ යුතුය. එකම උෂ්ණත්වයේදී අඩු molar mass ඇති වායුවේ cᵣₘₛ වැඩිය.","එක් molecule එකක සාමාන්‍ය translational kinetic energy = (3/2)kBT වන අතර මෝලයක සඳහා = (3/2)RT වේ. එබැවින් average kinetic energy gas identity මත නොව T මත පමණක් රඳා පවතී.","වායු අංශු සියල්ල එකම වේගයකින් චලනය නොකරයි. Maxwell–Boltzmann distribution එක අංශු කොටස speed range එකකට විහිදී ඇති ආකාරය පෙන්වයි.","උෂ්ණත්වය වැඩි කළ විට distribution එක පුළුල් වී peak එක පහළට සහ වැඩි වේගයක දිශාවට ගමන් කරයි. එකම T හි වැඩි molar mass ඇති gas distribution එක සාමාන්‍යයෙන් අඩු වේගයන් වෙත පිහිටයි."],"f":"cᵣₘₛ=√(3RT/M) • KE(molecule)=3kBT/2 • KE(mol)=3RT/2","exam":["cᵣₘₛ සඳහා M kg mol⁻¹ ලෙස භාවිත කරන්න.","Same T: lighter gas → larger characteristic speeds.","Higher T: broader MB curve, lower peak, shifted right."]},{"t":"තාත්වික වායු සහ සම්පීඩ්‍යතා සාධකය","b":["තාත්වික වායු පරිපූර්ණ හැසිරීමෙන් අපගමනය වන්නේ අංශු අතර අන්තර්අණුක ආකර්ෂණ/විකර්ෂණ බල සහ අංශුවල සීමිත ස්වකීය පරිමාව නිසාය. අපගමනය සාමාන්‍යයෙන් ඉහළ පීඩන සහ අඩු උෂ්ණත්ව වල වැඩි වේ.","Compressibility factor Z = PV/(nRT) මගින් ideal behaviour එකෙන් අපගමනය මිනුම් කරයි. පරිපූර්ණ වායුවකට සියලු පීඩනවල Z = 1 වේ.","ආකර්ෂණ බල ප්‍රබල වන පරාසයක Z < 1 විය හැකි අතර ඉතා ඉහළ පීඩනයේ finite molecular volume/repulsion ප්‍රමුඛ වීමෙන් Z > 1 විය හැක. ගෑස් වර්ගය සහ උෂ්ණත්වය අනුව වක්‍ර වෙනස් වේ.","අඩු පීඩනය සහ ඉහළ උෂ්ණත්වය තාත්වික වායුව ideal behaviour එකට වඩාත් සමීප කරන තත්ත්ව වේ, මන්ද අංශු දුර වැඩි වී intermolecular interactions අඩුවේ."],"f":"Z = PV/(nRT) • ideal gas: Z=1 • low P + high T → more ideal","exam":["Z=1 ideal; Z<1 attractions dominate; Z>1 repulsion/finite volume dominate.","Real-gas deviation වැඩි වන්නේ low T/high P වල.","Compressibility-factor graph එක qualitative ලෙස විවරණය කළ හැකි විය යුතුය."]},{"t":"van der Waals සමීකරණය, අවධි උෂ්ණත්වය සහ වායු ද්‍රවීකරණය","b":["van der Waals model එක පරිපූර්ණ වායු සමීකරණයට corrections දෙකක් එක් කරයි: intermolecular attractions සඳහා pressure correction එකක් සහ molecules අත්පත් කරගන්නා පරිමාව සඳහා volume correction එකක්.","n moles සඳහා (P + an²/V²)(V − nb) = nRT. a constant එක attractions වල ප්‍රබලතාවයට සම්බන්ධ වන අතර b constant එක molecular excluded volume සමඟ සම්බන්ධ වේ.","අඩු පීඩනයේ සහ ඉහළ උෂ්ණත්වයේ correction terms සාපේක්ෂව කුඩා බැවින් van der Waals equation එක ideal-gas form එකට ආසන්න වේ. ඉහළ පීඩනයේ V−nb term එක සහ attractions correction දෙකම වැදගත් වේ.","Critical temperature Tᶜ යනු වායුව/වාෂ්පය පීඩනය පමණක් යොදා ද්‍රව කළ හැකි උපරිම උෂ්ණත්වයයි; T > Tᶜ නම් කොතරම් පීඩනය වැඩි කළත් ද්‍රවීකරණය කළ නොහැක. Resource book එක CO₂ සඳහා Tᶜ ≈ 30.98 °C ලෙස උදාහරණයක් දක්වයි."],"f":"(P+an²/V²)(V−nb)=nRT • a → attractions • b → molecular volume • T>Tᶜ: pressure alone cannot liquefy","exam":["van der Waals correction දෙකේ physical meaning වෙන වෙනම දැනගන්න.","Low P/high T → ideal approximation වඩා හොඳයි.","Critical temperature අර්ථය boiling point සමඟ ගැලපී නොයන්න."]}],"en":[{"t":"States of Matter and Gaseous Behaviour","b":["Solids, liquids and gases differ in particle arrangement, motion, shape, volume, density and compressibility.","A gas has no fixed shape or volume, fills its container, is highly compressible, has low density and mixes uniformly.","Physical state reflects the balance between intermolecular attraction and thermal motion.","Gas states are described mainly by P, V, T and n; gas-law temperatures use Kelvin."],"f":"T/K=t/°C+273.15 • state variables P,V,T,n","exam":["Compare particle motion in the three states.","Use Kelvin in gas laws.","Relate gas compressibility to large empty space."]},{"t":"Ideal Gas and Ideal-gas Equation","b":["An ideal gas neglects intermolecular forces and molecular volume relative to the container.","P, V, n and T are related by PV=nRT.","The equation supports calculations of amount, mass, molar mass and density when units are consistent.","The resource book uses 1 atm=101325 Pa=760 torr for pressure conversion."],"f":"PV=nRT • n=m/M • 1 atm=101325 Pa=760 torr","exam":["Match units to R.","Convert temperature and pressure correctly.","Recognize the ideal-gas assumptions."]},{"t":"Boyle, Charles, Avogadro and Combined Laws","b":["At constant T and n, Boyle's law gives P∝1/V and P₁V₁=P₂V₂.","At constant P and n, Charles's law gives V∝T(K) and V₁/T₁=V₂/T₂.","At constant P and T, Avogadro's law gives V∝n; molar volume is Vₘ=V/n.","For fixed amount of gas, P₁V₁/T₁=P₂V₂/T₂ combines pressure, volume and temperature changes."],"f":"P₁V₁=P₂V₂ • V₁/T₁=V₂/T₂ • V∝n • Vₘ=V/n • P₁V₁/T₁=P₂V₂/T₂","exam":["Know what is held constant in each law.","Use absolute temperature.","Apply the combined law only to fixed gas amount."]},{"t":"Dalton's Law and Gas Collected over Water","b":["For non-reacting gases the total pressure is the sum of component partial pressures.","Mole fraction xᵢ=nᵢ/nᵀ and Pᵢ=xᵢPᵀ.","Gas collected over water contains water vapour, so subtract its saturated vapour pressure before using PV=nRT.","Composition changes caused by reaction require recalculating mole fractions and partial pressures."],"f":"Pᵀ=ΣPᵢ • xᵢ=nᵢ/nᵀ • Pᵢ=xᵢPᵀ • Pdry=Ptotal−PH₂O","exam":["Correct for water vapour.","Mole fractions sum to 1.","Use common pressure units."]},{"t":"Kinetic Molecular Theory","b":["Ideal-gas particles are tiny relative to the container and are widely separated, with negligible attractions or repulsions.","They move randomly in straight lines between perfectly elastic collisions.","Pressure results from collisions with container walls.","Average translational kinetic energy depends only on absolute temperature; molecular theory gives PV=(1/3)Nmc²ᵣₘₛ."],"f":"PV=(1/3)Nmc²ᵣₘₛ • average KE depends only on T","exam":["Explain pressure using collisions.","Define elastic collision.","Same T means equal average molecular KE."]},{"t":"RMS Speed, Kinetic Energy and Maxwell-Boltzmann Distribution","b":["cᵣₘₛ=√(3RT/M), with M in kg mol⁻¹.","Mean translational KE is 3kBT/2 per molecule and 3RT/2 per mole.","Gas molecules possess a distribution of speeds rather than one common speed.","Increasing T broadens and shifts a Maxwell-Boltzmann distribution to higher speeds; heavier gases are slower at the same T."],"f":"cᵣₘₛ=√(3RT/M) • KE=3kBT/2 • KE(mol)=3RT/2","exam":["Use kg mol⁻¹ for M.","Lighter gas is faster at equal T.","Interpret temperature effects on the distribution."]},{"t":"Real Gases and Compressibility Factor","b":["Real gases deviate because molecules have finite volume and intermolecular interactions.","Z=PV/(nRT); an ideal gas has Z=1.","Z<1 commonly reflects dominant attractions, whereas Z>1 reflects repulsion/finite-volume effects.","Low pressure and high temperature favour near-ideal behaviour."],"f":"Z=PV/(nRT) • ideal: Z=1","exam":["Interpret Z values.","Know conditions for strongest deviation.","Explain low-P/high-T ideality."]},{"t":"van der Waals Equation, Critical Temperature and Liquefaction","b":["The van der Waals equation corrects pressure for attractions and volume for finite molecular size.","For n moles: (P+an²/V²)(V−nb)=nRT; a relates to attraction and b to excluded volume.","At low pressure/high temperature the corrections become relatively small.","Critical temperature is the highest temperature at which pressure can liquefy a gas; the book uses CO₂, Tᶜ≈30.98 °C, as an example."],"f":"(P+an²/V²)(V−nb)=nRT • a: attraction • b: excluded volume","exam":["Know both corrections.","Connect ideality to low P/high T.","Define critical temperature correctly."]}],"ta":[{"t":"பொருளின் நிலைகள் மற்றும் வாயு நடத்தைகள்","b":["திடம், திரவம், வாயு ஆகியவை particle arrangement, motion, shape, volume, density மற்றும் compressibility இல் வேறுபடும்.","Gas க்கு நிலையான shape/volume இல்லை; container ஐ நிரப்பி எளிதில் compress ஆகும்.","Physical state என்பது intermolecular attraction மற்றும் thermal motion இடையிலான சமநிலையால் தீர்மானிக்கப்படுகிறது.","Gas state ஐ P, V, T, n மூலம் விவரிக்கலாம்; T Kelvin ஆகப் பயன்படுத்த வேண்டும்."],"f":"T/K=t/°C+273.15 • P,V,T,n","exam":["மூன்று நிலைகளின் particle motion ஐ ஒப்பிடுக.","Kelvin பயன்படுத்துக.","Gas compressibility ஐ particle spacing உடன் இணைக்கவும்."]},{"t":"Ideal gas மற்றும் PV=nRT","b":["Ideal gas இல் intermolecular forces மற்றும் molecular volume புறக்கணிக்கப்படுகின்றன.","PV=nRT மூலம் P,V,n,T தொடர்புபடுத்தப்படுகின்றன.","Mass, molar mass மற்றும் density calculations க்கும் இதை பயன்படுத்தலாம்.","1 atm=101325 Pa=760 torr என resource book பயன்படுத்துகிறது."],"f":"PV=nRT • n=m/M • 1 atm=101325 Pa=760 torr","exam":["R க்கு ஏற்ப units தேர்ந்தெடுக்கவும்.","T மற்றும் P conversions கவனிக்கவும்.","Ideal assumptions தெரிந்திருக்க வேண்டும்."]},{"t":"Boyle, Charles, Avogadro மற்றும் combined laws","b":["Constant T,n: P₁V₁=P₂V₂.","Constant P,n: V₁/T₁=V₂/T₂.","Constant P,T: V∝n; Vₘ=V/n.","Fixed gas amount: P₁V₁/T₁=P₂V₂/T₂."],"f":"P₁V₁=P₂V₂ • V₁/T₁=V₂/T₂ • V∝n • Vₘ=V/n","exam":["ஒவ்வொரு law இலும் constant variables தெரிந்திருக்க வேண்டும்.","Kelvin பயன்படுத்தவும்.","Combined law fixed n க்கு."]},{"t":"Dalton partial pressure","b":["Non-reacting gas mixture இல் total pressure = sum of partial pressures.","xᵢ=nᵢ/nᵀ மற்றும் Pᵢ=xᵢPᵀ.","Water மீது collected gas இல் water vapour pressure ஐ total இலிருந்து கழிக்
