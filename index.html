en:[
{t:"Atomic models and subatomic particles",b:["Cathode-ray experiments established the existence of negatively charged electrons.","Positive-ray observations showed that positive ions can be produced in discharge tubes.","Rutherford scattering led to the nuclear model: most of the atom is empty space and positive charge is concentrated in a very small nucleus.","Protons and neutrons occupy the nucleus; electrons occupy regions outside the nucleus."],f:"electron: e⁻   proton: p⁺   neutron: n⁰",v:"rutherford"},
{t:"Atomic number, mass number and isotopes",b:["Atomic number Z = number of protons.","Mass number A = protons + neutrons, therefore N = A − Z.","Isotopes have the same Z but different neutron numbers.","Relative atomic mass is a weighted mean of isotopic masses and their natural abundances."],f:"⁽ᴬ⁾₍Z₎X   •   N = A − Z   •   Aᵣ = Σ(isotopic mass × fractional abundance)"},
{t:"Electromagnetic radiation",b:["Electromagnetic radiation can be described by wavelength λ and frequency ν.","All electromagnetic radiation travels at c in vacuum.","Photon energy increases with frequency and decreases with wavelength."],f:"c = νλ   •   E = hν = hc/λ"},
{t:"Atomic spectra and energy levels",b:["Electrons in atoms occupy quantized energy levels.","Absorption occurs when an electron gains exactly the energy required for a higher level.","Emission occurs when an electron falls to a lower level and releases a photon.","The hydrogen line spectrum provides evidence for quantized energy levels."],f:"ΔE = hν",v:"spectrum"},
{t:"Orbitals and quantum numbers",b:["An orbital is a region described by a wavefunction where an electron has a high probability of being found.","s orbitals are spherical; p orbitals have two lobes.","Each orbital holds a maximum of two electrons with opposite spins.","Subshell capacities: s = 2, p = 6, d = 10, f = 14."],f:"n, l, mₗ, mₛ"},
{t:"Electron configuration",b:["Electrons fill lower-energy orbitals first (Aufbau principle).","No two electrons in an atom have the same set of four quantum numbers (Pauli principle).","Degenerate orbitals are singly occupied before pairing (Hund rule).","Configurations such as Cr and Cu show familiar stability-related exceptions to the simplest filling order."],f:"1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p",v:"config"},
{t:"Periodic trends",b:["Across a period, effective nuclear attraction generally increases.","Atomic radius generally decreases across a period and increases down a group.","First ionization energy generally increases across a period, with known exceptions.","Electronegativity generally increases across a period and decreases down a group."],f:"trend reasoning = nuclear charge + shielding + distance + electron configuration"}
],

{t:"පරමාණුක වාදය, කැතෝඩ කිරණ, ධන කිරණ සහ න්‍යෂ්ටිය",b:[
"පදාර්ථයේ අති සුළු මූලික ඒකක පිළිබඳ අදහස ඩිමොක්‍රිටස් වැනි පුරාණ දාර්ශනිකයන්ගෙන් ආරම්භ වූ අතර 1808 දී ජෝන් ඩෝල්ටන් (Dalton) එය විද්‍යාත්මක පරමාණුක වාදයක් ලෙස සංවිධානය කළේය. ඩෝල්ටන් (Dalton)ගේ ප්‍රධාන අදහස් වූයේ මූලද්‍රව්‍ය පරමාණු වලින් සමන්විත වීම, එකම මූලද්‍රව්‍යයේ පරමාණු අතර සමානත්වය, රසායනික ප්‍රතික්‍රියාවලදී පරමාණු නිර්මාණය/විනාශ නොවීම සහ සංයෝග සරල පූර්ණ සංඛ්‍යා අනුපාතවලින් සෑදීමයි.",
"අඩු පීඩන වායුවක් සහිත විද්‍යුත් විසර්ජන නළයකට ඉහළ විභව අන්තරයක් යෙදූ විට කැතෝඩයෙන් ඇනෝඩය දෙසට ගමන් කරන ඍණ ආරෝපිත කදම්බය කැතෝඩ කිරණ ලෙස හැඳින්වේ. ඒවා සෘජු රේඛාවක ගමන් කරයි, ස්කන්ධය හා චාලක ශක්තිය ඇති අංශු කදම්බයක් ලෙස හැසිරෙයි, ප්‍රතිදීප්තතාව ඇති කළ හැකි අතර විද්‍යුත් හා චුම්බක ක්ෂේත්‍රවලදී අපගමනය වේ.",
"කැතෝඩ කිරණවල ස්වභාවය නළයේ වායුව හෝ කැතෝඩය සෑදූ ද්‍රව්‍යය වෙනස් කළත් වෙනස් නොවන බව ජේ. ජේ. තොම්සන් (J. J. Thomson) පෙන්වා දුන්නේය. ඔහු e/m ≈ 1.76 × 10⁸ C g⁻¹ ලෙස ආරෝපණය/ස්කන්ධ අනුපාතය නිරණය කළ අතර කැතෝඩ කිරණ ඍණ ආරෝපිත අංශු කදම්බයක් ලෙස විස්තර කළේය.",
"තොම්සන් (Thomson) විසින් ධන ආරෝපිත ගෝලයක් තුළ ඉලෙක්ට්‍රෝන පැතිරී ඇති ‘plum-pudding’ ආකෘතිය යෝජනා කළේය. පසුව මිලිකන් (Millikan)ගේ oil-drop පරීක්ෂණයෙන් ඉලෙක්ට්‍රෝනයේ ආරෝපණයේ විශාලත්වය |e| = 1.602 × 10⁻¹⁹ C ලෙස ලැබුණු අතර තොම්සන් (Thomson)ගේ e/m අගය සමඟ එය භාවිත කර ඉලෙක්ට්‍රෝන ස්කන්ධය ≈ 9.10 × 10⁻²⁸ g ලෙස ගණනය කළ හැකි විය.",
"ගෝල්ඩ්ස්ටයින් (Goldstein)ගේ සිදුරු සහිත කැතෝඩ නළ පරීක්ෂණවලින් ධන කිරණ (canal rays) හඳුනා ගන්නා ලදී. ඒවා ධන ආරෝපිත අයනවලින් සමන්විත වන අතර ස්වභාවය නළයේ වායුව මත රඳා පවතී. හයිඩ්‍රජන් වායුවෙන් ලැබෙන සැහැල්ලුම ධන අංශුව ප්‍රෝටෝනයයි; එහි ආරෝපණය +1.602 × 10⁻¹⁹ C සහ සාපේක්ෂ ස්කන්ධය ආසන්න වශයෙන් 1 වේ.",
"විකිරණශීලී ද්‍රව්‍යවලින් α, β සහ γ විකිරණ නිකුත් වේ. α අංශු ධන ආරෝපිත, β අංශු ඉලෙක්ට්‍රෝන ස්වභාවයෙන් ඍණ ආරෝපිත වන අතර γ විකිරණයට ආරෝපණයක් නැත. එබැවින් විද්‍යුත් ක්ෂේත්‍රයකදී α හා β විරුද්ධ දිශාවලට අපගමනය වන අතර γ අපගමනය නොවේ.",

"s බ්ලොක් සඳහා පිටත වින්‍යාසය ns¹ හෝ ns² වන අතර p බ්ලොක් සඳහා සාමාන්‍ය පිටත වින්‍යාසය ns²np¹–⁶ වේ. එක් එක් බ්ලොක්හි තීරු ගණන එම උපකවචයට පිරවිය හැකි උපරිම ඉලෙක්ට්‍රෝන ගණනට සම්බන්ධ වේ."

"ආවර්තයක් හරහා Z_eff වැඩි වන නිසා පරමාණුක අරය සාමාන්‍යයෙන් අඩු වේ. කාණ්ඩයක් පහළට නව ඉලෙක්ට්‍රෝන කවච එකතු වන නිසා පරමාණුක අරය වැඩි වේ.",
"ධන අයනය එහි මව් පරමාණුවට වඩා කුඩාය; ඍණ අයනය මව් පරමාණුවට වඩා විශාලය. සම-ඉලෙක්ට්‍රෝනික අංශු O²⁻, F⁻, Ne, Na⁺, Mg²⁺ වැනි ශ්‍රේණියකදී ඉලෙක්ට්‍රෝන ගණන එකම බැවින් න්‍යෂ්ටික ආරෝපණය වැඩි වන විට අරය අඩු වේ.",
"පළමු අයනීකරණ ශක්තිය යනු භූමි තත්ත්වයේ ඒකක වායුමය පරමාණුවකින් වඩාත් ලිහිල්ව බැඳුණු ඉලෙක්ට්‍රෝනය ඉවත් කිරීමට අවශ්‍ය අවම ශක්තියයි. එය සාමාන්‍යයෙන් ආවර්තයක් හරහා වැඩි වන අතර කාණ්ඩයක් පහළට අඩු වේ. පිරුණු හෝ අර්ධ-පිරුණු උපකවචවල අමතර ස්ථායීතාව නිසා Be→B සහ N→O වැනි අපවාද පවතී.",
"ඉලෙක්ට්‍රෝන ලබා ගැනීමේ ශක්ති වෙනස ΔE_EG යනු වායුමය පරමාණුවකට ඉලෙක්ට්‍රෝනයක් එක් කළ විට සිදුවන ශක්ති වෙනසයි. බොහෝ පරමාණු සඳහා එය ඍණ අගයක් වන අතර ශක්තිය නිදහස් වේ; උදාහරණ ලෙස Cl(g)+e⁻→Cl⁻(g), ΔE_EG ≈ −349 kJ mol⁻¹. Be හා N වැනි ස්ථායී උපකවච වින්‍යාස සඳහා එය ධන විය හැක.",

{t:"அணு மாதிரிகள் மற்றும் துணைஅணுத் துகள்கள்",b:["Cathode-ray பரிசோதனைகள் எதிர்மின்னூட்டம் கொண்ட electron இருப்பை உறுதிப்படுத்தின.","Positive-ray அவதானிப்புகள் discharge tube இல் positive ions உருவாகலாம் என்பதை காட்டின.","Rutherford scattering மூலம் அணுவின் பெரும்பகுதி வெற்றிடம் என்றும் positive charge மிகச் சிறிய nucleus இல் திரண்டுள்ளது என்றும் அறியப்பட்டது.","Proton மற்றும் neutron nucleus இல்; electron nucleus க்கு வெளியே உள்ள பகுதிகளில் காணப்படுகின்றன."],f:"electron: e⁻   proton: p⁺   neutron: n⁰",v:"rutherford"},

{t:"மின்காந்தக் கதிர்வீச்சு",b:["மின்காந்தக் கதிர்வீச்சை wavelength λ மற்றும் frequency ν மூலம் விவரிக்கலாம்.","Vacuum இல் அனைத்தும் c வேகத்தில் பயணிக்கின்றன.","Photon energy frequency உடன் அதிகரித்து wavelength உடன் குறைகிறது."],f:"c = νλ   •   E = hν = hc/λ"},

{t:"Orbital மற்றும் quantum numbers",b:["Orbital என்பது electron இருப்பதற்கான அதிக probability உள்ள பகுதியை குறிக்கிறது.","s orbital கோள வடிவம்; p orbital இரு-lobe வடிவம்.","ஒரு orbital இல் அதிகபட்சம் இரண்டு electron கள் எதிர் spin உடன் இருக்கலாம்.","Subshell capacities: s = 2, p = 6, d = 10, f = 14."],f:"n, l, mₗ, mₛ"},

{t:"සහසංයුජ බන්ධන, අෂ්ටක නියමය සහ ලුවිස් ව්‍යුහ",b:["සහසංයුජ බන්ධනයක් සෑදෙන්නේ පරමාණු දෙකක් අතර ඉලෙක්ට්‍රෝන යුගලයක් හවුලේ තබා ගැනීමෙනි. සාමාන්‍යයෙන් එක් එක් පරමාණුව බැඳුම් ඉලෙක්ට්‍රෝනයක් බැගින් සපයන අතර බන්ධනය මගින් සංයුජතා කවචයේ වඩා ස්ථායී ඉලෙක්ට්‍රෝන වින්‍යාසයක් ලබාගැනීමට හැකි වේ.","දෙවන ආවර්තයේ C, N, O සහ F වැනි මූලද්‍රව්‍ය අෂ්ටකය සම්පූර්ණ කිරීමට ප්‍රබල ප්‍රවණතාවක් දක්වයි. තුන්වන සහ පසුව ආවර්තවල සමහර මධ්‍ය පරමාණු සඳහා අෂ්ටකයට වඩා වැඩි ඉලෙක්ට්‍රෝන පැවතිය හැකි අතර Be, B, Al වැනි පරමාණු අෂ්ටකය සම්පූර්ණ නොකර ඉලෙක්ට්‍රෝන හිඟ සංයෝග සෑදිය හැක.","NO සහ NO₂ වැනි ඔත්තේ සංයුජතා ඉලෙක්ට්‍රෝන සංඛ්‍යාවක් ඇති ප්‍රභේදවල සියලු පරමාණු සඳහා සම්පූර්ණ අෂ්ටකයක් ලබාදිය නොහැක. එබැවින් අෂ්ටක නියමය වැදගත් මාර්ගෝපදේශයක් වුවත් එය සෑම ව්‍යුහයකටම අනිවාර්ය නොවේ.","ලුවිස් තිත් සටහනක් සඳහා මුළු සංයුජතා ඉලෙක්ට්‍රෝන ගණන ගණනය කරයි; ඍණ ආරෝපණයක් සඳහා ඉලෙක්ට්‍රෝන එකතු කර ධන ආරෝපණයක් සඳහා අඩු කරයි. සාමාන්‍යයෙන් H සහ F මධ්‍ය පරමාණු නොවන අතර, මධ්‍ය පරමාණුව ලෙස අඩු විද්‍යුත් ඍණතාවක් ඇති සහ බන්ධන කිහිපයක් සෑදිය හැකි පරමාණුව තෝරයි.","පළමුව මධ්‍ය හා පර්යන්ත පරමාණු අතර තනි බන්ධන සලකුණු කර පර්යන්ත පරමාණුවල අෂ්ටක සම්පූර්ණ කරයි. ඉතිරි ඉලෙක්ට්‍රෝන මධ්‍ය පරමාණුව මත තබා අවශ්‍ය නම් lone pair බන්ධන යුගල බවට පරිවර්තනය කර ද්විත්ව හෝ ත්‍රිත්ව බන්ධන සෑදීමෙන් වඩා සුදුසු ලුවිස් ව්‍යුහය ලබාගනී."],f:"මුළු valence e⁻ = Σ(valence e⁻) ± charge   •   single = 1 shared pair   •   double = 2 shared pairs   •   triple = 3 shared pairs",exam:["මුළු සංයුජතා ඉලෙක්ට්‍රෝන ගණන සොයා Lewis structure ඇඳීම","අෂ්ටකයට වඩා අඩු/වැඩි සහ odd-electron ප්‍රභේද හඳුනාගැනීම","මධ්‍ය පරමාණුව නිවැරදිව තෝරා ගැනීම","single/double/triple bond හඳුනාගැනීම"]},
{t:"දායක සහසංයුජ බන්ධන සහ VSEPR මූලධර්ම",b:["දායක සහසංයුජ බන්ධනයකදී හවුලේ තබාගන්නා ඉලෙක්ට්‍රෝන යුගලය සම්පූර්ණයෙන්ම එක් පරමාණුවක lone pair එකකින් සපයයි. ඉලෙක්ට්‍රෝන යුගල දායකයාගෙන් ඉලෙක්ට්‍රෝන හිඟ acceptor එක දෙසට ඊතලයකින් එය නිරූපණය කළ හැක.","NH₃ හි N මත lone pair එක BF₃ හි B මත ඇති හිස් කාක්ෂිකයට දායක වී H₃N→BF₃ වැනි adduct එකක් සෑදිය හැක. ලෝහ අයන සමඟ NH₃, H₂O, CO හෝ CN⁻ වැනි lone-pair donor ප්‍රභේද complex ions සෑදීමේදීද දායක බන්ධන වැදගත් වේ.","VSEPR ආකෘතිය අනුව මධ්‍ය පරමාණුව වටා ඇති ඉලෙක්ට්‍රෝන යුගල/ඉලෙක්ට්‍රෝන ඝනත්ව ප්‍රදේශ එකිනෙකෙන් හැකි තරම් ඈත්වී විකර්ෂණය අවම වන ආකාරයට අවකාශයේ සැකසේ.","lone pair එකක් එක් න්‍යෂ්ටියක ආකර්ෂණයට පමණක් යටත් නිසා බන්ධන යුගලයකට වඩා වැඩි අවකාශ පරිමාවක් ගනී. එබැවින් සාමාන්‍යයෙන් lone pair–lone pair විකර්ෂණය > lone pair–bond pair > bond pair–bond pair වේ.","ද්විත්ව හෝ ත්‍රිත්ව බන්ධනයක ඉලෙක්ට්‍රෝන යුගල කිහිපයක් තිබුණද VSEPR සඳහා එම බහු බන්ධනය එක් විකර්ෂණ ඒකකයක් හෙවත් එක් electron domain එකක් ලෙස සලකයි."],f:"LP–LP > LP–BP > BP–BP   •   multiple bond = 1 VSEPR domain",exam:["දායක බන්ධනයේ donor හා acceptor හඳුනාගැනීම","NH₃→BF₃ සහ metal–ligand bonding","VSEPR domain ගණනය","lone pair නිසා bond angle වෙනස් වීම"]},
{t:"VSEPR අනුව ඉලෙක්ට්‍රෝන යුගල ජ්‍යාමිතිය සහ අණුක හැඩ",b:["මධ්‍ය පරමාණුව වටා VSEPR ඒකක 2ක් ඇති විට electron-pair geometry රේඛීය වන අතර කෝණය 180° වේ. CO₂, HCN සහ NO₂⁺ වැනි ප්‍රභේද මෙයට උදාහරණ වේ.","VSEPR ඒකක 3ක් ඇති විට තලීය ත්‍රිකෝණාකාර electron-pair geometry ලැබේ; කෝණය 120° වේ. BF₃, SO₃ සහ H₂CO වැනිවල lone pair නොමැතිනම් shape එකද trigonal planar වන අතර SO₂ වැනි එක් lone pair එකක් ඇති විට shape එක bent වේ.","VSEPR ඒකක 4ක් ඇති විට tetrahedral electron-pair geometry (≈109.5°) ලැබේ. CH₄ tetrahedral, NH₃ එක් lone pair එකක් නිසා trigonal pyramidal, H₂O lone pair දෙකක් නිසා bent වේ.","VSEPR ඒකක 5ක් trigonal bipyramidal geometry ලබාදේ. PCl₅ trigonal bipyramidal, SCl₄ seesaw, ICl₃ T-shaped සහ XeF₂ linear වේ; lone pairs සඳහා equatorial ස්ථාන සාමාන්‍යයෙන් අඩු විකර්ෂණයක් ලබාදේ.","VSEPR ඒකක 6ක් ඇති විට octahedral electron-pair geometry ලැබේ. SF₆ octahedral, XeOF₄ එක lone pair එකක් සමඟ square pyramidal සහ XeF₄ lone pairs දෙකක් සමඟ square planar වේ.","electron-pair geometry කියන්නේ සියලු electron domains වල සැකැස්මයි; molecular shape කියන්නේ bonded atoms වල සැකැස්මයි. එබැවින් lone pair පවතින විට මෙම දෙක එකම නොවිය හැක."],f:"2 → linear 180°   •   3 → trigonal planar 120°   •   4 → tetrahedral 109.5°   •   5 → trigonal bipyramidal   •   6 → octahedral",exam:["Lewis structure → electron domains → electron geometry → molecular shape ක්‍රමය","CH₄/NH₃/H₂O shapes","PCl₅/SCl₄/ICl₃/XeF₂ shapes","SF₆/XeOF₄/XeF₄ shapes","lone-pair positions සහ distortion"]},
{t:"කාක්ෂික මුහුම්කරණය සහ σ / π බන්ධන",b:["කාක්ෂික මුහුම්කරණය යනු බන්ධන විස්තර කිරීමට භාවිත කරන ආකෘතියකි. එකම පරමාණුවේ s සහ p කාක්ෂික මිශ්‍ර වී ශක්තියෙන් හා හැඩයෙන් සමාන hybrid orbitals සෑදෙන බව සලකයි.","sp³ මුහුම්කරණයේ s එකක් සහ p තුනක් එක්ව hybrid orbitals 4ක් සෑදේ; ඒවා tetrahedral ලෙස ≈109.5° කෝණවල දිශාගත වේ. s-character 25% සහ p-character 75% වේ.","sp² මුහුම්කරණයේ s එකක් සහ p දෙකක් එක්ව hybrid orbitals 3ක් සෑදී එකම තලයක 120° කෝණවල පවතී. එක් unhybridized p orbital එක තලයට ලම්බව පවතින අතර sp මුහුම්කරණයේ hybrid orbitals 2ක් 180° රේඛීයව පවතී; unhybridized p orbitals 2ක් ඉතිරි වේ.","σ බන්ධනයක් කාක්ෂික දෙකක් internuclear axis එක දිගේ face-to-face overlap වීමෙන් සෑදේ. π බන්ධනයක් parallel p orbitals දෙකක් side-on overlap වීමෙන් සෑදී electron density internuclear axis එකේ ඉහළ හා පහළ ප්‍රදේශවල පැතිරේ.","ද්විත්ව බන්ධනය = 1σ + 1π වන අතර ත්‍රිත්ව බන්ධනය = 1σ + 2π වේ. C₂H₄ හි C පරමාණු sp² සහ C₂H₂ හි C පරමාණු sp මුහුම්කරණයෙන් විස්තර කළ හැක."],f:"sp³ = 25% s, 109.5°   •   sp² = 33.3% s, 120°   •   sp = 50% s, 180°   •   double = σ+π   •   triple = σ+2π",exam:["sp³/sp²/sp හඳුනාගැනීම","hybrid orbital number සහ geometry","σ හා π overlap වෙනස","double/triple bond සංයුතිය","C₂H₄ හා C₂H₂ orbital picture"]},
{t:"සම්ප්‍රයුක්ත ව්‍යුහ, සම්ප්‍රයුක්ත මුහුම සහ විධිමත් ආරෝපණය",b:["එකම atom skeleton එක තබාගෙන π ඉලෙක්ට්‍රෝන හෝ lone-pair ඉලෙක්ට්‍රෝන ස්ථාන වෙනස් කර Lewis structures කිහිපයක් ලියන්න හැකි විට ඒවා resonance structures හෙවත් සම්ප්‍රයුක්ත ව්‍යුහ ලෙස සැලකේ. ඒ තනි තනි ව්‍යුහ සත්‍ය ලෙස වෙන වෙනම පවතින්නේ නැත.","සත්‍ය ප්‍රභේදය resonance hybrid එකකි. සමාන resonance structures තිබේ නම් ඒවා hybrid එකට සමාන දායකත්වයක් ලබාදෙන අතර delocalization නිසා සමාන බන්ධන දිග සහ අඩු ශක්තිය/වැඩි ස්ථායීතාව ලැබිය හැක.","NO₂⁻, NO₃⁻, CO₃²⁻ සහ O₃ වැනි ප්‍රභේදවල π electron density බන්ධන කිහිපයක් පුරා විස්ථාපනය වේ. resonance arrows මගින් nuclei ස්ථාන නොව electron pairs පමණක් මාරු කරන බව මතක තබාගත යුතුය.","විධිමත් ආරෝපණය (formal charge) යනු Lewis structure එකක atom එකකට පැවරෙන ගණිතමය ආරෝපණයකි. FC = valence electrons − [nonbonding electrons + bond count] යන NIE ආකාරයෙන් ගණනය කළ හැකි අතර සියලු formal charges එකතුව molecule/ion එකේ මුළු charge එකට සමාන වේ.","වඩා ස්ථායී Lewis/resonance දායක ව්‍යුහ සාමාන්‍යයෙන් formal charge separation අවම කරයි, octet සහ බන්ධන ගණන වැඩි කරයි, ඍණ formal charge වඩා විද්‍යුත් ඍණ atom මත තබයි සහ O/F වැනි ඉතා electronegative atoms මත ධන formal charge තැබීම අඩු කරයි."],f:"FC = valence e⁻ − (nonbonding e⁻ + bond count)   •   ΣFC = overall charge",exam:["resonance structures vs resonance hybrid","NO₂⁻/NO₃⁻/CO₃²⁻/O₃ resonance","formal charge ගණනය","දායක resonance structures වල relative stability තීරණය"]},
{t:"බන්ධන ධ්‍රැවීයතාව, අණුක ධ්‍රැවීයතාව, ද්විධ්‍රැව ඝූර්ණය සහ විද්‍යුත් ඍණතාව",b:["බන්ධනය සෑදූ පරමාණු දෙක අතර විද්‍යුත් ඍණතා වෙනස ඇති විට shared electron density වැඩි electronegativity ඇති පරමාණුව දෙසට වැඩි වශයෙන් යොමු වී δ⁺ සහ δ⁻ අර්ධ ආරෝපණ ඇති polar covalent bond එකක් ලැබේ.","සමස්ත molecule එක polar ද nonpolar ද යන්න bond polarity පමණක් නොව molecular geometry එකත් තීරණය කරයි. CO₂ හි C=O bonds polar වුවත් linear symmetry නිසා dipoles cancel වේ; CCl₄ හි tetrahedral symmetry ද සමස්ත dipole එක cancel කරයි.","ද්විධ්‍රැව ඝූර්ණය μ යනු charge separation එකේ විශාලත්වය සහ දුර යන දෙකම සලකන vector quantity එකකි: μ = δr. සාමාන්‍යයෙන් Debye (D) ඒකකයෙන් ප්‍රකාශ කරන අතර 1 D ≈ 3.34 × 10⁻³⁰ C m වේ.","පරමාණුවක electronegativity එහි පරිසරය සමඟ වෙනස් විය හැක. s-character වැඩි වන විට C(sp³) < C(sp²) < C(sp); positive charge වැඩි වීම electronegativity වැඩි කරයි, negative charge එය අඩු කරයි.","hybridization සහ charge සමාන නම් oxidation state හා බැඳී ඇති අනෙකුත් atoms වල electronegativity වැනි සාධකද බලපායි. NIE උදාහරණවල H₂S < SO₃²⁻ < SO₄²⁻ සඳහා S හි electronegativity oxidation state අනුව වැඩි වන ආකාරය හා CF₄/CCl₄ වැනි අවස්ථාවල අසල්වැසි atoms බලපෑම පෙන්වයි."],f:"μ = δr   •   1 D ≈ 3.34 × 10⁻³⁰ C m   •   C(sp³) < C(sp²) < C(sp)",exam:["bond polarity vs molecular polarity","CO₂/CCl₄ dipole cancellation","dipole moment calculation/concept","electronegativity factors: hybridization, charge, oxidation state, neighbouring atoms"]},
{t:"අයනික බන්ධන, අයනික දැලිස සහ ධ්‍රැවීකරණය",b:["අයනික බන්ධනය සෑදෙන්නේ ධන සහ ඍණ අයන අතර ස්ථිති විද්‍යුත් ආකර්ෂණයෙනි. ඝන අයනික සංයෝගවල අයන නියමිත රටාවකට දැලිසක සැකසී බොහෝ අසල්වැසි විරුද්ධ ආරෝපිත අයන සමඟ ආකර්ෂණයට ලක්වේ.","NaCl දැලිස තුළ සෑම Na⁺ අයනයක් වටා Cl⁻ අයන 6ක්ද සෑම Cl⁻ අයනයක් වටා Na⁺ අයන 6ක්ද පවතින 6:6 coordination එකක් ඇත.","cation එකක් anion electron cloud එක විකෘති කිරීමට ඇති හැකියාව polarizing power ලෙස සැලකිය හැක. cation එක කුඩා වීම හා charge වැඩි වීම polarizing power වැඩි කරයි.","anion electron cloud එක විකෘති වීමට ඇති පහසුව polarizability ලෙස සලකයි. සාමාන්‍යයෙන් anion එක විශාල වීම සහ charge magnitude වැඩි වීම polarizability වැඩි කරයි.","cation polarizing power සහ anion polarizability වැඩි වන විට අයනික බන්ධනයේ pure ionic character අඩුවී covalent character වැඩි විය හැක."],f:"polarizing power ↑ : cation radius ↓, charge ↑   •   polarizability ↑ : anion radius ↑, charge magnitude ↑",exam:["NaCl lattice coordination","cation polarizing power trend","anion polarizability trend","ionic vs covalent character reasoning"]},
{t:"ලෝහක බන්ධන සහ ද්විතීය/අන්තර්අණුක අන්තර්ක්‍රියා",b:["ලෝහක බන්ධන ආකෘතියේ ලෝහ පරමාණු සංයුජතා ඉලෙක්ට්‍රෝන delocalized electron sea එකකට දායක කරන අතර ධන metal ion cores දැලිසක පවතී. ion cores සහ mobile electron cloud අතර electrostatic attraction ලෝහක බන්ධනයට හේතු වේ.","ලෝහක බන්ධන ප්‍රබලතාවට delocalization සඳහා දායක කරන electron ගණන, metal ion radius සහ valence electrons නිදහස් කිරීමට ඇති ප්‍රවණතාව වැනි සාධක බලපායි. මෙය ලෝහවල විදුලි හා තාප සන්නායකතාවය පැහැදිලි කිරීමට උපකාරී වේ.","ද්විතීය අන්තර්ක්‍රියා අතර ion–dipole, dipole–dipole, ion-induced dipole, dipole-induced dipole සහ London dispersion interactions අඩංගු වේ. polar solvent එකක ionic solute දියවීමේදී ion–dipole interactions වැදගත් වේ.","hydrogen bonding ප්‍රබල dipole–dipole interaction වර්ගයකි. විශාල δ⁺ H එකක් N, O හෝ F වැනි electronegative atom එකකට සම්බන්ධ වී ඇති විට වෙනත් electronegative atom එකක් සමඟ attraction සෑදිය හැක; intermolecular සහ intramolecular hydrogen bonds දෙකම හැකි වේ.","London dispersion forces සියලු atoms/molecules අතර පවතින instantaneous dipole–induced dipole interactions වේ. electron cloud polarizability සහ contact surface area වැඩි වන විට ඒවා ශක්තිමත් වන අතර molecular shape හා intermolecular forces boiling point වැනි භෞතික ගුණ තීරණය කිරීමට වැදගත් වේ."],f:"ion–dipole   •   dipole–dipole   •   H-bond   •   ion–induced dipole   •   dipole–induced dipole   •   London dispersion",exam:["metallic electron-sea model","intermolecular force වර්ග හඳුනාගැනීම","hydrogen-bond donor/acceptor reasoning","water/ice hydrogen-bond network","London force සහ molecular size/shape/boiling-point trends"]}
],
en:[
{t:"Covalent bonding, the octet rule and Lewis structures",b:["A covalent bond forms when two atoms share an electron pair. In a conventional two-electron bond, each atom usually contributes one electron to the shared pair.","Second-period C, N, O and F strongly tend toward an octet, while later-period central atoms may exceed the octet and Be/B/Al compounds may be electron deficient; odd-electron species such as NO and NO₂ are also exceptions.","To draw a Lewis structure, count total valence electrons and adjust for charge, choose a suitable central atom, connect atoms by single bonds, complete peripheral octets, place remaining electrons on the central atom and form multiple bonds when needed.","H and F are generally not central atoms; the less electronegative atom that can form several bonds is usually central.","The preferred Lewis structure should satisfy appropriate valence requirements while avoiding unnecessary charge separation."],f:"total valence e⁻ = Σ(valence e⁻) ± charge • single / double / triple bonds = 1 / 2 / 3 shared pairs"},
{t:"Coordinate covalent bonding and VSEPR fundamentals",b:["In a coordinate covalent bond, both electrons of the shared pair are supplied by one donor atom.","NH₃ can donate its lone pair to electron-deficient BF₃; lone-pair donors such as NH₃, H₂O, CO and CN⁻ also form coordinate bonds to metal ions.","VSEPR treats electron-density regions around a central atom as repelling domains that arrange to maximize separation.","Lone-pair repulsion is stronger than bond-pair repulsion, so the usual order is LP–LP > LP–BP > BP–BP.","A double or triple bond is treated as one electron domain for VSEPR shape prediction."],f:"LP–LP > LP–BP > BP–BP • multiple bond = one VSEPR domain"},
{t:"Electron-pair geometry and molecular shape",b:["Two electron domains give linear geometry, 180°.","Three domains give trigonal-planar geometry, 120°; one lone pair changes the molecular shape to bent.","Four domains give tetrahedral electron geometry; CH₄ is tetrahedral, NH₃ trigonal pyramidal and H₂O bent.","Five domains give trigonal-bipyramidal geometry: PCl₅, SCl₄, ICl₃ and XeF₂ illustrate the derived shapes.","Six domains give octahedral geometry: SF₆, XeOF₄ and XeF₄ illustrate octahedral, square-pyramidal and square-planar shapes.","Electron-pair geometry includes all domains; molecular shape considers bonded atoms."],f:"2: linear • 3: trigonal planar • 4: tetrahedral • 5: trigonal bipyramidal • 6: octahedral"},
{t:"Hybridization and σ/π bonds",b:["Hybridization is a bonding model in which atomic orbitals on one atom are mixed to form equivalent, directed hybrid orbitals.","sp³ gives four tetrahedral hybrids; sp² gives three trigonal-planar hybrids and one unhybridized p orbital; sp gives two linear hybrids and two unhybridized p orbitals.","The s-character increases sp³ < sp² < sp.","A σ bond results from head-on overlap along the internuclear axis; a π bond results from side-on overlap of parallel p orbitals.","A double bond contains one σ and one π bond; a triple bond contains one σ and two π bonds."],f:"sp³ 109.5° • sp² 120° • sp 180° • double=σ+π • triple=σ+2π"},
{t:"Resonance and formal charge",b:["Resonance structures have the same atomic skeleton but differ in the positions of π electrons or lone pairs.","The real species is a resonance hybrid; equivalent contributors make equal contributions and delocalization can equalize bond lengths.","NO₂⁻, NO₃⁻, CO₃²⁻ and O₃ are representative resonance systems.","Formal charge is calculated from valence electrons, nonbonding electrons and bond count; the sum of formal charges equals the overall charge.","More important resonance contributors generally minimize charge separation and place negative charge on the more electronegative atom."],f:"FC = valence e⁻ − (nonbonding e⁻ + bond count) • ΣFC = overall charge"},
{t:"Polarity, dipole moment and electronegativity",b:["Electronegativity differences polarize covalent bonds.","Molecular polarity depends on both bond dipoles and geometry; CO₂ and CCl₄ are nonpolar because their bond dipoles cancel by symmetry.","Dipole moment is a vector quantity described by μ = δr and commonly expressed in Debye.","Electronegativity can vary with hybridization: C(sp³) < C(sp²) < C(sp).","Charge, oxidation state and the nature of attached atoms also affect electronegativity."],f:"μ=δr • 1 D≈3.34×10⁻³⁰ C m • C(sp³)<C(sp²)<C(sp)"},
{t:"Ionic bonding and polarization",b:["Ionic bonding is electrostatic attraction between oppositely charged ions arranged in a lattice.","In the NaCl lattice each Na⁺ has six Cl⁻ neighbours and each Cl⁻ has six Na⁺ neighbours.","Small, highly charged cations have greater polarizing power.","Large and/or more highly charged anions are more polarizable.","Greater polarization increases covalent character in an otherwise ionic interaction."],f:"polarizing power ↑ as cation radius ↓ and charge ↑ • polarizability ↑ as anion radius ↑"},
{t:"Metallic bonding and secondary interactions",b:["The metallic model consists of positive metal-ion cores stabilized by a delocalized mobile electron cloud.","Metallic bond strength depends on factors including the number of donated electrons, ionic size and the tendency to release valence electrons.","Secondary interactions include ion–dipole, dipole–dipole, ion-induced dipole, dipole-induced dipole and London dispersion interactions.","Hydrogen bonding is a particularly strong dipolar interaction involving strongly polarized H and electronegative atoms such as N, O or F.","London forces act between all atoms and molecules and grow with polarizability and effective contact surface area, helping explain boiling-point and phase trends."],f:"ion–dipole • dipole–dipole • H-bond • induced dipoles • London dispersion"}
],

{t:"சகபிணைப்பு, octet விதி மற்றும் Lewis அமைப்புகள்",b:["இரு அணுக்கள் electron pair ஒன்றை பகிரும்போது covalent bond உருவாகிறது.","C, N, O, F போன்ற இரண்டாம் period அணுக்கள் octet பெற முயலும்; சில later-period central atoms expanded octet காட்டலாம்; Be/B/Al electron-deficient species மற்றும் NO/NO₂ odd-electron species விதிவிலக்குகள்.","Lewis structure வரைய total valence electrons எண்ணி charge ஐ சரிசெய்து central atom தேர்வு செய்து single bonds அமைத்து peripheral octets பூர்த்தி செய்ய வேண்டும்.","H மற்றும் F பொதுவாக central atom ஆகாது; பல bonds அமைக்கக்கூடிய குறைந்த electronegativity atom பொதுவாக central atom ஆகும்.","தேவையான போது lone pair ஐ bonding pair ஆக மாற்றி multiple bonds அமைத்து பொருத்தமான Lewis structure பெறலாம்."],f:"total valence e⁻ = Σ(valence e⁻) ± charge"},
{t:"Coordinate covalent bond மற்றும் VSEPR அடிப்படை",b:["Coordinate covalent bond இல் shared pair இன் இரண்டு electrons உம் ஒரே donor atom இலிருந்து வருகிறது.","NH₃ lone pair ஐ BF₃ இன் electron-deficient B க்கு donate செய்யும்; NH₃/H₂O/CO/CN⁻ metal ions உடன் complexes உருவாக்கலாம்.","VSEPR இல் central atom ஐச் சுற்றிய electron-density domains ஒருவரை ஒருவர் தள்ளி அதிக separation பெறும்.","Lone pair repulsion bond-pair repulsion ஐ விட அதிகம்: LP–LP > LP–BP > BP–BP.","Double/triple bond VSEPR இல் ஒரு domain ஆக எண்ணப்படுகிறது."],f:"LP–LP > LP–BP > BP–BP"},
{t:"Electron-pair geometry மற்றும் molecular shape",b:["2 domains → linear, 180°.","3 domains → trigonal planar, 120°; ஒரு lone pair இருந்தால் bent shape.","4 domains → tetrahedral; CH₄ tetrahedral, NH₃ trigonal pyramidal, H₂O bent.","5 domains → trigonal bipyramidal; PCl₅, SCl₄, ICl₃, XeF₂ derived shapes.","6 domains → octahedral; SF₆, XeOF₄, XeF₄ எடுத்துக்காட்டுகள்.","Electron-pair geometry எல்லா domains ஐக் கொண்டது; molecular shape bonded atoms ஐக் கொண்டது."],f:"2 linear • 3 trigonal planar • 4 tetrahedral • 5 TBP • 6 octahedral"},
{t:"Hybridization மற்றும் σ/π bonds",b:["Hybridization என்பது ஒரே atom இன் atomic orbitals கலந்து equivalent hybrid orbitals உருவாகும் bonding model.","sp³ = 4 tetrahedral hybrids; sp² = 3 trigonal planar hybrids + one p; sp = 2 linear hybrids + two p orbitals.","s-character: sp³ < sp² < sp.","σ bond internuclear axis வழி head-on overlap; π bond parallel p orbitals இன் side-on overlap.","Double bond = 1σ+1π; triple bond = 1σ+2π."],f:"sp³ 109.5° • sp² 120° • sp 180°"},
{t:"Resonance மற்றும் formal charge",b:["Resonance structures இல் atom skeleton ஒரேதாக இருக்கும்; π electrons/lone pairs இடம் மாறும்.","உண்மையான species resonance hybrid ஆகும்; equivalent contributors சமமாக பங்களிக்கின்றன.","NO₂⁻, NO₃⁻, CO₃²⁻, O₃ எடுத்துக்காட்டுகள்.","Formal charge valence electrons, nonbonding electrons மற்றும் bond count மூலம் கணக்கிடப்படுகிறது.","சிறந்த contributors charge separation ஐ குறைத்து negative charge ஐ அதிக electronegative atom மீது வைக்கும்."],f:"FC = valence e⁻ − (nonbonding e⁻ + bond count)"},
