en:[
{t:"Atomic models and subatomic particles",b:["Cathode-ray experiments established the existence of negatively charged electrons.","Positive-ray observations showed that positive ions can be produced in discharge tubes.","Rutherford scattering led to the nuclear model: most of the atom is empty space and positive charge is concentrated in a very small nucleus.","Protons and neutrons occupy the nucleus; electrons occupy regions outside the nucleus."],f:"electron: e⁻   proton: p⁺   neutron: n⁰",v:"rutherford"},
{t:"Atomic number, mass number and isotopes",b:["Atomic number Z = number of protons.","Mass number A = protons + neutrons, therefore N = A − Z.","Isotopes have the same Z but different neutron numbers.","Relative atomic mass is a weighted mean of isotopic masses and their natural abundances."],f:"⁽ᴬ⁾₍Z₎X   •   N = A − Z   •   Aᵣ = Σ(isotopic mass × fractional abundance)"},
{t:"Electromagnetic radiation",b:["Electromagnetic radiation can be described by wavelength λ and frequency ν.","All electromagnetic radiation travels at c in vacuum.","Photon energy increases with frequency and decreases with wavelength."],f:"c = νλ   •   E = hν = hc/λ"},
{t:"Atomic spectra and energy levels",b:["Electrons in atoms occupy quantized energy levels.","Absorption occurs when an electron gains exactly the energy required for a higher level.","Emission occurs when an electron falls to a lower level and releases a photon.","The hydrogen line spectrum provides evidence for quantized energy levels."],f:"ΔE = hν",v:"spectrum"},
{t:"Orbitals and quantum numbers",b:["An orbital is a region described by a wavefunction where an electron has a high probability of being found.","s orbitals are spherical; p orbitals have two lobes.","Each orbital holds a maximum of two electrons with opposite spins.","Subshell capacities: s = 2, p = 6, d = 10, f = 14."],f:"n, l, mₗ, mₛ"},
{t:"Electron configuration",b:["Electrons fill lower-energy orbitals first (Aufbau principle).","No two electrons in an atom have the same set of four quantum numbers (Pauli principle).","Degenerate orbitals are singly occupied before pairing (Hund rule).","Configurations such as Cr and Cu show familiar stability-related exceptions to the simplest filling order."],f:"1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p",v:"config"},
{t:"Periodic trends",b:["Across a period, effective nuclear attraction generally increases.","Atomic radius generally decreases across a period and increases down a group.","First ionization energy generally increases across a period, with known exceptions.","Electronegativity generally increases across a period and decreases down a group."],f:"trend reasoning = nuclear charge + shielding + distance + electron configuration"}

{t:"පරමාණුක ආකෘති හා උපපරමාණුක අංශු",b:["Cathode-ray පරීක්ෂණ මඟින් ඍණ ආරෝපිත electron පවතින බව තහවුරු විය.","Positive-ray නිරීක්ෂණ මඟින් discharge tube තුළ ධන අයන ඇති කළ හැකි බව පෙනේ.","Rutherford scattering මඟින් පරමාණුවේ වැඩි කොටස හිස් අවකාශයක් බවත් ධන ආරෝපණය ඉතා කුඩා nucleus එකක සංකේන්ද්‍රණය වී ඇති බවත් පෙන්වයි.","Proton සහ neutron nucleus තුළද electron nucleus පිටත ප්‍රදේශවලද පවතී."],f:"electron: e⁻   proton: p⁺   neutron: n⁰",v:"rutherford"},
{t:"පරමාණුක ක්‍රමාංකය, ස්කන්ධ ක්‍රමාංකය සහ සමස්ථානික",b:["පරමාණුක ක්‍රමාංකය Z = proton ගණන.","ස්කන්ධ ක්‍රමාංකය A = proton + neutron. ඒ නිසා N = A − Z.","Isotope වල Z එකම වන අතර neutron ගණන වෙනස් වේ.","සාපේක්ෂ පරමාණුක ස්කන්ධය isotopic mass සහ natural abundance භාවිත කරන weighted mean එකකි."],f:"⁽ᴬ⁾₍Z₎X   •   N = A − Z   •   Aᵣ = Σ(isotopic mass × fractional abundance)"},
{t:"විද්‍යුත් චුම්බක විකිරණ",b:["විද්‍යුත් චුම්බක විකිරණ wavelength λ සහ frequency ν මඟින් විස්තර කළ හැක.","Vacuum තුළ සියලු විද්‍යුත් චුම්බක විකිරණ c වේගයෙන් ගමන් කරයි.","Photon energy frequency සමඟ වැඩි වන අතර wavelength සමඟ අඩු වේ."],f:"c = νλ   •   E = hν = hc/λ"},
{t:"පරමාණුක වර්ණාවලි සහ ශක්ති මට්ටම්",b:["Electron පවතින්නේ quantized energy level වලය.","Electron එකක් ඉහළ energy level එකකට යාමට නිශ්චිත energy එකක් අවශෝෂණය කරයි.","පහළ level එකකට පැමිණීමේදී photon එකක් නිකුත් වේ.","Hydrogen line spectrum එක quantized energy levels සඳහා සාක්ෂියකි."],f:"ΔE = hν",v:"spectrum"},
{t:"කාක්ෂික සහ quantum numbers",b:["Orbital එකක් electron එක හමුවීමේ ඉහළ probability ඇති ප්‍රදේශයක් නිරූපණය කරයි.","s orbital ගෝලාකාර වන අතර p orbital දෙකැටි හැඩයක් දක්වයි.","එක් orbital එකක උපරිම electron දෙකක් පවතින අතර spin ප්‍රතිවිරුද්ධ වේ.","Subshell capacities: s = 2, p = 6, d = 10, f = 14."],f:"n, l, mₗ, mₛ"},
{t:"ඉලෙක්ට්‍රෝන වින්‍යාසය",b:["Electron පළමුව අඩු energy orbital පුරවයි (Aufbau principle).","එකම පරමාණුවක electron දෙකකට එකම quantum numbers හතරම තිබිය නොහැක (Pauli principle).","Degenerate orbital pairing කිරීමට පෙර singly occupy වේ (Hund rule).","Cr සහ Cu වැනි අවස්ථාවල සරල filling order එකට exceptions දක්නට ලැබේ."],f:"1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p",v:"config"},
{t:"ආවර්තිතා ප්‍රවණතා",b:["Period එකක් හරහා effective nuclear attraction සාමාන්‍යයෙන් වැඩි වේ.","Atomic radius සාමාන්‍යයෙන් period එකක් හරහා අඩු වන අතර group එකක් පහළට වැඩි වේ.","First ionization energy සාමාන්‍යයෙන් period එකක් හරහා වැඩි වේ; exceptions ඇත.","Electronegativity සාමාන්‍යයෙන් period එකක් හරහා වැඩි වන අතර group එකක් පහළට අඩු වේ."],f:"trend reasoning = nuclear charge + shielding + distance + electron configuration"}
],

{t:"அணு மாதிரிகள் மற்றும் துணைஅணுத் துகள்கள்",b:["Cathode-ray பரிசோதனைகள் எதிர்மின்னூட்டம் கொண்ட electron இருப்பை உறுதிப்படுத்தின.","Positive-ray அவதானிப்புகள் discharge tube இல் positive ions உருவாகலாம் என்பதை காட்டின.","Rutherford scattering மூலம் அணுவின் பெரும்பகுதி வெற்றிடம் என்றும் positive charge மிகச் சிறிய nucleus இல் திரண்டுள்ளது என்றும் அறியப்பட்டது.","Proton மற்றும் neutron nucleus இல்; electron nucleus க்கு வெளியே உள்ள பகுதிகளில் காணப்படுகின்றன."],f:"electron: e⁻   proton: p⁺   neutron: n⁰",v:"rutherford"},
{t:"அணு எண், நிறை எண் மற்றும் isotopes",b:["அணு எண் Z = proton எண்ணிக்கை.","நிறை எண் A = proton + neutron; ஆகவே N = A − Z.","Isotope களில் Z ஒரேதாகவும் neutron எண்ணிக்கை வேறுபட்டதாகவும் இருக்கும்.","Relative atomic mass என்பது isotopic mass மற்றும் natural abundance அடிப்படையிலான weighted mean."],f:"⁽ᴬ⁾₍Z₎X   •   N = A − Z   •   Aᵣ = Σ(isotopic mass × fractional abundance)"},
{t:"மின்காந்தக் கதிர்வீச்சு",b:["மின்காந்தக் கதிர்வீச்சை wavelength λ மற்றும் frequency ν மூலம் விவரிக்கலாம்.","Vacuum இல் அனைத்தும் c வேகத்தில் பயணிக்கின்றன.","Photon energy frequency உடன் அதிகரித்து wavelength உடன் குறைகிறது."],f:"c = νλ   •   E = hν = hc/λ"},
{t:"அணு நிறமாலை மற்றும் ஆற்றல் மட்டங்கள்",b:["Electron கள் quantized energy levels இல் உள்ளன.","மேலான level க்கு செல்ல துல்லியமான energy உறிஞ்சப்படுகிறது.","கீழ் level க்கு வரும் போது photon வெளியிடப்படுகிறது.","Hydrogen line spectrum quantized energy levels க்கு ஆதாரம்."],f:"ΔE = hν",v:"spectrum"},
{t:"Orbital மற்றும் quantum numbers",b:["Orbital என்பது electron இருப்பதற்கான அதிக probability உள்ள பகுதியை குறிக்கிறது.","s orbital கோள வடிவம்; p orbital இரு-lobe வடிவம்.","ஒரு orbital இல் அதிகபட்சம் இரண்டு electron கள் எதிர் spin உடன் இருக்கலாம்.","Subshell capacities: s = 2, p = 6, d = 10, f = 14."],f:"n, l, mₗ, mₛ"},
{t:"Electron configuration",b:["Electron கள் குறைந்த energy orbital களை முதலில் நிரப்புகின்றன (Aufbau principle).","ஒரே அணுவில் இரண்டு electron களுக்கு ஒரே நான்கு quantum numbers இருக்க முடியாது (Pauli principle).","Degenerate orbital கள் pairing க்கு முன் singly occupied ஆகும் (Hund rule).","Cr மற்றும் Cu இல் எளிய filling order க்கு exceptions உள்ளன."],f:"1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p",v:"config"},
{t:"தனிம வரிசைப் போக்குகள்",b:["ஒரு period முழுவதும் effective nuclear attraction பொதுவாக அதிகரிக்கிறது.","Atomic radius period முழுவதும் பொதுவாக குறைந்து group கீழே அதிகரிக்கிறது.","First ionization energy period முழுவதும் பொதுவாக அதிகரிக்கிறது; சில exceptions உள்ளன.","Electronegativity period முழுவதும் பொதுவாக அதிகரித்து group கீழே குறைகிறது."],f:"trend reasoning = nuclear charge + shielding + distance + electron configuration"}
