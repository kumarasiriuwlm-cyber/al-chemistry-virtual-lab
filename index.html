var unit5Notes={"si":[{"t":"තාපගතික පද්ධතිය, වටපිටාව සහ පද්ධති ගුණ","b":["තාපගතික පද්ධතිය යනු අධ්‍යයනය සඳහා විශ්වයෙන් වෙන් කර සලකන කොටසයි; එයට පිටතින් පවතින සියල්ල වටපිටාව ලෙසත් දෙක වෙන් කරන මායිම සීමාව ලෙසත් හඳුන්වයි.","විවෘත පද්ධතියකට පදාර්ථය සහ ශක්තිය දෙකම සීමාව හරහා හුවමාරු කළ හැක. සංවෘත පද්ධතියකට ශක්තිය හුවමාරු කළ හැකි නමුත් පදාර්ථය නොහැක. ඒකලිත පද්ධතියකට ශක්තිය හෝ පදාර්ථය කිසිවක් හුවමාරු කළ නොහැක.","සමජාතීය පද්ධතියක භෞතික අවස්ථාව සෑම තැනම එකසේ වන අතර විෂමජාතීය පද්ධතියක අදියර/කලාප වෙනස් වේ. Microscopic ගුණ අණුක මට්ටමට අදාළ අතර macroscopic ගුණ P, V, T, concentration, density වැනි bulk measurements වේ.","විත්ති (extensive) ගුණ පද්ධතියේ ද්‍රව්‍ය ප්‍රමාණය මත රඳා පවතී: mass, volume, amount, energy. ඝටනා (intensive) ගුණ ප්‍රමාණයෙන් ස්වාධීන වේ: temperature, density, pressure, refractive index, specific heat capacity."],"f":"system ↔ surroundings • open: matter+energy • closed: energy only • isolated: neither","exam":["Open/closed/isolated definitions වෙනස් කර නොගන්න.","Extensive vs intensive ගුණ හඳුනාගන්න.","Homogeneous/heterogeneous classification phase uniformity මතයි."]},{"t":"පද්ධති අවස්ථාව, සම්මත අවස්ථාව සහ ක්‍රියාවලි","b":["පද්ධතියේ අවස්ථාව P, V, T, composition වැනි මැක්‍රොස්කෝපික විචල්‍යවල විශේෂ අගයන් මගින් විස්තර කරයි. අවස්ථා ශ්‍රිත/විචල්‍ය ආරම්භක හා අවසාන අවස්ථා මත පමණක් රඳා පවතින අතර ගමන් කළ මාර්ගය මත නොරඳා පවතී.","Resource book එක සම්මත පීඩනය P° = 1 atm = 101325 Pa ලෙස භාවිත කරයි; temperature විශේෂයෙන් නියම නොකළත් tabulated thermodynamic data බොහෝවිට 298 K යටතේ ලබාදේ. ද්‍රාවණයක් සඳහා standard concentration ලෙස 1 mol dm⁻³ සලකයි.","ස්වයංසිද්ධ ක්‍රියාවලියක් බාහිර අඛණ්ඩ බලපෑමකින් තොරව නියමිත දිශාවකට යා හැක; non-spontaneous ක්‍රියාවලියට බාහිර driving input අවශ්‍ය වේ. Spontaneous යන්න වේගවත් යන්නට සමාන නොවේ.","ප්‍රතිවර්තී ක්‍රියාවලියක් ඉතා සුළු වෙනස්කම් මගින් පද්ධතිය සහ වටපිටාව දෙකම ආරම්භක තත්ත්වයට ආපසු ගෙන යා හැකි idealized process එකකි; අප්‍රතිවර්තී ක්‍රියාවලියක් එසේ සම්පූර්ණයෙන් ආපසු හැරවිය නොහැක."],"f":"standard pressure (book): P°=1 atm=101325 Pa • standard solution: 1 mol dm⁻³","exam":["Spontaneous ≠ fast.","State function path-independent බව මතක තබාගන්න.","Reversible process ideal limiting concept එකකි."]},{"t":"එන්තැල්පිය, තාපය සහ කැලරිමිතිය","b":["එන්තැල්පිය H පද්ධතියේ අවස්ථා ශ්‍රිතයක් සහ විත්ති ගුණයකි. Absolute H සෘජුව මැනීමට නොහැකි අතර ප්‍රායෝගිකව ΔH = H(products) − H(reactants) යන එන්තැල්පි වෙනස මනිනු ලබයි.","නියත පීඩනයේදී පද්ධතියට හෝ පද්ධතියෙන් සිදුවන තාප හුවමාරුව qₚ, enthalpy change සමඟ සම්බන්ධ වේ. Heat යනු උෂ්ණත්ව වෙනසක් නිසා පද්ධතිය සහ වටපිටාව අතර හුවමාරු වන ශක්තියයි.","Specific heat capacity c යනු ද්‍රව්‍ය 1 g ක උෂ්ණත්වය 1 °C (හෝ 1 K) කින් වෙනස් කිරීමට අවශ්‍ය heat ප්‍රමාණයයි. Heat capacity C = mc වන අතර sample එකක් සඳහා q = mcΔT භාවිත වේ.","Calorimetry මගින් physical/chemical process එකක heat change මනිනු ලබයි. Endothermic system heat ලබාගන්නා බැවින් q/ΔH positive; exothermic system heat පිට කරන බැවින් q/ΔH negative ලෙස sign convention යොදයි."],"f":"ΔH=Hₚ−Hᵣ • qₚ=ΔH (constant P) • C=mc • q=mcΔT","exam":["q sign system perspective එකෙන් බලන්න.","Specific heat capacity vs heat capacity වෙනස් කරන්න.","ΔT = Tfinal−Tinitial."]},{"t":"තාපදායක/තාපාවශෝෂක ක්‍රියාවලි සහ තාප-රසායනික සමීකරණ","b":["තාපාවශෝෂක (endothermic) ක්‍රියාවලියක පද්ධතිය වටපිටාවෙන් heat ලබාගන්නා අතර ΔH > 0 වේ; products enthalpy reactants වලට වඩා ඉහළය. තාපදායක (exothermic) ක්‍රියාවලියක heat පිටවන අතර ΔH < 0 වේ.","Enthalpy diagram එකක vertical axis enthalpy නිරූපණය කර products සහ reactants අතර vertical difference එක ΔH ලෙස දක්වයි. Exothermic diagram එක පහළ products ද, endothermic diagram එක ඉහළ products ද පෙන්වයි.","Thermochemical equation එකක් balanced chemical equation, physical states සහ අදාල ΔH (හෝ ΔH°) අගය එකට දක්වයි. Physical state වෙනස් වීමෙන් enthalpy value වෙනස් විය හැකි බැවින් (s),(l),(g),(aq) සඳහන් කිරීම අත්‍යවශ්‍යය.","Reaction එක reverse කළ විට ΔH හි sign එක වෙනස් වේ. Equation එක k factor එකකින් ගුණ කළ විට ΔH magnitude ද k factor එකෙන් ගුණ කළ යුතුය; stoichiometric extent සමඟ enthalpy change සමානුපාතික වේ."],"f":"endothermic: ΔH>0 • exothermic: ΔH<0 • reverse reaction → −ΔH • scale equation by k → kΔH","exam":["Physical states thermochemical equation එකේ අනිවාර්යය.","Reverse/scale rules නිවැරදිව යොදන්න.","ΔH sign energy diagram එකෙන් අර්ථකථනය කරන්න."]},{"t":"සම්මත එන්තැල්පි විපර්යාස වර්ග","b":["සම්මත උත්පාදන එන්තැල්පිය ΔH°f යනු standard states හි constituent elements වලින් substance මෝලයක් සෑදීමේ enthalpy change එකයි. Element එකේ වඩාත් ස්ථායී standard form එක සඳහා ΔH°f = 0 ලෙස ගනී.","සම්මත දහන එන්තැල්පිය ΔH°c යනු substance මෝලයක් excess oxygen තුළ සම්පූර්ණයෙන් දහනය කිරීමේ enthalpy change එකයි. Bond dissociation enthalpy ΔH°D gaseous bond එකක් බිඳීමට සම්බන්ධ වන අතර සාමාන්‍යයෙන් positive වේ.","Neutralization ΔH°neu, solvation ΔH°sol, hydration ΔH°hyd සහ dissolution enthalpy solution processes විස්තර කරයි. Resource book එක H⁺(aq)+OH⁻(aq)→H₂O(l) සඳහා ΔH°neu ≈ −57 kJ mol⁻¹ යන උදාහරණය භාවිත කරයි.","Sublimation, vaporization, fusion, atomization, first ionization, electron gain සහ lattice dissociation enthalpy වැනි standard enthalpy changes ද thermochemical cycles වල භාවිත වේ. Lattice dissociation enthalpy solid ionic compound එක gaseous ions වලට වෙන් කිරීමට අදාල බැවින් positive වේ."],"f":"ΔH°f(element, standard form)=0 • ΔH°neu≈−57 kJ mol⁻¹ (book example) • lattice dissociation ΔH°L>0","exam":["Formation reaction එක product මෝල 1කට ලියන්න.","Standard form of element සඳහා ΔH°f=0.","Lattice dissociation vs lattice formation sign conventions ගැලපී නොයන්න."]},{"t":"Hess නීතිය සහ සම්මත ප්‍රතික්‍රියා එන්තැල්පිය","b":["Hess නීතිය අනුව ක්‍රියාවලියක් පියවර කිහිපයකින් සිදු වූවත් සමස්ත enthalpy change එක එම පියවරවල enthalpy changes එකතුවට සමාන වේ. මෙය enthalpy state function එකක් වීමේ ප්‍රතිඵලයකි.","Unknown ΔH ලබාගැනීමට දන්නා thermochemical equations reverse, multiply සහ add කර target equation එක සාදයි. Equation reverse කළ විට sign reverse වන අතර coefficient scaling සමඟ ΔH ද scale කළ යුතුය.","Standard reaction enthalpy formation data වලින් ΔH°rxn = ΣνₚΔH°f(products) − ΣνᵣΔH°f(reactants) ලෙස ගණනය කළ හැක. ν values balanced equation stoichiometric coefficients වේ.","Direct method සහ cyclic/Hess diagram method දෙකම එකම state-function principle එක භාවිත කරයි. මාර්ගය වෙනස් වූවත් initial සහ final states එකම නම් ΔH එකම වේ."],"f":"Hess: ΔHoverall=ΣΔHsteps • ΔH°rxn=ΣνₚΔH°f(products)−ΣνᵣΔH°f(reactants)","exam":["Target equation සෑදීමට equations algebra ලෙස හසුරුවන්න.","Element standard-state ΔH°f terms =0.","Stoichiometric coefficients formation enthalpies ට ගුණ කරන්න."]},{"t":"දැලිස් එන්තැල්පිය සහ Born–Haber චක්‍රය","b":["Ionic solid එකක lattice dissociation enthalpy යනු solid ionic compound මෝලයක් gaseous cations සහ anions බවට සම්පූර්ණයෙන් වෙන් කිරීමට අවශ්‍ය standard enthalpy change එකයි. Dissociation definition අනුව අගය positive වේ.","Lattice dissociation enthalpy විශාල වන තරමට ionic lattice එක වෙන් කිරීමට වැඩි ශක්තියක් අවශ්‍ය වන අතර lattice electrostatic stabilization ප්‍රබල බව පෙන්වයි.","Born–Haber cycle එක Hess නීතිය මත පදනම්ව ionic compound formation එක sublimation/atomization, ionization, electron gain සහ lattice formation/dissociation වැනි gas-phase steps වලට බෙදා සලකයි.","Resource book එක LiF සඳහා cycle එක පෙන්වා unknown lattice term එක standard formation enthalpy සහ අනෙක් steps වලින් ලබාගනී. ප්‍රශ්න විසඳීමේදී cycle direction සහ lattice sign convention මුලින් තීරණය කිරීම වැදගත්ය."],"f":"ΔH°rxn=Σcycle steps • lattice dissociation: solid → gaseous ions, ΔH°L>0","exam":["Born–Haber = Hess law application.","Ionization enthalpy positive; electron-gain step sign data අනුව භාවිත කරන්න.","Lattice formation/dissociation direction අනුව sign වෙනස් වේ."]},{"t":"එන්ට්‍රොපිය, Gibbs ශක්තිය සහ ස්වයංසිද්ධතාව","b":["Entropy S පද්ධතියේ අක්‍රමවත් බව/energy dispersal සම්බන්ධ අවස්ථා ශ්‍රිතයකි. සාමාන්‍යයෙන් gas > liquid > solid entropy යන රටාවක් ඇති අතර temperature වැඩිවීමෙන් entropy වැඩි වේ.","Standard reaction entropy ΔS°rxn = ΣνₚS°(products) − ΣνᵣS°(reactants). Gas moles වැඩි වීම සාමාන්‍යයෙන් positive entropy change එකකට සහ gas moles අඩුවීම negative change එකකට ඉඟියක් දෙයි.","Spontaneity සඳහා ΔH පමණක් ප්‍රමාණවත් නොවේ. ΔH<0, ΔS>0 නම් සියලු T වල spontaneous; ΔH>0, ΔS<0 නම් සියලු T වල non-spontaneous; අනෙක් sign combinations වල temperature තීරණාත්මක වේ.","Gibbs free-energy change ΔG = ΔH − TΔS. Standard conditions යටතේ ΔG°rxn < 0 නම් forward reaction spontaneous, ΔG°rxn = 0 නම් equilibrium, ΔG°rxn > 0 නම් forward direction non-spontaneous ලෙස thermodynamic criterion එක ලබාදේ."],"f":"ΔS°rxn=ΣνₚS°ₚ−ΣνᵣS°ᵣ • ΔG=ΔH−TΔS • ΔG<0 spontaneous • ΔG=0 equilibrium","exam":["ΔS units J K⁻¹ mol⁻¹ → TΔS සමඟ kJ units ගැළපීමට conversion කරන්න.","Spontaneous does not mean fast.","ΔH/ΔS sign combination අනුව temperature effect තීරණය කරන්න."]}],"en":[{"t":"Thermodynamic System, Surroundings and Properties","b":["A system is the part selected for study; everything else is the surroundings and the separating surface is the boundary.","Open systems exchange matter and energy; closed systems exchange energy but not matter; isolated systems exchange neither.","Homogeneous systems have uniform phase; heterogeneous systems contain distinct phases. Microscopic and macroscopic descriptions operate at different scales.","Extensive properties depend on amount, whereas intensive properties do not."],"f":"open: matter+energy • closed: energy only • isolated: neither","exam":["Classify system types.","Distinguish extensive and intensive properties.","Recognize homogeneous vs heterogeneous systems."]},{"t":"State, Standard State and Processes","b":["A thermodynamic state is specified by macroscopic variables such as P,V,T and composition; state functions depend only on initial and final states.","The resource book uses P°=1 atm=101325 Pa and 1 mol dm⁻³ for a standard solution; thermodynamic tables are commonly quoted at 298 K.","A spontaneous process can proceed without continuous external driving, but spontaneity does not imply rapidity.","Reversible processes are ideal limiting paths that can restore system and surroundings; irreversible processes cannot do so completely."],"f":"P°=1 atm=101325 Pa (book) • standard solution 1 mol dm⁻³","exam":["Spontaneous is not the same as fast.","State functions are path-independent.","Understand reversible vs irreversible."]},{"t":"Enthalpy, Heat and Calorimetry","b":["Enthalpy H is an extensive state function; experimentally we work with ΔH=Hproducts−Hreactants.","At constant pressure, heat exchange qₚ is associated with enthalpy change.","Specific heat capacity c and heat capacity C are related by C=mc; q=mcΔT.","Calorimetry measures heat changes; endothermic changes have positive q/ΔH and exothermic changes negative q/ΔH for the system."],"f":"ΔH=Hₚ−Hᵣ • qₚ=ΔH • C=mc • q=mcΔT","exam":["Use the system sign convention.","Distinguish c and C.","Use ΔT=Tfinal−Tinitial."]},{"t":"Exothermic/Endothermic Processes and Thermochemical Equations","b":["Endothermic processes absorb heat and have ΔH>0; exothermic processes release heat and have ΔH<0.","Enthalpy diagrams show the relative energy levels of reactants and products.","Thermochemical equations include balanced stoichiometry, physical states and ΔH or ΔH°.","Reversing a reaction changes the sign of ΔH; multiplying the equation scales ΔH by the same factor."],"f":"endo ΔH>0 • exo ΔH<0 • reverse → −ΔH • scale k → kΔH","exam":["Include physical states.","Apply reverse/scale rules.","Interpret enthalpy diagrams."]},{"t":"Types of Standard Enthalpy Change","b":["Standard enthalpy of formation ΔH°f forms one mole from elements in their standard states; the most stable standard form of an element has ΔH°f=0.","Standard combustion and bond-dissociation enthalpies describe complete burning and gaseous bond breaking.","Neutralization, solvation, hydration and dissolution enthalpies describe solution processes; the book uses about −57 kJ mol⁻¹ for H⁺+OH⁻→H₂O.","Sublimation, vaporization, fusion, atomization, ionization, electron gain and lattice dissociation enthalpies are also used."],"f":"ΔH°f(element,std)=0 • ΔH°neu≈−57 kJ mol⁻¹ • lattice dissociation >0","exam":["Write formation reactions per one mole product.","Use sign conventions carefully.","Know the definitions of common standard enthalpies."]},{"t":"Hess's Law and Standard Reaction Enthalpy","b":["Hess's law states that total enthalpy change equals the sum of step enthalpies, independent of path.","Known equations can be reversed, multiplied and added to create a target equation.","Formation enthalpies give ΔH°rxn=ΣνₚΔH°f(products)−ΣνᵣΔH°f(reactants).","Direct and cyclic methods express the same state-function principle."],"f":"ΔHoverall=ΣΔHsteps • ΔH°rxn=ΣνₚΔH°f,p−ΣνᵣΔH°f,r","exam":["Treat equations algebraically.","Multiply by stoichiometric coefficients.","Standard-state elemental terms are zero."]},{"t":"Lattice Enthalpy and Born-Haber Cycle","b":["Lattice dissociation enthalpy separates one mole of ionic solid into gaseous ions and is positive under this definition.","A larger dissociation enthalpy indicates a more strongly bound ionic lattice.","Born-Haber cycles combine sublimation/atomization, ionization, electron gain and lattice steps using Hess's law.","The book illustrates the method with LiF and emphasizes consistent cycle direction/sign convention."],"f":"solid ionic compound → gaseous ions: ΔH°L>0 • Born-Haber = Hess cycle","exam":["Know lattice sign convention.","Identify each cycle step.","Born-Haber is an application of Hess's law."]},{"t":"Entropy, Gibbs Energy and Spontaneity","b":["Entropy S is a state function associated with disorder/energy dispersal; gases generally have higher entropy than liquids, which exceed solids, and entropy rises with temperature.","ΔS°rxn=ΣνₚS°products−ΣνᵣS°reactants.","Both ΔH and ΔS determine temperature-dependent spontaneity.","ΔG=ΔH−TΔS; ΔG<0 spontaneous, ΔG=0 equilibrium, ΔG>0 non-spontaneous in the forward direction."],"f":"ΔS°rxn=ΣνₚS°ₚ−ΣνᵣS°ᵣ • ΔG=ΔH−TΔS","exam":["Convert entropy units when combining with ΔH.","Spontaneity is not kinetics.","Use ΔH/ΔS signs to predict temperature dependence."]}],"ta":[{"t":"Thermodynamic system, surroundings மற்றும் properties","b":["Study செய்யத் தேர்ந்தெடுக்கப்பட்ட பகுதி system; வெளிப்புறம் surroundings; பிரிக்கும் பகுதி boundary.","Open system matter+energy exchange; closed energy only; isolated neither.","Homogeneous system ஒரே phase; heterogeneous பல phases.","Extensive properties amount மீது சாரும்; intensive properties amount இற்கு சாராது."],"f":"open: matter+energy • closed: energy only • isolated: neither","exam":["System type classify செய்யவும்.","Extensive/intensive வேறுபாடு அறியவும்.","Homogeneous/heterogeneous அறியவும்."]},{"t":"State, standard state மற்றும் processes","b":["P,V,T,composition போன்ற variables மூலம் state வரையறுக்கப்படுகிறது; state functions path-independent.","Book standard pressure P°=1 atm=101325 Pa; standard solution 1 mol dm⁻³; tables பொதுவாக 298 K.","Spontaneous process continuous external driving இல்லாமல் செல்லலாம்; அது fast என்று பொருள் அல்ல.","Reversible என்பது ideal limiting path; irreversible process முழுமையாக reverse செய்ய முடியாது."],"f":"P°=1 atm=101325 Pa • standard solution 1 mol dm⁻³","exam":["Spontaneous ≠ fast.","State function path-independent.","Reversible/irreversible அறியவும்."]},{"t":"Enthalpy, heat மற்றும் calorimetry","b":["H ஒரு extensive state function; ΔH=Hproducts−Hreactants.","Constant pressure இல் qₚ மற்றும் ΔH தொடர்புடையவை.","C=mc மற்றும் q=mcΔT.","Endothermic q/ΔH positive; exothermic negative (system convention)."],"f":"ΔH=Hₚ−Hᵣ • qₚ=ΔH • q=mcΔT","exam":["Sign convention கவனிக்கவும்.","c மற்றும் C வேறுபாடு.","ΔT சரியாக கணக்கிடவும்."]},{"t":"Exothermic/endothermic மற்றும் thermochemical equations","b":["Endothermic ΔH>0; exothermic ΔH<0.","Enthalpy diagrams reactants/products energy levels காட்டுகின்றன.","Thermochemical equation இல் balanced equation, physical states, ΔH தேவை.","Reaction reverse செய்தால் sign மாறும்; coefficients scale செய்தால் ΔH scale ஆகும்."],"f":"endo ΔH>0 • exo ΔH<0 • reverse → −ΔH","exam":["Physical states குறிப்பிடவும்.","Reverse/scale rules.","Diagram interpret செய்யவும்."]},{"t":"Standard enthalpy changes","b":["ΔH°f: standard elements இலிருந்து one mole compound; element stable standard form க்கு 0.","Combustion மற்றும் bond dissociation enthalpies முக்கியம்.","Neutralization, solvation, hydration, dissolution solution processes ஐ விவரிக்கின்றன.","Sublimation, vaporization, fusion, atomization, ionization, electron gain, lattice dissociation ஆகியனவும் உள்ளன."],"f":"ΔH°f(element,std)=0 • lattice dissociation >0","exam":["Formation one mole product.","Definitions அறியவும்.","Signs கவனிக்கவும்."]},{"t":"Hess law மற்றும் reaction enthalpy","b":["Overall ΔH = sum of step ΔH values and is path-independent.","Equations reverse/multiply/add செய்து target equation பெறலாம்.","ΔH°rxn=ΣνₚΔH°f(products)−ΣνᵣΔH°f(reactants).","Direct மற்றும் cycle methods ஒரே state-function principle."],"f":"ΔHoverall=ΣΔHsteps • ΔH°rxn=ΣνₚΔH°f,p−ΣνᵣΔH°f,r","exam":["Equations algebra போல கையாளவும்.","Stoichiometric coefficients பயன்படுத்தவும்.","Element standard ΔH°f=0."]},{"t":"Lattice enthalpy மற்றும் Born-Haber cycle","b":["Lattice dissociation: ionic solid one mole → gaseous ions; positive.","Larger value means stronger lattice binding.","Born-Haber cycle uses Hess law with sublimation/atomization, ionization, electron gain and lattice steps.","Cycle direction/sign convention consistent ஆக இருக்க வேண்டும்."],"f":"solid → gaseous ions: ΔH°L>0","exam":["Lattice sign convention.","Cycle steps.","Born-Haber=Hess application."]},{"t":"Entropy, Gibbs energy மற்றும் spontaneity","b":["Entropy S disorder/energy dispersal state function; gas>liquid>solid பொதுவாக; T அதிகரிக்க S அதிகரிக்கும்.","ΔS°rxn=ΣνₚS°p−ΣνᵣS°r.","ΔH மற்றும் ΔS இரண்டும் spontaneity ஐ தீர்மானிக்கின்றன.","ΔG=ΔH−TΔS; ΔG<0 spontaneous, =0 equilibrium, >0 non-spontaneous forward."],"f":"ΔS°rxn=ΣνₚS°ₚ−ΣνᵣS°ᵣ • ΔG=ΔH−TΔS","exam":["Entropy units convert செய்யவும்.","Spontaneous ≠ fast.","Temperature dependence signs மூலம் அறியவும்."]}]};

 [["පරමාණුක අරය","Li සිට Cs දක්වා පිටත කවච සංඛ්‍යාව වැඩි වන බැවින් බාහිර ඉලෙක්ට්‍රෝනය න්‍යෂ්ටියට අඩුවෙන් බැඳී ඇත. ඒ නිසා පළමු අයනීකරණ ශක්තිය අඩුවී ලෝහක ප්‍රතික්‍රියාශීලීතාව වැඩි වේ."],["ඔක්සිජන් ඵල","Li₂O හි ඔක්සයිඩ O²⁻, Na₂O₂ හි පෙරොක්සයිඩ O₂²⁻, KO₂ හි සුපර්ඔක්සයිඩ O₂⁻ වෙන්කර හඳුනාගන්න. අදාළ ඔක්සිජන් ඔක්සිකරණ අංක −2, −1, −½ වේ."],["තාප වියෝජනය","LiNO₃ හා අනෙක් 1 කාණ්ඩ නයිට්‍රේට එකම ඵල නොදෙයි. නයිට්‍රේට සමීකරණ ලියන විට NO₂ නිපදවෙන්නේ LiNO₃ සඳහා බව හඳුනාගන්න."]],
 [["ද්විකැටායන ගුණ","ns² ලෝහ ඉලෙක්ට්‍රෝන දෙකක් ඉවත් කර M²⁺ සාදයි. BeO හා Be(OH)₂ උභයගුණී වුවද CaO, BaO වැනි ඔක්සයිඩ භාෂ්මිකය."],["සල්ෆේට් හා හයිඩ්‍රොක්සයිඩ","MgSO₄ සිට BaSO₄ දක්වා සල්ෆේට ද්‍රාව්‍යතාව අඩු වේ; Mg(OH)₂ සිට Ba(OH)₂ දක්වා භෂ්ම ද්‍රාව්‍යතාව සාමාන්‍යයෙන් වැඩි වේ. මේ ප්‍රවණතා එකට පටලවා නොගන්න."],["නයිට්‍රේට් උණු කිරීම","2M(NO₃)₂ → 2MO + 4NO₂ + O₂ යන සමතුලිත ආකාරය මතක තබාගන්න. කාබනේට MO + CO₂ වෙයි."]],
 [["Al₂O₃ ආරක්ෂාව","ඇලුමිනියම් ඉතා ප්‍රතික්‍රියාශීලී ලෝහයක් වුවද මතුපිට අල්ප ඝනත්ව ආරක්ෂක Al₂O₃ ස්තරය නිසා බොහෝ තත්ත්වවලදී විඛාදනයෙන් ආරක්ෂා වේ."],["OH⁻ එකතු කිරීමේ අනුපිළිවෙළ","අල්ප OH⁻ දී Al(OH)₃ සුදු ජෙලටිනීය අවක්ෂේපය; අතිරික්ත OH⁻ දී එය [Al(OH)₄]⁻ ලෙස දියවේ. උභයගුණී භාවයේ සෘජු පරීක්ෂාවකි."],["AlCl₃ හා ලුවිස් අම්ල","AlCl₃ හි Al වටා ඉලෙක්ට්‍රෝන අටක් සම්පූර්ණ නොවීම නිසා Cl මධ්‍යස්ථ පාලක සම්බන්ධතා ඇති Al₂Cl₆ ද්විඅණුව සෑදිය හැක."]],
 [["දියමන්ති හා මිනිරන්","දියමන්තිවල සෑම C එකක්ම C හතරකට sp³ ලෙස බැඳී ඇත. මිනිරන්වල sp² ස්තර තුළ σ බන්ධන තුනක් හා විස්ථානගත π ඉලෙක්ට්‍රෝන ඇත."],["CO අවදානම","CO අවර්ණ හා ගන්ධ රහිත මාරාන්තික වායුවකි; එය hemoglobin සමඟ ප්‍රබලව බැඳී ඔක්සිජන් ප්‍රවාහනය බාධා කරයි. සිසුන් විසින් නිපදවීමට උත්සාහ නොකරන්න."],["කාබොනික් සමතුලිතය","CO₂(aq) හා H₂CO₃ අතර සමතුලිතය පවතී. CO₂ අතිරික්ත විට කාබනේට HCO₃⁻ බවට පරිවර්තනය විය හැක."]],
 [["N₂ අක්‍රියත්වය","N≡N බන්ධනය බිඳීමට ඉහළ ශක්තියක් අවශ්‍යය. එබැවින් සාමාන්‍ය තත්ත්ව යටතේ N₂ බොහෝ ප්‍රතික්‍රියාවලට සහභාගී නොවෙයි."],["HNO₃ ඔක්සිකාරක බව","සාන්ද්‍ර HNO₃ සමඟ Cu → NO₂ (රතු-දුඹුරු) වන අතර තනුක HNO₃ සමඟ ප්‍රධාන වශයෙන් NO (අවර්ණ) නිපදවෙයි; NO වාතයේ O₂ සමඟ NO₂ බවට පත්වේ."],["NH₄⁺ හඳුනාගැනීම","ඇමෝනියම් ලවණය NaOH සමඟ උණු කිරීමෙන් NH₃ නිපදවෙයි. NH₃ තෙත් රතු ලිට්මස් නිල් කර HCl වාෂ්ප සමඟ සුදු NH₄Cl දුමක් ලබා දෙයි."]],
 [["ජලය හා සල්ෆර් හයිඩ්‍රයිඩ","H₂O හි ප්‍රබල හයිඩ්‍රජන් බන්ධන නිසා අනෙක් 16 කාණ්ඩ හයිඩ්‍රයිඩවලට වඩා අසාමාන්‍ය ඉහළ තාපාංකයක් ඇත."],["H₂O₂ ද්විත්ව භූමිකාව","H₂O₂ තුළ O අංකය −1 බැවින් O₂ බවට ඔක්සිකරණයද H₂O බවට ඔක්සිහරණයද විය හැක. අර්ධ ප්‍රතික්‍රියා මගින් ඔක්සිකාරක/ඔක්සිහාරක භූමිකා තීරණය කරන්න."],["සල්ෆර් ඔක්සෝ අම්ල","H₂SO₃ දුබල අම්ලයක්; H₂SO₄ ප්‍රබල ද්විප්‍රෝටික අම්ලයකි. උණු සාන්ද්‍ර H₂SO₄ ඔක්සිකාරක හා විජලකාරක ලෙස ද ක්‍රියා කරයි."]],
 [["විස්ථාපනය","Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂ හි Cl₂ ඔක්සිකාරකයයි; Br⁻ ඔක්සිහාරකයයි. F₂ සිට I₂ දක්වා සාමාන්‍ය ඔක්සිකාරක බලය අඩුවෙයි."],["AgX වර්ණ තුන","AgCl සුදු → තනුක NH₃ දියවේ; AgBr ලා කහ → සාන්ද්‍ර NH₃ දියවේ; AgI කහ → NH₃ ද්‍රාවණවල දිය නොවේ. සමාන ලෙස අවක්ෂේප හඳුනාගන්න."],["ක්ලෝරීන් විෂමයෝජනය","Cl₂ + H₂O ⇌ HCl + HOCl සහ Cl₂ + 2NaOH (ශීත) → NaCl + NaOCl + H₂O හි Cl එකවර −1 සහ +1 බවට යයි."]],
 [["සම්පූර්ණ බාහිර කවච","He සතුව 1s² වන අතර අනෙකුත් 18 කාණ්ඩ සාමාජිකයන්හි ns²np⁶ වේ. ඒවා සාමාන්‍යයෙන් ඒකපරමාණුක, අඩු ප්‍රතික්‍රියාශීලී වායු වේ."],["සීනෝන් විශේෂත්වය","Xe හි අයනීකරණ ශක්තිය He හා Ne වලට වඩා අඩු නිසා F හා O සමඟ සීමිත ප්‍රමාණයක සංයෝග සාදයි. XeF₂ රේඛීය, XeF₄ චතුරස්‍ර තලීය."],["Xe ඔක්සිකරණ අංක","XeF₂: +2, XeF₄: +4, XeF₆: +6, XeO₃: +6 සහ XeO₄: +8 වෙන්කර ගන්න."]],
 [["ආවර්තය හරහා","Na → Ar ලෙස යන විට ඵලදායී න්‍යෂ්ටික ආරෝපණය වැඩි වන බැවින් සාමාන්‍ය ලෝහක ස්වභාවය අඩුවේ."],["ඔක්සයිඩ රටාව","Na₂O, MgO භාෂ්මික → Al₂O₃ උභයගුණී → SiO₂ දුබල ආම්ලික → P₄O₁₀, SO₃, Cl₂O₇ ආම්ලික. මෙය විභාගයේ ප්‍රධාන සසඳුමකි."],["ක්ලෝරයිඩ ජලවිච්ඡේදනය","NaCl වැනි අයනික ලවණ ජලය සමඟ විශේෂ වියෝජනයක් නොකරන නමුත් SiCl₄ සහ PCl₅ ජලය සමඟ HCl අඩංගු ආම්ලික ඵල සාදයි."]],

renderer.domElement.addEventListener("pointerdown",function(e){renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2)lastPinch=pdist()});
