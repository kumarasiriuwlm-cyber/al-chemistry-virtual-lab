ta:{brand:"A/L இரசாயனவியல்",nav:["முகப்பு","பாடங்கள்","Virtual Lab","பயிற்சி"],title:"P01 • Cathode Rays இன் பண்புகள்",sub:"இந்தப் பக்கம் P01 செய்முறைக்கு மட்டும் உரியது. ஒவ்வொரு படியாக முன்னேறுங்கள்.",steps:["அறிமுகம்","உபகரணங்கள்","செய்முறை","பரிசோதனை","அவதானிப்புகள்","முடிவு","வினாக்கள்"],introH:"அறிமுகம்",introP:"குறைந்த அழுத்த வாயுக் குழாயில் உயர் மின்னழுத்த வேறுபாடு வழங்கும்போது cathode இலிருந்து வெளிவரும் electron கற்றையின் பண்புகளை ஆராய்வோம்.",aimH:"நோக்கம்",aimP:"Cathode Rays இன் நேர்கோட்டு இயக்கம், ஆற்றல் பரிமாற்றம் மற்றும் electric/magnetic field களில் விலகலை அவதானித்தல்.",learnH:"முக்கிய கருத்துகள்",appH:"தேவையான உபகரணங்கள்",safeH:"பாதுகாப்பு",safeP:"உண்மையான உயர் மின்னழுத்த உபகரணத்தை ஆசிரியர் மேற்பார்வையில் மட்டுமே பயன்படுத்தவும். மாற்றங்களுக்கு முன் மின்சாரத்தை அணைக்கவும்.",procH:"படிமுறை",expH:"Interactive Experiment",expP:"நான்கு காட்சிகளில் ஒன்றைத் தேர்ந்தெடுத்து கட்டுப்பாடுகளை மாற்றி அவதானிக்கவும்.",obsH:"அவதானிப்புகள்",noteH:"எனது குறிப்புகள்",conH:"முடிவுகள்",qH:"அறிவைச் சரிபார்க்கவும்",mark:"பதில்களைச் சரிபார்க்கவும்",prev:"← முந்தையது",next:"அடுத்து →",powerOn:"மின்சாரத்தை இயக்கவும்",powerOff:"மின்சாரத்தை அணைக்கவும்",crossIn:"குறுக்கை உள்ளிடவும்",crossOut:"குறுக்கை அகற்றவும்",modes:["நிழல்","Paddle wheel","Electric field","Magnetic field"],apparatus:["குறைந்த அழுத்த discharge tube / Crookes tube","Cathode மற்றும் anode","Fluorescent screen","Metal cross / paddle wheel","Electric மற்றும் magnetic field உபகரணங்கள்","High-voltage supply"],procedure:["அமைப்பைச் சரிபார்த்து மின்சாரம் அணைக்கப்பட்டுள்ளதை உறுதிசெய்யவும்.","மின்சாரத்தை இயக்கி fluorescent screen ஐ அவதானிக்கவும்.","Metal cross மூலம் உருவாகும் நிழலை அவதானிக்கவும்.","Paddle wheel இயக்கத்தை அவதானிக்கவும்.","Electric field ஐ மாற்றி கற்றையின் விலகலை ஒப்பிடவும்.","Magnetic field திசையை மாற்றி விலகலை ஒப்பிடவும்.","அவதானிப்புகளைப் பதிவு செய்து முடிவுகளை எழுதவும்."],obs:["Metal cross தெளிவான நிழலை உருவாக்குகிறது.","Paddle wheel இயக்கம் கற்றையிலிருந்து ஆற்றல் பரிமாற்றத்தை காட்டுகிறது.","Electric field இல் கற்றை positive plate நோக்கி விலகுகிறது.","Magnetic field திசை மாறும்போது விலகல் திசையும் மாறுகிறது."],con:["Cathode Rays நேர்கோட்டில் செல்கின்றன.","Cathode Rays ஆற்றலை எடுத்துச் செல்கின்றன.","Cathode Rays எதிர்மின்னூட்டம் கொண்ட துகள்களால் ஆனவை.","Cathode Rays magnetic field மூலம் விலக்கப்படுகின்றன."],qs:[["Cathode Rays எந்தத் துகள்களால் ஆனவை?",["Protons","Electrons","Neutrons"],1],["Electric field இல் Cathode Rays எந்த plate நோக்கி விலகும்?",["Positive","Negative","Neither"],0],["Metal cross நிழல் எதை நிரூபிக்கிறது?",["நேர்கோட்டு இயக்கம்","நிறை இல்லை","Positive charge"],0]]},
