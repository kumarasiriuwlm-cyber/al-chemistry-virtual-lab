</span><h2>${r.title}</h2><p>${r.summary}</p><div class="learnFlow"><span>① ඉගෙන ගනිමු</span><span>② දෘශ්‍යමාන කරමු</span><span>③ අත්හදා බලමු</span><span>④ පුහුණු වෙමු</span><span>⑤ තහවුරු කරමු</span></div></section><div class="resourceGrid"><section class="resourceCard"><h3>මූලික කරුණු</h3><ul class="keylist">${r.points.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="resourceCard"><h3>ප්‍රධාන පද</h3><p>${r.terms}</p><div class="examtip"><b>විභාගයට:</b> ${r.exam}</div></section></div>`}
function stage(title){return `<div class="stage"><div class="stageTop"><span>${title}</span><strong><i class="statusDot" id="dot"></i><span id="stateLabel">3D අන්තර්ක්‍රියාකාරී දර්ශනය</span></strong></div><div class="canvaswrap"><canvas id="scene" tabindex="0" aria-label="ත්‍රිමාණ ආකෘතිය. හරවන්න ඇදගෙන යන්න හෝ යතුරුපුවරුවේ ඊතල භාවිත කරන්න. විශාල කිරීමට එකතු ලකුණ භාවිත කරන්න."></canvas><div class="stageHint">ඇදගෙන හරවන්න · + / − විශාලනය · ඊතල යතුරු</div></div><div class="viewtools"><button id="viewFront">ඉදිරිපස</button><button id="view3d">3D දසුන</button><button id="zoomIn" aria-label="විශාල කරන්න">＋</button><button id="zoomOut" aria-label="කුඩා කරන්න">−</button><button id="pause">${paused?'සජීවීකරණය අරඹන්න':'සජීවීකරණය නවතන්න'}</button><button id="resetView">දසුන යළි සකසන්න</button></div></div>`}
function bindStage(){if(!$('scene'))return;let c=$('scene');$('viewFront').onclick=()=>{angleX=0;angleY=0};$('view3d').onclick=()=>{angleX=-.2;angleY=-.48};$('zoomIn').onclick=()=>zoom=Math.min(1.7,zoom+.12);$('zoomOut').onclick=()=>zoom=Math.max(.6,zoom-.12);$('resetView').onclick=()=>{angleX=-.13;angleY=-.35;zoom=1};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'සජීවීකරණය අරඹන්න':'සජීවීකරණය නවතන්න'};c.onpointerdown=e=>{drag=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag){angleY+=(e.clientX-drag[0])*.007;angleX=Math.max(-1.3,Math.min(1.3,angleX+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY]}};c.onpointerup=c.onpointercancel=()=>drag=null;c.onwheel=e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.7,zoom-e.deltaY*.001))};c.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','='].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')angleY-=.1;if(e.key==='ArrowRight')angleY+=.1;if(e.key==='ArrowUp')angleX-=.1;if(e.key==='ArrowDown')angleX+=.1;if(e.key==='+'||e.key==='=')zoom=Math.min(1.7,zoom+.1);if(e.key==='-')zoom=Math.max(.6,zoom-.1)}}}
const modes={shadow:{title:'සෘජු රේඛීය ගමන සහ සෙවණැල්ල',short:'I · සෙවණැල්ල',aim:'අවහිරකයක් මඟින් කැතෝඩ කිරණවල සෘජු රේඛීය ගමන නිරීක්ෂණය කරන්න.',steps:['කුරුසය ඉවත් කර විදුලිය සක්‍රිය කරන්න. තිරයේ දීප්තිය බලන්න.','විදුලිය අක්‍රිය කර ලෝහ කුරුසය ඇතුළත් කරන්න.','නැවත විදුලිය සක්‍රිය කර තිරයේ සෙවණැල්ල සසඳන්න.','කුරුසය සහිත හා රහිත නිරීක්ෂණ දෙකම සටහන් කරන්න.'],tasks:[['plain','කුරුසය රහිතව දීප්තිය නිරීක්ෂණය කළා'],['cross','කුරුසය සහිතව සෙවණැල්ල නිරීක්ෂණය කළා'],['record','නිරීක්ෂණයක් සටහන් කළා']]},wheel:{title:'පැඩල් රෝදයේ චලනය',short:'II · පැඩල් රෝදය',aim:'කිරණ මඟින් රෝදයට ශක්තිය මාරුවන ආකාරය සසඳන්න.',steps:['විදුලිය සක්‍රිය කර රෝදය භ්‍රමණය හා ඉදිරියට ගමන් කිරීම බලන්න.','විදුලිය අක්‍රිය කරන්න.','ධ්‍රැවීයතාව මාරු කර නැවත සක්‍රිය කරන්න.','රෝදයේ ගමන් දිශාව හා කිරණ දිශාව සසඳන්න.'],tasks:[['forward','මුල් දිශාවේ චලනය නිරීක්ෂණය කළා'],['reverse','ප්‍රතිවිරුද්ධ දිශාව නිරීක්ෂණය කළා'],['record','නිරීක්ෂණයක් සටහන් කළා']]},electric:{title:'විද්‍යුත් ක්ෂේත්‍රයක අපගමනය',short:'III · විද්‍යුත් ක්ෂේත්‍රය',aim:'ඉලෙක්ට්‍රෝනවල ඍණ ආරෝපණය සහ විද්‍යුත් බලයේ දිශාව සම්බන්ධ කරන්න.',steps:['ක්ෂේත්‍ර අගය 0 කර විදුලිය සක්‍රිය කරන්න.','ධන අගයක් තෝරා ඉහළ තහඩුව ධන කරන්න.','ඍණ අගයක් තෝරා ඉහළ තහඩුව ඍණ කරන්න.','අපගමනය වන දිශාව තහඩු ආරෝපණ සමඟ සසඳන්න.'],tasks:[['zero','ක්ෂේත්‍ර රහිත ගමන බැලුවා'],['positive','ඉහළ තහඩුව ධන කළා'],['negative','ඉහළ තහඩුව ඍණ කළා'],['record','නිරීක්ෂණයක් සටහන් කළා']]},magnetic:{title:'චුම්බක ක්ෂේත්‍රයක අපගමනය',short:'IV · චුම්බක ක්ෂේත්‍රය',aim:'චුම්බක ක්ෂේත්‍රයේ දිශාව ආපසු හැරවූ විට කිරණවල අපගමනය සසඳන්න.',steps:['ක්ෂේත්‍ර අගය 0 කර විදුලිය සක්‍රිය කරන්න.','ධන අගයක් තෝරා B ක්ෂේත්‍රය තිරයෙන් පිටතට යොමු කරන්න.','ඍණ අගයක් තෝරා B ක්ෂේත්‍රය තිරය තුළට යොමු කරන්න.','ඉදිරිපස දසුනෙන් අපගමන දෙක සසඳන්න.'],tasks:[['zero','ක්ෂේත්‍ර රහිත ගමන බැලුවා'],['positive','B පිටතට යොමු කළා'],['negative','B ඇතුළට යොමු කළා'],['record','නිරීක්ෂණයක් සටහන් කළා']]}};
function observation(){if(!power)return 'විදුලිය අක්‍රියයි. තිරයේ ප්‍රතිදීප්තිය නොපෙනේ.';if(mode==='shadow')return settings.cross?'තිරයේ කොළ දීප්තිය මත කුරුස හැඩැති අඳුරු සෙවණැල්ලක් පෙනේ. අවහිර වූ කිරණ තිරයට නොපැමිණේ.':'කුරුසය රහිත නිසා තිරය කොළ පැහැයෙන් දිලිසේ. කිරණ සෘජු මාර්ගයකින් තිරයට පැමිණේ.';if(mode==='wheel')return 'රෝදය භ්‍රමණය වෙමින් '+(settings.reverse?'වමට':'දකුණට')+' ගමන් කරයි; අන්තයට පැමිණි පසු එහි නවතී. මෙය ශක්ති හුවමාරුව දක්වන සරල කළ ආකෘතියකි.';if(!settings.field)return 'ක්ෂේත්‍රය ශූන්‍යයි. කිරණ මාර්ගය සෘජුයි.';return mode==='electric'?'ඉලෙක්ට්‍රෝන '+(settings.field>0?'ඉහළ':'පහළ')+' ධන තහඩුව දෙසට අපගමනය වේ. F = qE; ඉලෙක්ට්‍රෝනය සඳහා q ඍණයි.':'B ක්ෂේත්‍රය '+(settings.field>0?'තිරයෙන් පිටතට':'තිරය තුළට')+' යොමු වී ඇත. ඉදිරිපස දසුනෙන් කිරණ '+(settings.field>0?'ඉහළට':'පහළට')+' අපගමනය වේ. F = q(v × B).'}
function markTasks(){if(!power)return;let k=mode==='shadow'?(settings.cross?'cross':'plain'):mode==='wheel'?(settings.reverse?'reverse':'forward'):settings.field===0?'zero':settings.field>0?'positive':'negative';taskFlags[mode+'-'+k]=true;save();updateTasks()}
function updateTasks(){if(!$('tasks'))return;let a=modes[mode].tasks,n=a.filter(([k])=>taskFlags[mode+'-'+k]).length;$('tasks').innerHTML=a.map(([k,s])=>`<div class="task ${taskFlags[mode+'-'+k]?'done':''}"><span>${taskFlags[mode+'-'+k]?'✓':'○'}</span><span>${s}</span></div>`).join('');$('progress').style.width=n/a.length*100+'%';$('taskCount').textContent=`${n} / ${a.length}`}
function lab(){let m=modes[mode];main.innerHTML=heading('කැතෝඩ කිරණ පරීක්ෂණාගාරය','පාලන වෙනස් කරන්න. නිරීක්ෂණය කරන්න. නිගමනයකට එළඹෙන්න.','නිල ප්‍රායෝගිකය 01')+richLearningResource('lab')+`<div class="tabs" role="group" aria-label="කැතෝඩ කිරණ පරීක්ෂණ">${Object.entries(modes).map(([k,v])=>`<button data-mode="${k}" class="${k===mode?'active':''}" aria-pressed="${k===mode}">${v.short}</button>`).join('')}</div><div class="workgrid"><div>${stage('CROOKES TUBE / '+m.short)}<div class="observe"><span class="icon">◎</span><div><h3>සජීවී නිරීක්ෂණය</h3><p id="observation" aria-live="polite">${observation()}</p></div></div><div class="note">කොළ තිත් යනු අදෘශ්‍ය ඉලෙක්ට්‍රෝන මාර්ගය පැහැදිලි කරන දෘශ්‍ය සලකුණුයි. සැබෑ කොළ දීප්තිය ප්‍රතිදීප්ත ආලේපනයෙන් ලැබේ. ප්‍රමාණ, වේග සහ අපගමන කෝණ පරිමාණයට නොවේ.</div><div class="chips" id="parts"><button data-part="cathode">කැතෝඩය (−)</button><button data-part="anode">ඇනෝඩය (+)</button><button data-part="screen">ප්‍රතිදීප්ත තිරය</button><button data-part="supply">ප්‍රේරණ දඟරය / සැපයුම</button><button data-part="tube">අඩු පීඩන නළය</button></div><p class="small muted" id="partInfo">උපකරණ කොටසක් තෝරා එහි කාර්යය බලන්න.</p></div><div class="card controls"><h3>පරීක්ෂණ පාලන</h3><div class="wide"><button id="power" class="primary" style="width:100%">⏻ විදුලිය සක්‍රිය කරන්න</button></div><div><label for="voltage">ත්වරණ විභවය <b id="vlabel">${settings.voltage} kV</b></label><input id="voltage" type="range" min="2" max="10" step="1" value="${settings.voltage}"><p class="small muted">ප්‍රේරණ දඟරයේ අධි වෝල්ටීයතා ප්‍රතිදානය. 6 V යනු අත්පොතේ සඳහන් ප්‍රාථමික සැපයුමයි.</p></div>${mode==='shadow'?`<div><label>නළය තුළ ඇති අවහිරකය</label><button id="cross" style="width:100%">${settings.cross?'කුරුසය ඉවත් කරන්න':'කුරුසය ඇතුළත් කරන්න'}</button></div>`:mode==='wheel'?`<div><label>ඉලෙක්ට්‍රෝඩ ධ්‍රැවීයතාව</label><button id="reverse" style="width:100%">ධ්‍රැවීයතාව මාරු කරන්න</button><p id="direction" class="small muted">${settings.reverse?'දකුණ → වම':'වම → දකුණ'}</p></di ණය / නිගමනය</label><textarea id="labNote" placeholder="ඔබ දුටු වෙනස සහ එයට හේතුව ලියන්න…">${esc(notes[mode]||'')}</textarea><p class="small muted">මෙම බ්‍රවුසරයේ පමණක් සුරැකේ. නිරීක්ෂණ පොතෙන් ගොනුවක් බාගත කළ හැකියි.</p></section></div><section class="card"><h2>පරීක්ෂණයට පෙර සහ පසු සිතන්න</h2>${[['උපපරමාණුක අංශු තුන කුමක්ද?','ඉලෙක්ට්‍රෝනය (−1), ප්‍රෝටෝනය (+1), නියුට්‍රෝනය (0).'],['ඉලෙක්ට්‍රෝනයේ e/m අනුපාතය සම්බන්ධ විද්‍යාඥයා කවුද?','J. J. Thomson. ඉලෙක්ට්‍රෝනයේ ආරෝපණයේ විශාලත්වය / ස්කන්ධය ≈ 1.76 × 10¹¹ C kg⁻¹.'],['කැතෝඩ කිරණ කොළ පාට ද?','නැත. ඉලෙක්ට්‍රෝන කදම්බය අදෘශ්‍යයි. එය තිරයේ ප්‍රතිදීප්ත ද්‍රව්‍යයට වැදීමෙන් දෘශ්‍ය ආලෝකය විමෝචනය වේ.'],['අඩු පීඩනය සහ ඉහළ විභව වෙනස අවශ්‍ය ඇයි?','අඩු පීඩනයේදී වායු අංශු සමඟ ගැටීම් අඩු වේ. ඉහළ විභව වෙනස මඟින් ආරෝපිත අංශු ත්වරණය වී විමෝචනය හා ප්‍රතිදීප්තිය ඇති කිරීමට ශක්තිය ලැබේ.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</section>`;

function select(id,items,value){return `<select id="${id}">${items.map(x=>{let [v,s]=Array.isArray(x)?x:[x,x];return `<option value="${v}" ${String(v)===String(value)?'selected':''}>${s}</option>`}).join('')}</select>`}
function ranger(id,label,min,max,val,step=1){return `<div><label for="${id}">${label} <b id="${id}Value">${val}</b></label><input type="range" id="${id}" min="${min}" max="${max}" value="${val}" step="${step}"></div>`}
function bindRange(id,key,fn){$(id).oninput=e=>{settings[key]=+e.target.value;$(id+'Value').textContent=e.target.value;fn?.()}}
function rutherford(){main.innerHTML=heading('රන් පත්‍රය හරහා පරමාණුව දකිමු','ඇල්ෆා අංශුවේ ආසන්න ගමන් දුර වෙනස් කර විසිරීම සසඳන්න.')+richLearningResource('rutherford')+`<div class="workgrid"><div>${stage('RUTHERFORD / විසිරීමේ ආකෘතිය')}<div class="note">මෙය තනි න්‍යෂ්ටියක් අසල සම්භාව්‍ය විසිරීමේ ආකෘතියකි. පරිමාණ විශාල කර ඇත. කෝණය Coulomb සම්බන්ධතාවෙන් ගණනය කෙරේ. කුඩා න්‍යෂ්ටි ආකෘතියේ මාර්ගය Coulomb විකර්ෂණය සංඛ්‍යාත්මකව අනුකරණය කරයි; න්‍යෂ්ටි ප්‍රමාණය විශාල කර ඇත. ස්කන්ධය වැඩි නිශ්චල න්‍යෂ්ටියක් උපකල්පනය කරයි.</div><div class="card"><h3>නිරීක්ෂණය → නිගමනය</h3><p id="rObs"></p><div class="three"><div><span class="metric" id="scatterAngle"></span><small>විසිරීම් කෝණය</small></div><div><span class="metric" id="shotCount">0</span><small>අනුකරණ අංශු</small></div><div><span class="metric" id="backCount">0</span><small>θ &gt; 90°</small></div></div></div></div><section class="card controls"><h3>අංශු කදම්බය</h3><div><label for="rModel">පරමාණු ආකෘතිය</label>${select('rModel',[['nuclear','කුඩා ධන න්‍යෂ්ටිය'],['diffuse','විහිදුණු ධන ආරෝපණය']],settings.model)}</div>${ranger('impact','ආසන්න ගමන් දුර b (×10⁻¹³ m)',0,6,settings.impact,.1)}${ranger('energy','ඇල්ෆා අංශු ශක්තිය (MeV)',2,10,settings.energy,.5)}<div><label for="nucleus">න්‍යෂ්ටිය</label>${select('nucleus',[[79,'Au • Z = 79'],[47,'Ag • Z = 47'],[13,'Al • Z = 13']],settings.nucleus)}</div><div class="row wide"><button id="fire" class="primary">අංශුවක් යවන්න</button><button id="batch">100 යවන්න</button></div><button id="clearShots" class="wide">ගණන් යළි සකසන්න</button><div class="note wide">බොහෝ අංශු සුළු අපගමනයකින් යයි; ඉතා ළඟින් යන අංශු විශාල කෝණයකින් විසිරේ. මෙහි 100 අංශු නියැදිය සැබෑ රන් පත්‍රයේ ප්‍රතිශත අනාවැකියක් නොවේ.</div></section></div><section class="card"><h2>මෙයින් හෙළි වූ දේ</h2><div class="two"><p>බොහෝ α අංශු ගමන් කිරීමෙන් පරමාණුවේ වැඩි කොටස හිස් අවකාශයක් බව පෙනේ. ඉතා සුළු ප්‍රමාණයක් විශාල කෝණයකින් හැරීමෙන් ධන ආරෝපණය හා ස්කන්ධයේ වැඩි කොටස ඉතා කුඩා ප්‍රදේශයක සංකේන්ද්‍රණය වී ඇති බව හෙළි වේ.</p><div><div class="formula">tan(θ/2) = k Z z e² / (2 E b)</div><p class="small muted">α අංශුව සඳහා z = 2. b = 0 වන සෘජු ප්‍රවේශයක θ = 180°. විහිදුණු ආරෝපණ ආකෘතියේ රේඛාව ගුණාත්මක සංසන්දනයක් පමණි.</p></div></div></section>`;bindRange('impact','impact',rUpdate);bindRange('energy','energy',rUpdate);$('nucleus').onchange=e=>{settings.nucleus=+e.target.value;rUpdate()};$('rModel').onchange=e=>{settings.model=e.target.value;rUpdate()};$('fire').onclick=()=>{paused=false;shot={time:t,theta:scatterAngle(),b:settings.impact};countShot(shot.theta);rUpdate();beep(600)};$('batch').onclick=()=>{for(let i=0;i<100;i++){const b=6*Math.sqrt(Math.random());countShot(scatterAngle(b))}shot={time:t,theta:scatterAngle(),b:settings.impact};paused=false;rUpdate();beep(720)};$('clearShots').onclick=()=>{scatterN=0;scatterBins=[0,0,0];shot=null;rUpdate()};rUpdate()}
function scatterAngle(b=settings.impact){if(settings.model==='diffuse')return 5*Math.exp(-b/2);if(b===0)return 180;return 2*Math.atan(1.439964*settings.nucleus/(settings.energy*b*100))*180/Math.PI}
function countShot(a){scatterN++;scatterBins[a>90?2:a>10?1:0]++}
function rUpdate(){const a=scatterAngle();$('scatterAngle').textContent=a.toFixed(1)+'°';$('shotCount').textContent=scatterN;$('backCount').textContent=scatterBins[2];$('rObs').textContent=settings.model==='diffuse'?'විහිදුණු ධන ආරෝපණ ආකෘතියේ සුළු හැරීම් පමණක් පෙන්වයි. ප්‍රබල ආපසු විසිරීම පැහැදිලි කිරීමට මෙය ප්‍රමාණවත් නොවේ.':a>90?'ඉතා ආසන්න ප්‍රවේශය නිසා ප්‍රබල විකර්ෂණයක් ඇති වී අංශුව ආපසු විසිරේ.':a>10?'න්‍යෂ්ටියට ආසන්නව යන α අංශුව ධන–ධන විකර්ෂණය නිසා හැරේ.':'න්‍යෂ්ටියෙන් දුරින් යන අංශුවේ අපගමනය කුඩාය.'}
function canal(){main.innerHTML=heading('ධන කිරණ හා කැතෝඩ කිරණ','ආරෝපණයේ ලකුණ සහ වායුව වෙනස් වීමේ බලපෑම සසඳන්න.')+richLearningResource('canal')+`<div class="workgrid"><div>${stage('CANAL RAYS / සිදුරු සහිත කැතෝඩය')}<div class="note">කොළ: ඉලෙක්ට්‍රෝන → ඇනෝඩය. කහ: ධන අයන → කැතෝඩයේ සිදුරු හරහා. වර්ණ මාර්ග හඳුනාගැනීමට පමණි.</div></div><div class="card controls"><h3>වායු අයන</h3><div><label for="gas">නළයේ වායුව / නිරූපිත අයනය</label>${select('gas',[['H','H₂ → H⁺ (සරල කළ)'],['He','He → He⁺'],['Ne','Ne → Ne⁺']],settings.gas)}</div><div class="wide" id="canalResult"></div><div class="note wide">ධන කිරණ අයනවල m සහ q වායුව මත රඳා පවතී. සැබෑ වායු විසර්ජනයේ අයන විශේෂ කිහිපයක් තිබිය හැකියි. මෙහි එක් අයන විශේෂයක් බැගින් නිරූපණය කර ඇත.</div></div></div><section class="card"><h2>ප්‍රධාන වෙනස්කම්</h2><div class="scroll"><table><tr><th>ගුණය</th><th>කැතෝඩ කිරණ</th><th>ධන කිරණ</th></tr><tr><td>අංශු</td><td>ඉලෙක්ට්‍රෝන</td><td>ධන වායු අයන</td></tr><tr><td>ආරෝපණය</td><td>ඍණ</td><td>ධන</td></tr><tr><td>විද්‍යුත් ක්ෂේත්‍රයකදී</td><td>ධන තහඩුව දෙසට</td><td>ඍණ තහඩුව දෙසට</td></tr><tr><td>e/m හෝ q/m</td><td>වායුව වෙනස් කළත් එකම අගය</td><td>අයන විශේෂය මත වෙනස් වේ</td></tr></table></div></section>`;$('gas').onchange=e=>{settings.gas=e.target.value;canalUpdate()};canalUpdate()}
function canalUpdate(){let m={H:1.0073,He:4.0021,Ne:20.179}[settings.gas];$('canalResult').innerHTML=`<div class="readout"><span>අයනය</span><b>${settings.gas}⁺</b></div><div class="readout"><span>ස්කන්ධය ≈</span><b>${m} u</b></div><div class="readout"><span>q/m ≈</span><b>${(9.6485e7/m).toExponential(2)} C kg⁻¹</b></div>`}

function atomUpdate(){settings.charge=Math.min(settings.charge,settings.z);$('charge').value=settings.charge;$('chargeValue').textContent=settings.charge;const e=settings.z-settings.charge,A=settings.z+settings.n,sg=settings.charge===0?'':Math.abs(settings.charge)+(settings.charge>0?'+':'−');$('atomResult').innerHTML=`<div class="two"><div><span class="metric"><sup>${A}</sup><sub>${settings.z}</sub>${elements[settings.z]}<sup>${sg}</sup></span>${names[settings.z]}</div><div><b>Z = ${settings.z} · A = ${A}</b><p>p⁺ = ${settings.z} · n⁰ = ${settings.n} · e⁻ = ${e}</p></div></div><p class="small muted">A = p + n; q = p − e. ${settings.charge===0?'උදාසීන පරමාණුවකි.':settings.charge>0?'ධන අයනයකි.':'ඍණ අයනයකි.'}</p>`}
function isoUpdate(){let p=settings.isopct/100,v=34.96885*p+36.96590*(1-p);$('isotopeResult').innerHTML=`<div class="formula">Aᵣ = ${v.toFixed(4)}</div><p class="small">³⁷Cl = ${(100-settings.isopct).toFixed(2)}%. Aᵣ ඒකක රහිතයි; සාමාන්‍ය පරමාණුක ස්කන්ධය ≈ ${v.toFixed(4)} u.</p>`}
function orbital(){main.innerHTML=heading('කාක්ෂික ත්‍රිමාණයෙන්','කාක්ෂිකය හරවා එහි හැඩය, දිශානතිය සහ නෝඩීය තල නිරීක්ෂණය කරන්න.')+richLearningResource('orbital')+`<div class="workgrid"><div>${stage('ORBITALS / හැඩ සහ දිශානතිය')}<div class="note">මේවා කාක්ෂිකවල සංකේතාත්මක සීමා පෘෂ්ඨයි. නිශ්චිත ඉලෙක්ට්‍රෝන පථ නොවේ. වර්ණ දෙක තරංග ශ්‍රිතයේ ප්‍රතිවිරුද්ධ අදියර දක්වයි; ධන/ඍණ විද්‍යුත් ආරෝපණ නොවේ.</div><div class="card" id="orbDesc"></div></div><div class="card controls"><h3>කාක්ෂිකය තෝරන්න</h3><div><label for="orb">හැඩය</label>${select('orb',[['s','1s • ගෝලාකාර'],['px','2pₓ'],['py','2pᵧ'],['pz','2p_z'],['dxy','3dₓᵧ'],['dxz','3dₓz'],['dyz','3dᵧz'],['dx2','3dₓ²₋ᵧ²'],['dz2','3d_z²']],settings.orb)}</div><div class="note wide">p කාක්ෂික තුන එකිනෙකට ලම්බකයි. d කාක්ෂික පහ අතර d_z² හැඩය අනෙක් හතරෙන් වෙනස් වේ. රේඩියල් නෝඩ් සහ සැබෑ ඝනත්ව ව්‍යාප්තිය මෙහි නිරූපණය නොවේ.</div></div></div><section class="card controls"><h2 class="wide">අවසර ලත් ක්වොන්ටම් අංක</h2><div class="two wide"><div><label for="qn">ප්‍රධාන ක්වොන්ටම් අංකය n</label>${select('qn',[1,2,3,4],settings.qn)}<label for="ql">උපකවච ක්වොන්ටම් අංකය l</label><select id="ql"></select></div><div><label for="qm">චුම්බක ක්වොන්ටම් අංකය mₗ</label><select id="qm"></select><label for="qs">භ්‍රමණ ක්වොන්ටම් අංකය mₛ</label>${select('qs',[[.5,'+½'],[-.5,'−½']],settings.qs)}</div></div><div id="quantum" class="wide"></div><p class="small wide">n = 1, 2, …; l = 0 සිට n−1; mₗ = −l සිට +l; mₛ = ±½. එක් කාක්ෂිකයක ඉලෙක්ට්‍රෝන උපරිම දෙකකි.</p></section>`;$('orb').onchange=e=>{settings.orb=e.target.value;orbUpdate()};$('qn').onchange=e=>{settings.qn=+e.target.value;settings.ql=Math.min(settings.ql,settings.qn-1);quantumUpdate()};$('ql').onchange=e=>{settings.ql=+e.target.value;quantumUpdate()};$('qm').onchange=e=>{settings.qm=+e.target.value;quantumResult()};$('qs').onchange=e=>{settings.qs=+e.target.value;quantumResult()};orbUpdate();quantumUpdate()}
function orbUpdate(){let o=settings.orb,l=o==='s'?0:o[0]==='p'?1:2;$('orbDesc').innerHTML=`<h3>${o==='s'?'s කාක්ෂිකය':o[0]==='p'?'p කාක්ෂිකය':'d කාක්ෂිකය'}</h3><p>${l===0?'ගෝලාකාර හැඩය; කෝණික නෝඩීය තල නැත.':l===1?'පෙති දෙකකි. න්‍යෂ්ටිය හරහා යන එක් නෝඩීය තලයක් ඇත.':'කෝණික නෝඩ් දෙකක් ඇත. d_z² හි පෙති දෙකක් සහ වළලු ආකාර කොටසක් පෙනේ.'}</p><p class="small muted">මෙම හැඩය සඳහා l = ${l}; උපකවචයේ කාක්ෂික ${2*l+1}; උපරිම ඉලෙක්ට්‍රෝන ${2*(2*l+1)}.</p>`}
function quantumUpdate(){let n=settings.qn,l=settings.ql;settings.qm=Math.max(-l,Math.min(l,settings.qm));$('ql').innerHTML=Array.from({length:n},(_,i)=>`<option value="${i}" ${i===l?'selected':''}>${i} • ${'spdf'[i]}</option>`).join('');$('qm').innerHTML=Array.from({length:2*l+1},(_,i)=>`<option value="${i-l}" ${i-l===settings.qm?'selected':''}>${i-l}</option>`).join('');quantumResult()}
function quantumResult(){$('quantum').innerHTML=`<div class="formula">(n, l, mₗ, mₛ) = (${settings.qn}, ${settings.ql}, ${settings.qm}, ${settings.qs>0?'+½':'−½'})</div><p class="small">මෙය අවසර ලත් සංයෝජනයකි. ${settings.qn}${'spdf'[settings.ql]} උපකවචයේ කාක්ෂික ${2*settings.ql+1} ක් ඇත; n = ${settings.qn} කවචයේ උපරිම ඉලෙක්ට්‍රෝන ${2*settings.qn**2} ක් ඇත.</p>`}
function wavelengthColor(w){if(w<380||w>780)return '#a6b6c6';let r=0,g=0,b=0;if(w<440){r=-(w-440)/60;b=1}else if(w<490){g=(w-440)/50;b=1}else if(w<510){g=1;b=-(w-510)/20}else if(w<580){r=(w-510)/70;g=1}else if(w<645){r=1;g=-(w-645)/65}else r=1;return `rgb(${[r,g,b].map(v=>Math.round(v*255)).join(',')})`}
function transitionData(){let ni=settings.ni,nf=settings.nf;const delta=13.6*Math.abs(1/nf**2-1/ni**2),nm=1239.841984/delta;return {delta,nm,emission:ni>nf,region:nm<380?'පාරජම්බුල':nm>780?'අධෝරක්ත':'දෘශ්‍ය'}}

lab:{title:'කැතෝඩ කිරණ සහ Thomson සාක්ෂි',brief:'Crookes/Thomson discharge tubes මගින් ඉලෙක්ට්‍රෝනය පිළිබඳ මුල් පරීක්ෂණාත්මක සාක්ෂි ලැබුණි.',full:`<p>අඩු පීඩනයක වායුවක් ඇති discharge tube එකක කැතෝඩය හා ඇනෝඩය අතර විශාල විභව වෙනසක් යෙදූ විට කැතෝඩයෙන් පිටවන අංශු කදම්බයක් ඇති වේ. එය සෘජු රේඛීයව ගමන් කරයි, ප්‍රතිදීප්ත ද්‍රව්‍යවල දීප්තිය ඇති කරයි, විද්‍යුත් හා චුම්බක ක්ෂේත්‍රවලදී හැරේ.</p><p>විද්‍යුත් ක්ෂේත්‍රයකදී කදම්බය ධන තහඩුව දෙසට හැරීමෙන් එහි අංශු ඍණ ආරෝපිත බව පැහැදිලි වේ. කැතෝඩ ද්‍රව්‍යය හෝ නළයේ වායුව වෙනස් කළද e/m අගය එකසේ ලැබීමෙන් මෙම අංශු සියලු පරමාණුවල පොදු අංගයක් බවට සාක්ෂි ලැබුණි.</p><p><b>වැදගත්:</b> ප්‍රතිදීප්ත තිරයේ කොළ පැහැය ඉලෙක්ට්‍රෝනයේ වර්ණයක් නොවේ. තිර ද්‍රව්‍යය ශක්තිය ලබා ආලෝකය විමෝචනය කිරීම නිසා එය පෙනේ.</p>`,formula:'e/m අනුපාතය Thomson පරීක්ෂණයේ මූලික මිනුමකි; මෙම යෙදුමේ අගය මැනීම වෙනුවට ගුණාත්මක අපගමනය පෙන්වයි.',mistakes:['කැතෝඩ කිරණ “කොළ ආලෝකය” ලෙස හඳුන්වීම.','පැඩල් රෝදය පමණක් electron mass සඳහා අවසාන සාක්ෂියක් ලෙස ඉදිරිපත් කිරීම.','විද්‍යුත් හා චුම්බක අපගමන දිශා ආරෝපණ ලකුණ නොසලකා ලිවීම.'],source:'NIE Unit 1.1.1 + Practical Handbook Experiment 1'},
rutherford:{title:'Thomson සිට Rutherford න්‍යෂ්ටික ආකෘතියට',brief:'α අංශු විසිරීමෙන් ධන ආරෝපණය සහ පරමාණුක ස්කන්ධයේ වැඩි කොටස කුඩා න්‍යෂ්ටියක සංකේන්ද්‍රණය වී ඇති බව පෙන්වයි.',full:`<p>Thomson ආකෘතියේ ධන ආරෝපණය පරමාණුව පුරා විසිරී ඇති බව සලකා ඇත. Rutherford පරීක්ෂණයේදී ඉතා සිහින් රන් පත්‍රයකට α අංශු යොමු කළේ මෙම ධන ආරෝපණ බෙදාහැරීම පරීක්ෂා කිරීමටය.</p><p>බොහෝ α අංශු සෘජුව ගමන් කළ නිසා පරමාණුවේ වැඩි පරිමාව හිස් අවකාශය බව තේරුම් ගත හැක. සුළු ප්‍රමාණයක් විශාල කෝණවලින් හැරීම හා ඉතා සුළු ප්‍රමාණයක් ආපසු විසිරීම, ධන ආරෝපණය සහ ස්කන්ධයේ වැඩි කොටස ඉතා කුඩා ප්‍රදේශයක සංකේන්ද්‍රණය වී ඇති බව පෙන්වයි.</p>`,formula:'α අංශුව (+2) සහ ධන න්‍යෂ්ටිය අතර Coulomb විකර්ෂණය නිසා trajectory වෙනස් වේ.',mistakes:['“සියලු α අංශු විශාල කෝණයකින් හැරුණා” යැයි ලිවීම.','නිරීක්ෂණය හා නිගමනය එක වාක්‍යයක අවුල් කිරීම.'],source:'NIE Unit 1.1.4'},
canal:{title:'ධන කිරණ / positive rays',brief:'වායු අණු අයනීකරණයෙන් ඇති ධන අයන විද්‍යුත් ක්ෂේත්‍රයෙන් ත්වරණය වීමෙන් ධන කිරණ දක්නට ලැබේ.',full:`<p>Discharge tube එකේ වේගවත් ඉලෙක්ට්‍රෝන වායු අණු සමඟ ගැටීමෙන් ධන අයන සෑදිය හැක. මේ අයන ඍණ කැතෝඩය දෙසට ගමන් කරයි. සිදුරු සහිත කැතෝඩයක් භාවිත කළ විට එම අයන එය පසුකර විරුද්ධ දිශාවේ දීප්තියක් ඇති කළ හැක.</p><p>කැතෝඩ කිරණවලින් වෙනස්ව positive-ray අංශුවේ ස්කන්ධය භාවිත වායුව මත රඳා පවතී. එබැවින් q/m අගයත් වායුව අනුව වෙනස් වේ.</p>`,formula:'කැතෝඩ කිරණ: electron beam; ධන කිරණ: gas-derived positive ions.',mistakes:['Positive rays = protons පමණක් යැයි සැමවිටම සැලකීම.','ඒවායේ q/m අගය සියලු වායු සඳහා එකම බව සැලකීම.'],source:'NIE Unit 1.1.3'},
atom:{title:'Z, A, න්‍යුක්ලයිඩ, සමස්ථානික හා සාපේක්ෂ පරමාණුක ස්කන්ධය',brief:'පරමාණුවේ හඳුනාගැනීම Z මතද, න්‍යුක්ලයිඩ විස්තරය Z හා A මතද රඳා පවතී.',full:`<p><b>පරමාණුක ක්‍රමාංකය Z</b> = න්‍යෂ්ටියේ ප්‍රෝටෝන ගණන. <b>ස්කන්ධ ක්‍රමාංකය A</b> = ප්‍රෝටෝන + නියුට්‍රෝන. ඒ අනුව n = A − Z.</p><p>එකම Z ඇති නමුත් වෙනස් නියුට්‍රෝන ගණනක් සහ A අගයක් ඇති පරමාණු <b>සමස්ථානික</b> වේ. සාපේක්ෂ පරමාණුක ස්කන්ධය isotopic masses සහ ඒවායේ abundance භාවිත බරිත සාමාන්‍යයකි.</p><p>උදාසීන පරමාණුවක e = Z. +q කැටායනයක e = Z − q; −q ඇනායනයක e = Z + q.</p>`,formula:'A = Z + N;  Aᵣ = Σ(isotopic mass × fractional abundance)',mistakes:['Mass number A සහ relative atomic mass Aᵣ එකම දෙයක් ලෙස සැලකීම.','අයනයක charge sign හේතුවෙන් e ගණන වැරදීම.'],source:'NIE Unit 1.1.5–1.1.8'},
spectrum:{title:'විද්‍යුත්චුම්බක විකිරණ, ෆෝටෝන සහ හයිඩ්‍රජන් වර්ණාවලිය',brief:'λ, ν සහ E සම්බන්ධතා හා quantized energy levels Unit 01 හි මූලික ගණනය කිරීම් වේ.',full:`<p>විද්‍යුත්චුම්බක තරංග vacuum තුළ c වේගයෙන් ගමන් කරයි. තරංග ආයාමය λ වැඩි වන විට සංඛ්‍යාතය ν අඩු වේ. එක් ෆෝටෝනයක ශක්තිය E = hν බැවින් ඉහළ සංඛ්‍යාතයට වැඩි ශක්තියක් ඇත.</p><p>Planck විසින් ශක්තිය අඛණ්ඩව නොව නිශ්චිත ප්‍රමාණවලින් හුවමාරු වන බව යෝජනා කළේය. Bohr ආකෘතියේ hydrogen electron එකට අවසර ලත් energy levels පමණක් ඇත. ඉහළ මට්ටමකින් පහළ මට්ටමකට යාමේදී ΔE ට සමාන ෆෝටෝනයක් නිකුත් වේ; විරුද්ධ සංක්‍රමණයට එම නිශ්චිත ශක්තිය අවශෝෂණය විය යුතුය.</p><p>හයිඩ්‍රජන් line spectrum එක අඛණ්ඩ වර්ණාවලියක් නොව discrete lines දක්වන නිසා energy levels quantized බවට සාක්ෂියකි.</p>`,formula:'c = νλ; E = hν = hc/λ; λ(de Broglie) = h/mv; Eₙ(H) = −13.6/n² eV',mistakes:['nm → m conversion නොකර c = νλ භාවිත කිරීම.','emission සඳහා ΔE ලකුණ සහ photon energy magnitude එක අවුල් කිරීම.'],source:'NIE Unit 1.2–1.3.1'},
orbital:{title:'කාක්ෂික, උපකවච සහ ක්වොන්ටම් අංක',brief:'Quantum numbers electron state එක විස්තර කරන අතර orbital එක classical orbit එකක් නොවේ.',full:`<p>n principal quantum number එක shell/energy level එක සම්බන්ධ තොරතුරු සපයයි. l උපකවචය තීරණය කරයි: l = 0,1,2,3 → s,p,d,f. mₗ orbital orientation එකට අදාළ වන අතර −l සිට +l දක්වා පූර්ණ සංඛ්‍යා අගයන් ගනී. mₛ = +½ හෝ −½.</p><p>එක් subshell එකක orbitals ගණන = 2l + 1. එක් orbital එකක උපරිම electrons 2 බැවින් subshell capacity = 2(2l+1). Shell එකක උපරිම electrons = 2n².</p><p>නිල syllabus එක orbital shape සඳහා s සහ p හැඩ අවශ්‍ය කරයි. මෙම යෙදුමේ d දර්ශන අමතර දෘශ්‍යකරණයක් ලෙස සපයයි.</p>`,formula:'l = 0 … n−1; mₗ = −l … +l; mₛ = ±½; orbitals/subshell = 2l+1; e⁻/shell max = 2n²',mistakes:['Orbital = electron path ලෙස ලිවීම.','n = 2 සඳහා l = 2 දීම.','mₗ අගයන් ගණන 2l+1 නොසලකා හැරීම.'],source:'NIE Unit 1.3.2–1.4'},
config:{title:'Aufbau, Pauli, Hund සහ electron configuration',brief:'Ground-state configuration ලිවීමේදී energy order, occupancy constraints සහ accepted exceptions සැලකිල්ලට ගනී.',full:`<p>Aufbau අනුව අඩු ශක්ති කාක්ෂික පළමුව පිරේ. Pauli අනුව atom එකක electrons දෙකකට quantum numbers හතරම එකම විය නොහැකි අතර එක් orbital එකක electrons දෙකක් තිබේ නම් spin ප්‍රතිවිරුද්ධය. Hund අනුව degenerate orbitals යුගල වීමට පෙර සමාන්තර spin සමඟ එක බැගින් පිරේ.</p><p>ඉලෙක්ට්‍රෝන ඉවත් කර cation සෑදීමේදී මුලින්ම ඉහළම principal quantum number n සහිත occupied orbital වලින් ඉවත් කරයි. 3d transition ions සඳහා 4s electrons 3d electrons ට පෙර ඉවත් වීම මෙයට සම්බන්ධ වේ.</p><p>නිල syllabus එක Z = 1–38 පරමාණු/අයන සහ higher-Z Aufbau deviations පිළිබඳ අවබෝධය ඉල්ලයි. Pd වැනි 4d series exception එක සංකල්පයක් ලෙස දැනගන්න.</p>`,formula:'සාමාන්‍ය පිරවීම: 1s → 2s → 2p → 3s → 3p → 4s → 3d → 4p → 5s',mistakes:['Ion configuration ලියන විට fill order එකේ අන්තිම electron පමණක් ඉවත් කිරීම.','Hund rule යටතේ p orbitals යුගල කිරීම ඉක්මනින් කිරීම.'],source:'NIE Unit 1.4'},
trends:{title:'Periodic table building සහ s/p-block trends',brief:'Effective nuclear charge, shielding, shell number සහ electron configuration එකට සම්බන්ධ කර trends පැහැදිලි කළ යුතුය.',full:`<p>Period එකක් හරහා proton number වැඩි වන අතර core shielding බොහෝවිට විශාල ලෙස නොවෙනස් වන නිසා effective nuclear charge සාමාන්‍යයෙන් වැඩි වේ. එම නිසා atomic radius අඩු වීම හා first ionization energy/electronegativity වැඩි වීමේ ප්‍රධාන හේතුව පැහැදිලි වේ.</p><p>Group එකක් පහළට නව principal shell එකක් එකතු වන නිසා size වැඩි වෙයි; shielding වැඩි වන නිසා outer electrons nucleus වෙත ඇති ආකර්ෂණය අඩු විය හැක. එම නිසා IE සහ electronegativity සාමාන්‍යයෙන් අඩු වේ.</p><p>Ionization-energy graph එකේ zig-zag deviations subshell energy සහ paired-electron repulsion මත පැහැදිලි කළ යුතුය. Be/B, N/O, Mg/Al සහ P/S යුගල විශේෂයෙන් වැදගත්.</p><p>Radius කියන එකට covalent, metallic, van der Waals හා ionic definitions වෙනස් බැවින් data compare කිරීමේදී එකම definition භාවිත කරන්න.</p>`,formula:'Zeff ↑ across a period; shell number/shielding ↑ down a group. Trend explanations must link to attraction between nucleus and valence electrons.',mistakes:['Trend එක මතකයෙන් පමණක් ලියා හේතුව නොදීම.','electron affinity සහ electron gain energy sign convention අවුල් කිරීම.'],source:'NIE Unit 1.5–1.6'}
};

function study(){let done=Object.values(studyDone).filter(Boolean).length;main.innerHTML=heading('ඒකකය 01 — සම්පූර්ණ අධ්‍යයන මධ්‍යස්ථානය','නිල විෂය නිර්දේශයට ගැළපෙන සටහන්, අන්තර්ක්‍රියාකාරී දෘශ්‍යකරණ, ගණක, ප්‍රායෝගික සහ විභාග පුහුණුව එකම තැනක.','Atomic Structure · 33 periods')+`<section class="studyHero"><h2>පරමාණුක ව්‍යුහය • Unit 01</h2><p>2017 සිට ක්‍රියාත්මක NIE A/L Chemistry syllabus හි competency levels 1.1–1.5 අනුව සංවිධානය කර ඇත. සටහන් නිල සම්පත් පොත හා practical handbook මත පදනම් වූ සාරාංශ/පැහැදිලි කිරීම් වන අතර මුල් පොත් අකුරින් නැවත ප්‍රකාශ කරන්නේ නැත.</p><div class="studyStats"><div class="studyStat"><b>5</b>Competencies</div><div class="studyStat"><b>33</b>Periods</div><div class="studyStat"><b>1</b>Official practical</div><div class="studyStat"><b>${done}/5</b>Studied</div></div></section><div class="studyToolbar"><div><label>විෂය කොටස තෝරන්න<select id="sylFilter"><option value="all">සියල්ල</option>${syllabusMap.map(x=>`<option value="${x.id}">${x.id} · ${x.title}</option>`).join('')}</select></label></div><div><label>සටහන් / පද සොයන්න<input id="studySearch" type="search" placeholder="උදා: ionization, කාක්ෂික, Rutherford"></label></div></div><section class="card"><h2>නිල syllabus map</h2><div class="syllabusGrid" id="sylGrid">${syllabusMap.map(syllabusCard).join('')}</div></section><section class="card"><h2>විෂය කොටසකට ඉක්මනින් යන්න</h2><div class="jumpPills"><button data-jump="lab">කැතෝඩ කිරණ</button><button data-jump="rutherford">Rutherford</button><button data-jump="canal">ධන කිරණ</button><button data-jump="atom">Isotopes</button><button data-jump="spectrum">වර්ණාවලිය</button><button data-jump="orbital">Quantum</button><button data-jump="config">Configuration</button><button data-jump="trends">Periodic trends</button></div></section><section class="card"><h2>ගණක සහ Formula Lab</h2><div class="toolGrid"><div class="calcCard"><h3>Photon calculator</h3><label>λ / nm<input id="calcWave" type="number" min="1" step="1" value="500"></label><div class="calcResult" id="photonCalc"></div></div><div class="calcCard"><h3>de Broglie calculator</h3><div class="calcRow"><label>m / kg<input id="calcMass" type="number" step="any" value="9.109e-31"></label><label>v / m s⁻¹<input id="calcVel" type="number" step="any" value="1e6"></label></div><div class="calcResult" id="dbCalc"></div></div><div class="calcCard"><h3>Isotope weighted mean</h3><div class="calcRow"><label>m₁<input id="isoM1" type="number" step="any" value="35"></label><label>%₁<input id="isoP1" type="number" step="any" value="75"></label><label>m₂<input id="isoM2" type="number" step="any" value="37"></label><label>%₂<input id="isoP2" type="number" step="any" value="25"></label></div><div class="calcResult" id="isoCalc"></div></div><div class="calcCard"><h3>Quantum-number validator</h3><div class="calcRow"><label>n<input id="cvn" type="number" min="1" max="8" value="3"></label><label>l<input id="cvl" type="number" min="0" max="7" value="2"></label><label>mₗ<input id="cvm" type="number" min="-7" max="7" value="-1"></label><label>mₛ<select id="cvs"><option value="0.5">+½</option><option value="-0.5">−½</option></select></label></div><div class="calcResult" id="qCalc"></div></div></div></section><section class="card"><h2>මූලික සූත්‍ර එකතුව</h2><div class="formulaGrid"><div class="formulaBox"><b>Wave relation</b>c = νλ</div><div class="formulaBox"><b>Photon energy</b>E = hν = hc/λ</div><div class="formulaBox"><b>de Broglie</b>λ = h/mv</div><div class="formulaBox"><b>Mass–energy</b>E = mc²</div><div class="formulaBox"><b>Nuclide</b>N = A − Z</div><div class="formulaBox"><b>Hydrogen energy</b>Eₙ = −13.6/n² eV</div></div></section><section class="card"><h2>පදමාලාව / Glossary</h2><label>පදයක් සොයන්න<input id="glossSearch" type="search" placeholder="පදය හෝ අර්ථය"></label><div class="glossaryGrid" id="glossGrid" style="margin-top:10px">${glossary.map(g=>`<div class="glossaryItem"><b>${g[0]}</b><br><span>${g[1]}</span></div>`).join('')}</div></section><section class="card"><h2>නිල මූලාශ්‍ර</h2><div class="officialLinks"><a href="${officialBasis.syllabus}" target="_blank" rel="noopener">NIE Syllabus ↗</a><a href="${officialBasis.resource}" target="_blank" rel="noopener">NIE Resource Book ↗</a><a href="${officialBasis.practical}" target="_blank" rel="noopener">Practical Handbook ↗</a><a href="${officialBasis.ethak}" target="_blank" rel="noopener">e‑Thaksalawa ↗</a></div></section><section class="card"><h2>අමතර අන්තර්ක්‍රියාකාරී සම්පත්</h2><p class="small muted">NIE/e‑Thaksalawa විසින් ද මෙවැනි external learning simulations සඳහන් කරයි. මේවා internet අවශ්‍ය වන අමතර සම්පත්ය.</p><div class="officialLinks"><a href="${officialBasis.phetAtom}" target="_blank" rel="noopener">PhET · Build an Atom ↗</a><a href="${officialBasis.phetIso}" target="_blank" rel="noopener">PhET · Isotopes & Atomic Mass ↗</a><a href="${officialBasis.phetRutherford}" target="_blank" rel="noopener">PhET · Rutherford Scattering ↗</a></div></section>`;

function papers(){main.innerHTML=heading('විභාග මධ්‍යස්ථානය','නිල past-paper references + Unit 01 සඳහා මුල් exam-style පුහුණු ප්‍රශ්න.','Past papers • Practice • Marking')+`<section class="card"><h2>නිල විභාග සම්පත්</h2><p>සම්පූර්ණ past papers මෙහි නැවත පිටපත් නොකරයි. නිල පත්‍රයට link කර, Unit 01 සම්බන්ධ verified question references සාරාංශ කර ඇත.</p><div class="officialLinks"><a href="${officialBasis.exam2024}" target="_blank" rel="noopener">2024 Chemistry Paper + answers ↗</a><a href="${officialBasis.doe}" target="_blank" rel="noopener">Dept. of Examinations marking/evaluation ↗</a><a href="${officialBasis.ethak}" target="_blank" rel="noopener">e‑Thaksalawa past papers ↗</a></div><div class="copyrightNote" style="margin-top:10px">නිල past-paper text දිගින් දිගට මෙහි පිටපත් කර නැත. පහත 2024 map එක question number හා tested concept පමණක් සාරාංශ කරයි.</div></section><section class="card"><h2>2024 Unit 01 verified question map</h2><div class="pastMap">${pastMap2024.map(x=>`<article class="pastCard"><span class="qref">${x.q}</span><h3>${x.topic}</h3><p>${x.focus}</p><small>${x.type}</small></article>`).join('')}</div></section><section class="card"><h2>Unit 01 පුහුණු ප්‍රශ්න බැංකුව</h2><div class="examTools"><label>ප්‍රශ්න වර්ගය<select id="paperType"><option value="all">සියල්ල</option><option>MCQ</option><option>Structured</option></select></label><label>මාතෘකාව<select id="paperTopic"><option value="all">සියලු මාතෘකා</option>${[...new Set(practiceBank.map(x=>x.topic))].map(x=>`<option>${x}</option>`).join('')}</select></label><label>මට්ටම<select id="paperLevel"><option value="all">සියලු මට්ටම්</option><option>මූලික</option><option>මධ්‍යම</option><option>උසස්</option></select></label></div><div class="practiceGrid" id="practiceGrid"></div></section><section class="card"><h2>විභාගයට භාවිත කරන ක්‍රමය</h2><details class="learnAcc"><summary>MCQ සඳහා</summary><div class="learnAccBody"><ol><li>මුලින් concept හඳුනාගන්න.</li><li>Unit/quantity/sign conventions ලකුණු කරන්න.</li><li>Options වලින් elimination කරන්න.</li><li>Configuration/trend ප්‍රශ්නවල exception පරීක්ෂා කරන්න.</li></ol></div></details><details class="learnAcc"><summary>Structured answers සඳහා</summary><div class="learnAccBody"><ol><li>Observation සහ inference වෙන්කර ලියන්න.</li><li>Formula එක ලියා substitutions සමඟ units පෙන්වන්න.</li><li>Trend answer එකකට electron configuration / shielding / Zeff යන හේතු සම්බන්ධ කරන්න.</li><li>අවසාන answer එක significant figures සහ units සමඟ දෙන්න.</li></ol></div></details></section>`;$('paperType').onchange=renderPractice;$('paperTopic').onchange=renderPractice;$('paperLevel').onchange=renderPractice;renderPractice()}
function renderPractice(){let t=$('paperType').value,topic=$('paperTopic').value,l=$('paperLevel').value,arr=practiceBank.filter(x=>(t==='all'||x.type===t)&&(topic==='all'||x.topic===topic)&&(l==='all'||x.level===l));$('practiceGrid').innerHTML=arr.length?arr.map(x=>`<article class="questionCard" data-qid="${x.id}"><div class="questionMeta"><span>#${x.id}</span><span>${x.type}</span><span>${x.topic}</span><span>${x.level}</span></div><b>${x.q}</b><div style="margin-top:10px"><button data-reveal="${x.id}">පිළිතුර / marking point පෙන්වන්න</button></div><div class="answerBox"><b>පිළිතුර:</b> ${x.a}<br><small>${x.why}</small></div></article>`).join(''):'<p>මෙම filter එකට ප්‍රශ්න නැත.</p>';$('practiceGrid').querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>b.closest('.questionCard').classList.toggle('showAnswer'))}

function spectrum(){main.innerHTML=heading('ශක්ති මට්ටම් සහ ආලෝකය','හයිඩ්‍රජන් ඉලෙක්ට්‍රෝනයේ සංක්‍රමණයෙන් ඇති ෆෝටෝනය සොයන්න.')+richLearningResource('spectrum')+`<div class="workgrid"><div>${stage('HYDROGEN / ශක්ති සංක්‍රමණ')}<div class="card" style="margin-top:18px" id="transitionResult"></div></div><div class="card controls"><h3>හයිඩ්‍රජන් සංක්‍රමණය</h3><div><label for="ni">ආරම්භක ශක්ති මට්ටම nᵢ</label>${select('ni',[1,2,3,4,5,6],settings.ni)}</div><div><label for="nf">අවසාන ශක්ති මට්ටම n𝒻</label>${select('nf',[1,2,3,4,5,6],settings.nf)}</div><button id="transition" class="primary wide">සංක්‍රමණය පෙන්වන්න</button><div class="formula wide">Eₙ = −13.6 / n² eV<br>ΔE = hν = hc/λ</div><div class="note wide">මෙහි Eₙ සම්බන්ධතාව හයිඩ්‍රජන් සඳහායි. රූපයේ මට්ටම් අතර දුර හා කාලය පරිමාණයට නොවේ. අවශෝෂණයට නිවැරදි ΔE ඇති ෆෝටෝනයක් අවශ්‍යයි.</div></div></div><section class="card"><h2>Balmer විමෝචන රේඛා</h2><p class="small">n = 3, 4, 5, 6 → n = 2. රේඛාවක් තෝරා සංක්‍රමණය පෙන්වන්න.</p><div class="spectrum">${[656.3,486.1,434.0,410.2].map(w=>`<i class="spectraline" style="left:${(w-380)/400*100}%;background:${wavelengthColor(w)};color:${wavelengthColor(w)}"></i>`).join('')}</div><div class="axis"><span>380 nm</span><span>580 nm</span><span>780 nm</span></div><div class="rowWrap" style="margin-top:17px">${[3,4,5,6].map((n,i)=>`<button data-line="${n}">${n} → 2 · ${[656.3,486.1,434.0,410.2][i]} nm</button>`).join('')}</div></section><section class="card"><h2>තරංග ආයාමය වෙනස් කරමු</h2>${ranger('wave','තරංග ආයාමය λ (nm)',100,1500,settings.wavelength,1)}<div id="waveResult"></div><p class="small muted">λ වැඩි වන විට ν සහ එක් ෆෝටෝනයක ශක්තිය අඩු වේ. c = 2.998 × 10⁸ m s⁻¹; h = 6.626 × 10⁻³⁴ J s.</p></section>`;for(let k of ['ni','nf'])$(k).onchange=e=>{settings[k]=+e.target.value;transitionStart=0;spectrumUpdate()};$('transition').onclick=()=>{if(settings.ni===settings.nf)return toast('වෙනස් ශක්ති මට්ටම් දෙකක් තෝරන්න.');transitionStart=t+.001;paused=false;beep(transitionData().emission?650:350)};main.querySelectorAll('[data-line]').forEach(b=>b.onclick=()=>{settings.ni=+b.dataset.line;settings.nf=2;$('ni').value=settings.ni;$('nf').value=2;transitionStart=t+.001;paused=false;spectrumUpdate();beep(550)});bindRange('wave','wavelength',waveUpdate);spectrumUpdate();waveUpdate()}
function spectrumUpdate(){if(settings.ni===settings.nf){$('transitionResult').innerHTML='<p>එකම මට්ටම තෝරා ඇත. ΔE = 0; සංක්‍රමණයක් නැත.</p>';return}let d=transitionData();$('transitionResult').innerHTML=`<h3>${d.emission?'විමෝචනය':'අවශෝෂණය'} · ${d.region}</h3><div class="three"><div><span class="metric">${d.nm.toFixed(1)}</span><small>λ / nm</small></div><div><span class="metric">${d.delta.toFixed(3)}</span><small>|ΔE| / eV</small></div><div><span class="metric">${(d.delta*1.602176634).toFixed(3)}</span><small>ශක්තිය / 10⁻¹⁹ J</small></div></div>`}
function waveUpdate(){let w=settings.wavelength,nu=2.99792458e17/w,en=6.62607015e-34*nu;$('waveResult').innerHTML=`<div class="formula" style="border-left:6px solid ${wavelengthColor(w)}">ν = ${nu.toExponential(3)} Hz &nbsp; | &nbsp; E = ${en.toExponential(3)} J</div><p class="small">${w<380?'පාරජම්බුල කලාපය':w>780?'අධෝරක්ත කලාපය':'දෘශ්‍ය කලාපය'} · E ≈ ${(en/1.602176634e-19).toFixed(3)} eV</p>`}
const subOrder=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6],['5s',2]];
function configuration(z,q=0){let a=[],left=z;for(let [name,cap] of subOrder){let x=Math.min(cap,left);a.push({name,cap,count:x});left-=x}if(z===24){a[5].count=1;a[6].count=5}if(z===29){a[5].count=1;a[6].count=10}if(q>0){let order=a.map((v,i)=>i).sort((i,j)=>(+a[j].name[0]-+a[i].name[0])||('spd'.indexOf(a[j].name[1])-'spd'.indexOf(a[i].name[1])));for(let i of order){let m=Math.min(q,a[i].count);a[i].count-=m;q-=m}}else if(q<0){let extra=-q;for(let v of a){let m=Math.min(extra,v.cap-v.count);v.count+=m;extra-=m}}return a}

function notebook(){main.innerHTML=heading('මගේ නිරීක්ෂණ පොත','තෝරාගත් පාලන, නිරීක්ෂණ සහ ඔබේ නිගමන එක තැනක.')+`<section class="card"><div class="rowWrap noprint"><button id="exportTxt" class="primary">වාර්තාව බාගත කරන්න</button><button id="exportJson">උපස්ථ ගොනුව</button><button id="print">මුද්‍රණය / PDF</button></div><p class="small muted">${storageOK?'සටහන් මෙම බ්‍රවුසරයේ සුරැකී ඇත. වෙනත් දුරකථනයකට ස්වයංක්‍රීයව සමමුහුර්ත නොවේ.':'මෙම බ්‍රවුසරයේ ස්ථිර සුරැකීම ලබාගත නොහැක. සැසිය අවසන් කිරීමට පෙර වාර්තාව බාගත කරන්න.'}</p><h2>නිරීක්ෂණ ${records.length}</h2>${records.length?records.map((r,i)=>`<article class="reportEntry"><b>${i+1}. ${esc(r.experiment)}</b> · ${esc(r.date)}<br><span class="muted">${esc(r.settings)}</span><p>${esc(r.observation)}</p><b>මගේ නිගමනය:</b> ${esc(r.note||'ලියා නැත')}</article>`).join(''):'<div class="note">තවම නිරීක්ෂණ නැත. කැතෝඩ කිරණ පරීක්ෂණයක් ක්‍රියාත්මක කර “සටහන් කරන්න” තෝරන්න.</div>'}<details class="noprint"><summary>සටහන් මකා දැමීම</summary><p class="small">මෙම බ්‍රවුසරයේ නිරීක්ෂණ පමණක් මැකේ. පෙර බාගත කළ ගොනු වෙනස් නොවේ.</p><button id="clearRecords">නිරීක්ෂණ සියල්ල මකන්න</button><button id="confirmClear" class="danger hidden">තහවුරු කර මකන්න</button></details></section>`;$('exportTxt').onclick=()=>download('Chemistry-Unit1-Observations.txt','ඒකකය 01 — පරමාණුක ව්‍යුහය\nඅතථ්‍ය පරීක්ෂණ නිරීක්ෂණ (සැබෑ මිනුම් නොවේ)\n\n'+records.map((r,i)=>`${i+1}. ${r.experiment}\n${r.date}\n${r.settings}\n${r.observation}\nමගේ නිගමනය: ${r.note||'—'}\n`).join('\n'));$('exportJson').onclick=()=>download('Chemistry-Unit1-Backup.json',JSON.stringify({version:1,records,notes,taskFlags,quizAnswers},null,2),'application/json');$('print').onclick=()=>window.print();$('clearRecords').onclick=()=>$('confirmClear').classList.remove('hidden');$('confirmClear').onclick=()=>{records=[];save();notebook();toast('නිරීක්ෂණ මකා දැමුවා.')};}

function sources(){main.innerHTML=heading('මූලාශ්‍ර හා අන්තර්ගත ආවරණය','නිල ප්‍රායෝගිකය, අමතර සංකල්ප සහ ආකෘති සීමා පැහැදිලිව හඳුනාගන්න.')+`<section class="card"><h2>මෙම සංස්කරණයේ පදනම</h2><p><b>National Institute of Education — G.C.E. (A/L) Chemistry Practical Handbook, 2018.</b> ඔබ ලබාදුන් පිටු 148 PDF අත්පොත. ඒකකය 01, පරීක්ෂණය 1, මුද්‍රිත පිටු 10–14 (PDF පිටු 18–22).</p><p class="small">අත්පොතේ අංකිත පරීක්ෂණ 45 සහ අමතර ක්‍රියාකාරකම් සමාලෝචනය කර ඇත. මෙය සම්පූර්ණ න්‍යායාත්මක සම්පත් පොත් කට්ටලය නොවේ. මෙම යෙදුම ඒකකය 01 සඳහායි; අනෙකුත් ඒකකවල ක්‍රියාත්මක අනුකරණ මෙහි ඇතුළත් කර නැත.</p><p class="small">2017 විෂය නිර්දේශයේ ඒකක 14කි. අත්පොතේ පටුනේ 42–45 සඳහා 13 ලෙස සඳහන් වුවත් අදාළ පරිච්ඡේද ශීර්ෂ අනුව ඒවා ඒකක 14ට අදාළය.</p><div class="rowWrap"><a href="https://nie.lk/pdffiles/other/eALOM%20Chemistry%20Practical%20Handbook.pdf" target="_blank" rel="noopener">NIE ප්‍රායෝගික අත්පොත ↗</a><a href="https://www.nie.lk/pdffiles/tg/AL_Syl%20Chemistry2017.pdf" target="_blank" rel="noopener">නිල විෂය නිර්දේශය ↗</a><a href="https://nie.lk/showom" target="_blank" rel="noopener">NIE සම්පත් පොත් ↗</a></div></section><section class="card"><h2>ඒකකය 01 — මේ යෙදුමෙන් කළ හැකි දේ</h2><div class="scroll"><table><tr><th>කොටස</th><th>ක්‍රියාකාරකම</th><th>වර්ගය</th></tr><tr><td>කැතෝඩ කිරණ I–IV</td><td>කුරුසය, රෝදය, විද්‍යුත් හා චුම්බක ක්ෂේත්‍ර වෙනස් කර නිරීක්ෂණ සටහන් කිරීම</td><td>නිල ප්‍රායෝගිකයට අනුරූප සරල කළ ආකෘති</td></tr><tr><td>රදර්ෆර්ඩ් හා ධන කිරණ</td><td>ඓතිහාසික සාක්ෂි සහ අංශු ගුණ සසඳීම</td><td>සංකල්ප අධ්‍යයනය</td></tr><tr><td>පරමාණු හා සමස්ථානික</td><td>p, n, e; අයන; බරිත සාමාන්‍යය</td><td>ගණනය කළ හැකි ආකෘතිය</td></tr><tr><td>කාක්ෂික හා ක්වොන්ටම් අංක</td><td>s, p, d හැඩ හරවා බැලීම; අවසර ලත් අංක</td><td>සංකේතාත්මක 3D ආකෘති</td></tr><tr><td>වර්ණාවලි</td><td>ශක්ති සංක්‍රමණ, λ, ν හා E</td><td>හයිඩ්‍රජන් ආදර්ශ ගණනය</td></tr><tr><td>වින්‍යාස හා ප්‍රවණතා</td><td>Z = 1–38 වින්‍යාස; පළමු 20 මූලද්‍රව්‍ය ප්‍රවණතා</td><td>සංකල්ප අධ්‍යයනය</td></tr></table></div></section><section class="card"><h2>අත්පොත අනුව ඉදිරි ඒකක සැලැස්ම</h2><div class="scroll"><table><tr><th>ඒකකය</th><th>අන්තර්ගතය</th><th>පරීක්ෂණ අංක</th><th>ප්‍රායෝගික අවධානය</th></tr>${unitMap.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div></section><section class="card"><h2>භාවිතය සහ සීමා</h2><ul class="steps"><li>HTML ගොනුව බාගත කර Chrome, Edge හෝ Firefox තුළ විවෘත කරන්න. දුරකථනයේ ගොනු පෙරදසුන වෙනුවට බ්‍රවුසරයෙන් විවෘත කරන්න.</li><li>3D දසුන ඇදගෙන හරවන්න. විශාලනය සඳහා + / − භාවිත කරන්න. ශබ්දය ඔබ සක්‍රිය කළ පසු පමණක් ඇසේ.</li><li>සජීවීකරණ නවතා තනි දසුනක් අධ්‍යයනය කළ හැකියි. වර්ණ හඳුනාගැනීමට ලේබල් සහ පැහැදිලි කිරීම් ද යොදා ඇත.</li><li>නිරීක්ෂණ දත්ත මේ උපාංගයේ බ්‍රවුසරයට පමණක් අදාළය. වාර්තාව බාගත කර තබාගන්න.</li><li>අනුකරණ දත්ත සැබෑ උපකරණ මිනුම් නොවේ. මූලික පරීක්ෂණ සඳහා නිල අත්පොත හා ගුරු මඟපෙන්වීම භාවිත කරන්න.</li><li>මෙය NIE නිල යෙදුමක් හෝ NIE අනුමත නිෂ්පාදනයක් නොවේ. සම්පූර්ණ සම්පත් පොත් කට්ටලය සමඟ තවදුරටත් ගැළපීම පරීක්ෂා කළ යුතුය.</li></ul></section>`}

// Standalone perspective renderer. Every vertex is transformed in 3D; no external libraries or assets.
let ctx,W,H,scale,drawQueue=[];
function project(p){let [x,y,z]=p,c=Math.cos(angleY),s=Math.sin(angleY),xx=x*c+z*s,zz=-x*s+z*c,cx=Math.cos(angleX),sx=Math.sin(angleX),yy=y*cx-zz*sx,z2=y*sx+zz*cx,k=12/(12-z2);return {x:W/2+xx*scale*k,y:H/2-yy*scale*k,z:z2,k}}
function line3(points,color='#4e7383',width=1,dash=[]){let ps=points.map(project);drawQueue.push({z:ps.reduce((s,p)=>s+p.z,0)/ps.length,draw:()=>{ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}})}
function poly3(points,color,stroke){let ps=points.map(project);drawQueue.push({z:ps.reduce((s,p)=>s+p.z,0)/ps.length,draw:()=>{ctx.beginPath();ps.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}})}
function ball(p,r,color,glow=false){let q=project(p),rr=r*scale*q.k;drawQueue.push({z:q.z,draw:()=>{if(glow){ctx.shadowColor=color;ctx.shadowBlur=12}let g=ctx.createRadialGradient(q.x-rr*.3,q.y-rr*.35,0,q.x,q.y,Math.max(.01,rr));g.addColorStop(0,'#f1fffc');g.addColorStop(.27,color);g.addColorStop(1,'#102a38');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.x,q.y,Math.max(.5,rr),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}})}
function text3(s,p,color='#bcd2d9',size=12){let q=project(p);drawQueue.push({z:q.z+.03,draw:()=>{ctx.font=`${size}px system-ui,sans-serif`;ctx.textAlign='center';ctx.fillStyle=color;ctx.fillText(s,q.x,q.y)}})}
function circle3(center,r,axis,color,width=1){let pts=[];for(let i=0;i<=64;i++){let a=i/64*Math.PI*2,xy=r*Math.cos(a),zz=r*Math.sin(a);pts.push(axis==='x'?[center[0],center[1]+xy,center[2]+zz]:axis==='y'?[center[0]+xy,center[1],center[2]+zz]:[center[0]+xy,center[1]+zz,center[2]])}line3(pts,color,width)}

function cylinder(x1,x2,r){circle3([x1,0,0],r,'x','#8ebcc780');circle3([x2,0,0],r,'x','#8ebcc780');for(let i=0;i<12;i++){let a=i/12*Math.PI*2;line3([[x1,r*Math.cos(a),r*Math.sin(a)],[x2,r*Math.cos(a),r*Math.sin(a)]],i%3?'#456d7b25':'#9abfc370',1)}poly3([[x1,-r,0],[x2,-r,0],[x2,r,0],[x1,r,0]],'#83bace08')}

function drawCanal(){grid();cylinder(-3.3,3.3,.85);disk3(-1.3,.73,'#6c7b8180');for(let a of [-.35,0,.35])circle3([-1.31,a,0],.08,'x','#bddad6',2);disk3(2.8,.6,'#b19a66');text3('කැතෝඩය (−)',[-1.3,1.15,0],'#a3dbea');text3('ඇනෝඩය (+)',[2.8,1.15,0],'#e8c17a');text3('ධන කිරණ ←',[-2.5,-1.25,0],'#f9c66f');text3('කැතෝඩ කිරණ →',[1,-1.25,0],'#77e3b3');let m={H:1,He:4,Ne:20}[settings.gas];for(let i=0;i<26;i++){let f=(i/26+t*.35)%1;ball([-1.2+4*f,.22,0],.035,'#7ae1ba');let f2=(i/26+t*.3/Math.sqrt(m))%1;ball([2.6-5.7*f2,-.22,0],.047,'#f4c565')}}
function drawAtom(){grid();let A=settings.z+settings.n;for(let i=0;i<A;i++){let r=.15*Math.cbrt(i+1),a=i*2.399,b=Math.acos(1-2*((i*.618)%1));ball([r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a)],.13,i<settings.z?'#ed997f':'#8fb2c6')}let e=settings.z-settings.charge,fill=[0,0,0,0],idx=0;for(const v of configuration(settings.z,settings.charge))fill[+v.name[0]-1]+=v.count;for(let shell=0;shell<4&&e>0;shell++){let count=Math.min(fill[shell],e),rad=1.1+shell*.5;circle3([0,0,0],rad,'z','#84b5b650',1);for(let i=0;i<count;i++){let a=2*Math.PI*i/count+t*(.35/(shell+1));ball([rad*Math.cos(a),rad*Math.sin(a),0],.07,'#88e6c4',true)}e-=count;idx++}text3('p⁺',[-3,1,0],'#ed997f');text3('n⁰',[-3,.5,0],'#8fb2c6');text3('e⁻',[-3,0,0],'#88e6c4');}
function orbitalMesh(){let o=settings.orb;for(let axis of ['x','y','z']){let p=axis==='x'?[3,0,0]:axis==='y'?[0,3,0]:[0,0,3];line3([p.map(x=>-x),p],'#65818b70',1);text3(axis,p,'#bad3dc',12)}const steps=22,phiSteps=36;function vertex(th,ph){let x=Math.sin(th)*Math.cos(ph),y=Math.cos(th),z=Math.sin(th)*Math.sin(ph),f=o==='s'?1:o==='px'?x:o==='py'?y:o==='pz'?z:o==='dxy'?2*x*y:o==='dxz'?2*x*z:o==='dyz'?2*y*z:o==='dx2'?x*x-y*y:(3*z*z-1)/2,r=o==='s'?1.45:2.3*Math.sqrt(Math.abs(f));return {p:[x*r,y*r,z*r],sign:f,light:.56+.26*(y+1)/2+.18*(x+1)/2}}
for(let i=0;i<steps;i++)for(let j=0;j<phiSteps;j++){let a=vertex(i/steps*Math.PI,j/phiSteps*2*Math.PI),b=vertex((i+1)/steps*Math.PI,j/phiSteps*2*Math.PI),c=vertex((i+1)/steps*Math.PI,(j+1)/phiSteps*2*Math.PI),d=vertex(i/steps*Math.PI,(j+1)/phiSteps*2*Math.PI),base=a.sign>=0?[71,198,170]:[222,157,87],col=`rgb(${base.map(v=>Math.round(v*a.light)).join(',')})`;poly3([a.p,b.p,c.p,d.p],col)}ball([0,0,0],.08,'#edf4f2')}
let pathCache={};
function rPath(theta,b){const key=[settings.model,settings.energy,settings.nucleus,b].join('/');if(pathCache.key===key)return pathCache.points;if(settings.model==='diffuse'){let pts=[];for(let i=0;i<=160;i++){let x=-4+i*.05;pts.push([x,b/3+.08*Math.log(1+Math.exp(x*2)),0])}pathCache={key,points:pts};return pts}let x=-25,y=b/3,vx=1,vy=0,h=.002,a=1.439964*settings.nucleus/(settings.energy*300),pts=[];for(let i=0;i<22000;i++){let r=Math.hypot(x,y),ax=a*x/r**3,ay=a*y/r**3;vx+=ax*h/2;vy+=ay*h/2;x+=vx*h;y+=vy*h;r=Math.hypot(x,y);vx+=a*x/r**3*h/2;vy+=a*y/r**3*h/2;if(i%12===0&&Math.abs(x)<4.1&&Math.abs(y)<4.1)pts.push([x,y,0]);if(r>7&&x>-7&&i>12500)break;if(vx<0&&x<-4.1)break}pathCache={key,points:pts};return pts}

function drawSpectrum(){let left=-2.6,right=.8;for(let n=1;n<=6;n++){let y=-1.75+(n-1)*.65;line3([[left,y,0],[right,y,0]],'#5a929b',2);text3('n='+n,[left-.5,y+.04,0],'#c4d9de');text3((-13.6/n**2).toFixed(2)+' eV',[right+.7,y+.04,0],'#a8c6d0',11)}let yi=-1.75+(settings.ni-1)*.65,yf=-1.75+(settings.nf-1)*.65,elapsed=transitionStart?Math.max(0,t-transitionStart):0;if(settings.ni===settings.nf){ball([-1.1,yi,0],.1,'#8fedc6',true);return}let d=transitionData(),f=transitionStart?Math.max(0,Math.min(1,(elapsed-(d.emission?0:1.4))/1.7)):0;ball([-1.1,yi+(yf-yi)*f,0],.1,'#8fedc6',true);line3([[-.5,yi,0],[-.5,yf,0]],'#e9b267',2,[4,4]);let ph=d.emission?Math.max(0,Math.min(1,(elapsed-1.7)/1.4)):Math.min(1,elapsed/1.4),show=transitionStart&&(d.emission?elapsed>=1.7:elapsed<=1.4);if(show){let px=d.emission?-.7+ph*4:3.3-ph*4,py=d.emission?yf:yi;ball([px,py,0],.07,wavelengthColor(d.nm),true);let wave=[];for(let i=0;i<20;i++)wave.push([px+i*.035,py+Math.sin(i*.65)*.1,0]);line3(wave,wavelengthColor(d.nm),2)}text3(d.region,[2.4,yf+.65,0],'#c2d6dc',11)}
function frame(now){let dt=Math.max(0,Math.min(.05,(now-last)/1000||0));last=now;if(!paused)t+=dt;let canvas=$('scene');if(canvas){let rect=canvas.getBoundingClientRect();W=rect.width;H=rect.height;let dpr=Math.min(2,window.devicePixelRatio||1);if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr)}ctx=canvas.getContext('2d');if(ctx){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);let bg=ctx.createRadialGradient(W*.5,H*.4,10,W*.5,H*.4,W*.65);bg.addColorStop(0,'#193a49');bg.addColorStop(1,'#0b202f');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);scale=Math.min(W/9.5,H/6.4)*zoom;drawQueue=[];if(page==='lab')drawLab(dt);if(page==='canal')drawCanal();if(page==='atom')drawAtom();if(page==='orbital')orbitalMesh();if(page==='rutherford')drawRutherford();if(page==='spectrum')drawSpectrum();drawQueue.sort((a,b)=>a.z-b.z);for(let obj of drawQueue)obj.draw()}}raf=requestAnimationFrame(frame)}
